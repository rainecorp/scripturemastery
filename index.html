<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Line Upon Line — Scripture Quest</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800&display=swap" rel="stylesheet">
<style>

  :root{
    --indigo:#1a6b8a;
    --indigo-d:#155f7a;
    --violet:#0e7490;
    --deep:#070d1f;
    --bg:#0b2d42;
    --panel:#ffffff;
    --panel-soft:#f8fbff;
    --ink:#1e293b;
    --muted:#64748b;
    --line:#e2e8f0;
    --line-2:#bfd5df;
    --gold:#f4b942;
    --gold-2:#d97706;
    --green:#16a34a;
    --green-bg:#e7f6ec;
    --red:#dc2626;
    --red-bg:#fdeaea;
    --aqua:#22d3ee;
    --teal:#34d399;
    --shadow:0 10px 26px rgba(11,45,66,.13);
    --shadow-sm:0 2px 10px rgba(11,45,66,.07);
    --font:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  }

  *{box-sizing:border-box;}
  html{margin:0;padding:0;-webkit-text-size-adjust:100%;}
  body{
    margin:0;
    padding:0;
    min-height:100vh;
    color:var(--ink);
    font-family:var(--font);
    line-height:1.35;
    background:linear-gradient(180deg,#070d1f 0%,#0b2d42 38%,#134e6b 70%,#1a6b8a 100%);
    overflow-x:hidden;
    -webkit-tap-highlight-color:transparent;
  }
  body::before{
    content:"";
    position:fixed;
    inset:0;
    pointer-events:none;
    z-index:-2;
    background:
      radial-gradient(circle at 18% 8%, rgba(255,255,255,.14), transparent 28%),
      radial-gradient(circle at 88% 16%, rgba(34,211,238,.14), transparent 25%),
      radial-gradient(circle at 48% 100%, rgba(244,185,66,.10), transparent 35%);
  }
  body::after{
    content:"";
    position:fixed;
    inset:0;
    pointer-events:none;
    z-index:-1;
    opacity:.12;
    background-image:
      linear-gradient(rgba(255,255,255,.30) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,.22) 1px, transparent 1px);
    background-size:34px 34px;
    mask-image:radial-gradient(circle at 50% 35%, #000, transparent 78%);
  }
  ::selection{background:var(--gold); color:#111827;}
  a{color:inherit;}

  .wrap{
    width:min(640px,100%);
    margin:0 auto;
    padding:14px 14px calc(86px + env(safe-area-inset-bottom,0px));
    position:relative;
  }

  header.top{
    position:relative;
    overflow:hidden;
    margin:0 0 12px;
    padding:18px 18px 16px;
    border:1px solid rgba(94,234,212,.26);
    border-radius:24px;
    color:#fff;
    background:
      radial-gradient(circle at 84% 8%, rgba(52,211,153,.24), transparent 34%),
      radial-gradient(circle at 12% 100%, rgba(244,185,66,.17), transparent 35%),
      linear-gradient(145deg, rgba(16,32,57,.98), rgba(7,13,31,.98));
    box-shadow:0 14px 34px rgba(0,5,20,.38);
  }
  header.top::after{
    content:"";
    position:absolute;
    right:-34px;
    bottom:-64px;
    width:170px;
    height:170px;
    border-radius:50%;
    border:24px solid rgba(255,255,255,.035);
  }
  header.top .brand{
    position:relative;
    z-index:1;
    display:flex;
    flex-direction:column;
    align-items:center;
    text-align:center;
    min-width:0;
  }
  header.top .brand small{
    color:var(--gold);
    font-size:10px;
    font-weight:950;
    letter-spacing:.16em;
    text-transform:uppercase;
  }
  header.top h1{
    margin:3px 0 0;
    color:#fff;
    font-size:clamp(30px,8vw,44px);
    line-height:1.02;
    font-weight:950;
    letter-spacing:-.03em;
    text-wrap:balance;
  }
  header.top h1::after{
    content:"Memorize, recite, and seal each verse.";
    display:block;
    max-width:400px;
    margin:7px auto 0;
    color:#aabbd8;
    font-size:12.5px;
    line-height:1.35;
    font-weight:700;
    letter-spacing:0;
  }

  .stats{
    position:relative;
    z-index:1;
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:7px;
    margin-top:13px;
  }
  .stat{
    min-width:0;
    text-align:center;
    color:#eaf4ff;
    background:rgba(255,255,255,.075);
    border:1px solid rgba(255,255,255,.12);
    border-radius:999px;
    padding:7px 8px;
  }
  .stat .n{
    color:#fff;
    font-size:20px;
    line-height:1;
    font-weight:950;
    white-space:nowrap;
  }
  .stat .l{
    margin-top:3px;
    color:#aabbd8;
    font-size:9px;
    font-weight:900;
    line-height:1.05;
    text-transform:uppercase;
    letter-spacing:.08em;
    white-space:nowrap;
  }

  nav.tabs{
    display:flex;
    gap:8px;
    width:100%;
    margin:10px 0 14px;
    padding:6px;
    border-radius:18px;
    background:rgba(255,255,255,.94);
    border:1px solid rgba(255,255,255,.55);
    box-shadow:var(--shadow-sm);
  }
  nav.tabs button{
    appearance:none;
    border:0;
    flex:1;
    min-height:42px;
    padding:9px 12px;
    border-radius:14px;
    background:transparent;
    color:var(--muted);
    font-family:var(--font);
    font-size:14px;
    font-weight:900;
    cursor:pointer;
    transition:transform .08s, box-shadow .15s, background .15s;
  }
  nav.tabs button.active{
    color:#fff;
    background:linear-gradient(135deg,var(--indigo),var(--violet));
    box-shadow:0 4px 0 var(--indigo-d);
  }
  nav.tabs button:active{transform:translateY(2px);}

  .volume{
    margin:0 0 16px;
    padding:12px;
    border-radius:22px;
    background:rgba(255,255,255,.94);
    border:1px solid rgba(255,255,255,.55);
    box-shadow:var(--shadow-sm);
  }
  .volume h2{
    display:flex;
    align-items:center;
    gap:8px;
    margin:0 0 9px;
    color:var(--indigo-d);
    font-size:12px;
    font-weight:950;
    line-height:1.1;
    letter-spacing:.09em;
    text-transform:uppercase;
  }
  .volume h2::before{
    content:"✦";
    color:var(--gold-2);
    font-size:14px;
  }
  .verse-grid{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(220px,1fr));
    gap:9px;
  }
  .card{
    --level-color:#f97316;
    --level-color-soft:rgba(249,115,22,.16);
    position:relative;
    overflow:hidden;
    padding:13px 14px;
    min-height:96px;
    cursor:pointer;
    border:2.5px solid var(--level-color);
    border-radius:16px;
    background:
      linear-gradient(180deg,rgba(255,255,255,.98),rgba(255,255,255,.93)),
      radial-gradient(circle at 100% 100%,var(--level-color-soft),transparent 54%);
    box-shadow:0 2px 0 rgba(11,45,66,.05), 0 0 0 4px var(--level-color-soft);
    transition:transform .12s, border-color .12s, background .12s, box-shadow .12s;
  }
  .card.level-0,.study.level-0{--level-color:#f97316;--level-color-soft:rgba(249,115,22,.17);} /* Easy */
  .card.level-1,.study.level-1{--level-color:#facc15;--level-color-soft:rgba(250,204,21,.2);} /* Medium */
  .card.level-2,.study.level-2{--level-color:#a3e635;--level-color-soft:rgba(163,230,53,.19);} /* Hard */
  .card.level-3,.study.level-3{--level-color:#22c55e;--level-color-soft:rgba(34,197,94,.18);} /* Challenge */
  .card.level-4,.study.level-4{--level-color:#14b8a6;--level-color-soft:rgba(20,184,166,.19);} /* Impossible */
  .card.sealed-card{
    --level-color:#22d3ee;
    --level-color-soft:rgba(34,211,238,.22);
    border-color:rgba(125,249,255,.95);
    background:
      linear-gradient(120deg,rgba(255,255,255,.98) 0%,rgba(236,254,255,.98) 33%,rgba(255,255,255,.98) 47%,rgba(224,242,254,.97) 68%,rgba(255,255,255,.98) 100%);
    box-shadow:0 0 0 4px rgba(34,211,238,.15), 0 12px 28px rgba(8,145,178,.18), inset 0 0 18px rgba(255,255,255,.7);
  }
  .card::after{
    content:"";
    position:absolute;
    inset:auto -36px -46px auto;
    width:110px;
    height:110px;
    border-radius:50%;
    background:var(--level-color-soft);
  }
  .card.sealed-card::before{
    content:"";
    position:absolute;
    inset:-55% -80%;
    background:linear-gradient(115deg,transparent 42%,rgba(255,255,255,.78) 50%,transparent 58%);
    transform:translateX(-25%) rotate(8deg);
    pointer-events:none;
    animation:shineSweep 3.8s ease-in-out infinite;
    z-index:1;
  }
  @keyframes shineSweep{
    0%,55%{transform:translateX(-35%) rotate(8deg); opacity:0;}
    65%{opacity:1;}
    100%{transform:translateX(35%) rotate(8deg); opacity:0;}
  }
  .card:hover{
    transform:translateY(-2px);
    border-color:var(--level-color);
    box-shadow:0 8px 22px rgba(11,45,66,.13), 0 0 0 5px var(--level-color-soft);
  }
  .card .ref{
    position:relative;
    z-index:1;
    color:var(--ink);
    font-size:16px;
    line-height:1.12;
    font-weight:950;
    padding-right:56px;
    overflow-wrap:anywhere;
  }
  .card .theme{
    position:relative;
    z-index:1;
    margin-top:4px;
    color:var(--muted);
    font-size:12.5px;
    line-height:1.3;
    font-weight:700;
    overflow-wrap:anywhere;
  }
  .card .stage-row{
    position:relative;
    z-index:1;
    display:flex;
    gap:4px;
    margin-top:12px;
  }
  .pip{
    flex:1;
    min-width:12px;
    height:6px;
    border-radius:999px;
    background:#eef1f6;
    border:1px solid #dbe6ec;
  }
  .pip.done{background:linear-gradient(90deg,var(--level-color),color-mix(in srgb,var(--level-color) 72%,#fff)); border-color:var(--level-color); box-shadow:0 0 8px var(--level-color-soft);}
  .pip.sealed{background:linear-gradient(90deg,#67e8f9,#e0f2fe,#22d3ee); border-color:rgba(34,211,238,.75); box-shadow:0 0 10px rgba(34,211,238,.25);}
  .difficulty-badge{
    position:absolute;
    top:12px;
    right:14px;
    z-index:3;
    display:grid;
    place-items:center;
    width:34px;
    height:34px;
    border-radius:999px;
    font-size:24px;
    background:rgba(255,255,255,.76);
    border:1px solid rgba(255,255,255,.85);
    box-shadow:0 5px 14px rgba(11,45,66,.12), inset 0 1px 0 rgba(255,255,255,.75);
  }

  .popular-bookmark{
    position:absolute;
    top:-2px;
    left:14px;
    z-index:4;
    width:28px;
    height:38px;
    display:flex;
    align-items:flex-start;
    justify-content:center;
    padding-top:6px;
    font-size:16px;
    line-height:1;
    color:#3a2205;
    background:linear-gradient(180deg,#fde68a 0%,#f59e0b 92%);
    border:1px solid rgba(180,83,9,.34);
    border-top:0;
    border-radius:0 0 8px 8px;
    box-shadow:0 5px 10px rgba(180,83,9,.18), inset 0 1px 0 rgba(255,255,255,.65);
  }
  .popular-bookmark::after{
    content:"";
    position:absolute;
    left:50%;
    bottom:-1px;
    transform:translateX(-50%);
    width:0;
    height:0;
    border-left:7px solid transparent;
    border-right:7px solid transparent;
    border-bottom:7px solid rgba(255,255,255,.96);
  }
  .card.popular-card .ref{padding-left:34px;}
  .card.popular-card .theme{padding-left:34px;}
  .study-popular{
    display:inline-flex;
    align-items:center;
    gap:7px;
    width:max-content;
    max-width:100%;
    margin:2px 0 0;
    padding:7px 10px;
    border-radius:999px;
    color:#78350f;
    background:linear-gradient(180deg,#fffbeb,#fde68a);
    border:1px solid rgba(245,158,11,.45);
    box-shadow:0 3px 0 rgba(180,83,9,.24);
    font-size:11px;
    font-weight:950;
    line-height:1;
    letter-spacing:.04em;
    text-transform:uppercase;
  }
  .legend-row{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
    align-items:center;
    justify-content:center;
    margin:-14px 0 18px;
  }
  .legend-pill{
    display:inline-flex;
    align-items:center;
    gap:7px;
    padding:7px 10px;
    border-radius:999px;
    background:rgba(255,255,255,.9);
    border:1px solid rgba(226,232,240,.95);
    box-shadow:0 2px 8px rgba(11,45,66,.07);
    color:var(--muted);
    font-size:11px;
    font-weight:900;
  }

  .filter-panel{
    margin:-5px 0 14px;
    padding:10px;
    border-radius:20px;
    background:rgba(255,255,255,.94);
    border:1px solid rgba(255,255,255,.6);
    box-shadow:var(--shadow-sm);
  }
  .filter-title{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    margin:0 0 8px;
    color:var(--indigo-d);
    font-size:12px;
    font-weight:950;
    letter-spacing:.08em;
    text-transform:uppercase;
  }
  .filter-title .count{
    color:var(--muted);
    font-size:11px;
    font-weight:900;
    letter-spacing:0;
    text-transform:none;
  }
  .filter-chips{
    display:flex;
    flex-wrap:wrap;
    gap:7px;
  }
  .filter-chip{
    appearance:none;
    border:1px solid #dbe6ec;
    border-radius:999px;
    background:#f5f9fb;
    color:#64748b;
    min-height:34px;
    padding:7px 10px;
    box-shadow:0 2px 0 #e3edf3;
    font-family:var(--font);
    font-size:12px;
    font-weight:950;
    cursor:pointer;
    transition:transform .08s, box-shadow .15s, background .15s;
  }
  .filter-chip.active{
    color:#3a2205;
    border-color:#facc15;
    background:linear-gradient(180deg,#fef3c7,#fbbf24);
    box-shadow:0 3px 0 #b45309;
  }
  .filter-chip:active{transform:translateY(2px);}
  .getting-started-note{
    margin:0 0 10px;
    padding:11px 12px;
    border-radius:16px;
    color:#075985;
    background:linear-gradient(180deg,#ecfeff,#f8fbff);
    border:1px solid rgba(34,211,238,.35);
    box-shadow:0 2px 8px rgba(11,45,66,.06);
    font-size:12.5px;
    font-weight:850;
    line-height:1.35;
  }

  .sealed-card .difficulty-badge{
    background:linear-gradient(135deg,#fff7ed,#e0f2fe 52%,#ffffff);
    box-shadow:0 0 16px rgba(34,211,238,.35), inset 0 1px 0 rgba(255,255,255,.95);
  }
  .card .seal-tag{
    position:relative;
    z-index:2;
    display:inline-flex;
    width:max-content;
    margin-top:9px;
    padding:4px 8px;
    color:#075985;
    background:linear-gradient(90deg,#ecfeff,#ffffff,#cffafe);
    border:1px solid rgba(34,211,238,.65);
    border-radius:999px;
    font-size:9px;
    font-weight:950;
    line-height:1;
    letter-spacing:.08em;
    text-transform:uppercase;
    box-shadow:0 0 12px rgba(34,211,238,.2);
  }

  .study{
    --level-color:#f97316;
    --level-color-soft:rgba(249,115,22,.16);
    position:relative;
    overflow:hidden;
    padding:14px;
    border-radius:22px;
    background:
      linear-gradient(180deg,rgba(255,255,255,.97),rgba(248,251,255,.96)),
      radial-gradient(circle at 100% 0%,var(--level-color-soft),transparent 48%);
    border:2.5px solid var(--level-color);
    box-shadow:var(--shadow), 0 0 0 5px var(--level-color-soft);
  }
  .study::before{
    content:"";
    position:absolute;
    inset:0;
    pointer-events:none;
    background:
      radial-gradient(circle at 90% 0%, rgba(34,211,238,.12), transparent 34%),
      radial-gradient(circle at 0% 100%, rgba(244,185,66,.10), transparent 32%);
  }
  .study > *{position:relative; z-index:1;}
  .study-head{
    display:flex;
    flex-direction:column;
    gap:7px;
    align-items:flex-start;
    margin-bottom:10px;
  }
  .study-head .ref{
    color:#fff;
    background:linear-gradient(135deg,var(--indigo),var(--violet));
    border-radius:16px;
    padding:10px 13px;
    box-shadow:0 4px 0 var(--indigo-d);
    font-size:22px;
    font-weight:950;
    line-height:1.05;
    overflow-wrap:anywhere;
    max-width:100%;
  }
  .study-head .theme{
    width:100%;
    color:var(--muted);
    background:#f1f7fa;
    border:1px solid #dbeaf0;
    border-radius:14px;
    padding:8px 10px;
    font-size:12.5px;
    font-weight:800;
    line-height:1.32;
    overflow-wrap:anywhere;
  }
  .stage-label{
    width:max-content;
    max-width:100%;
    margin:12px auto 10px;
    padding:7px 12px;
    color:#3a2205;
    background:linear-gradient(180deg,#fbbf24,#f59e0b);
    border-radius:999px;
    box-shadow:0 3px 0 #b45309;
    font-size:10px;
    font-weight:950;
    line-height:1;
    letter-spacing:.12em;
    text-align:center;
    text-transform:uppercase;
    overflow-wrap:anywhere;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:7px;
  }
  .stage-label .emoji{
    font-size:17px;
    line-height:1;
    filter:drop-shadow(0 1px 0 rgba(255,255,255,.55));
  }
  .difficulty-strip{
    display:grid;
    grid-template-columns:repeat(5,1fr);
    gap:5px;
    margin:0 0 12px;
  }
  .difficulty-chip{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:4px;
    min-width:0;
    padding:5px 4px;
    border:1px solid #dbe6ec;
    border-radius:999px;
    background:#f5f9fb;
    color:#7a8797;
    font-size:10px;
    font-weight:950;
    line-height:1;
    white-space:nowrap;
    box-shadow:0 2px 0 #e3edf3;
  }
  .difficulty-chip.current{
    color:#063548;
    background:linear-gradient(180deg,#d9f99d,#86efac);
    border-color:#86efac;
    box-shadow:0 3px 0 #16a34a;
  }
  .difficulty-chip.done{
    color:#5f3c00;
    background:linear-gradient(180deg,#fef3c7,#fde68a);
    border-color:#facc15;
  }
  .difficulty-chip .label{overflow:hidden;text-overflow:ellipsis;}
  .verse-text{
    display:block;
    width:100%;
    max-width:100%;
    min-height:158px;
    padding:20px 14px;
    color:var(--ink);
    background:linear-gradient(180deg,#fff,#f8fbff);
    border:2px solid var(--line);
    border-radius:18px;
    box-shadow:inset 0 1px 0 rgba(255,255,255,.85);
    font-size:clamp(19px,4.7vw,27px);
    font-weight:750;
    line-height:1.68;
    text-align:center;
    overflow-wrap:anywhere;
    word-break:normal;
    hyphens:auto;
  }
  .verse-text .w{
    display:inline;
    margin:0 2px;
    cursor:pointer;
    border-bottom:1px solid transparent;
    overflow-wrap:anywhere;
  }
  .verse-text .w.blank{
    color:transparent;
    background:linear-gradient(90deg,#bfd5df,#dcecf2);
    border-radius:5px;
    padding:0 .14em;
    user-select:none;
    box-decoration-break:clone;
    -webkit-box-decoration-break:clone;
  }
  .verse-text .w.blank:hover{background:linear-gradient(90deg,var(--gold),#fde68a);}
  .verse-text .w.letter{color:var(--indigo-d); font-weight:950; letter-spacing:.04em;}
  .verse-text .w.revealed{color:var(--red); font-weight:950;}
  .verse-text .w.hlc{
    color:#171717;
    border-radius:5px; padding:0 .14em; box-decoration-break:clone; -webkit-box-decoration-break:clone;
  }
  .verse-text.hl-off .w.hlc{ background:transparent !important; }
  .verse-text sup.vnum{
    font-size:.55em; font-weight:900; color:var(--indigo-d); margin-right:1px; opacity:.75;
  }
  .hl-toolbar{display:flex; flex-wrap:wrap; justify-content:center; gap:8px; margin-top:10px;}
  .hl-toggle.active{background:linear-gradient(180deg,#fde68a,#fbbf24); border-color:#d97706; color:#7c2d12;}
  .hl-hint{margin-top:6px; text-align:center; font-size:11px; font-weight:800; color:var(--muted);}
  .hl-legend{display:flex;flex-wrap:wrap;justify-content:center;gap:6px;margin:8px auto 12px;max-width:560px;}
  .hl-key{display:inline-flex;align-items:center;gap:5px;padding:5px 8px;border-radius:999px;background:#fff;border:1px solid #e2e8f0;color:#475569;font-size:9.5px;font-weight:900;line-height:1;}
  .hl-swatch{width:12px;height:12px;border-radius:4px;border:1px solid rgba(30,41,59,.12);}
  .recite-peek{
    margin:10px auto 16px; max-width:420px; max-height:280px; overflow-y:auto;

/* =========================================================
   NEW: towers, relics, today, review system
   ========================================================= */
  .display{font-family:"Cinzel",Georgia,serif; letter-spacing:.02em;}

  nav.tabs button{font-size:13px; padding:9px 6px;}

  /* ---- relic component ---- */
  .relic{
    --rsz:72px; --trim:#b0763b; --trimglow:rgba(176,118,59,.4);
    position:relative;
    width:var(--rsz); height:var(--rsz);
    flex-shrink:0;
    border-radius:18%;
    background:
      radial-gradient(circle at 50% 38%, rgba(255,255,255,.10), rgba(255,255,255,0) 62%),
      linear-gradient(160deg, #0d2436, #071628);
    border:2px solid var(--trim);
    box-shadow:0 0 0 3px rgba(255,255,255,.04), inset 0 0 14px rgba(0,0,0,.5);
  }
  .rl-base,.rl-shard{position:absolute; inset:0; border-radius:inherit; overflow:hidden;}
  .rl-art{
    position:absolute; inset:0;
    display:grid; place-items:center;
  }
  .rl-emoji{font-size:calc(var(--rsz)*.56); line-height:1; filter:drop-shadow(0 2px 3px rgba(0,0,0,.45));}
  .rl-art img{width:88%; height:88%; object-fit:contain;}
  .relic .rl-art img{display:none;}                 /* emoji mode default */
  .relic.img-mode .rl-art img{display:block;}
  .relic.img-mode .rl-art .rl-emoji{display:none;}
  .relic.img-mode.no-img .rl-art img{display:none;}
  .relic.img-mode.no-img .rl-art .rl-emoji{display:inline;}
  .rl-base .rl-art{filter:brightness(0) opacity(.8);}          /* the silhouette */
  .rl-shard{opacity:0; transform:scale(1.12); transition:opacity .45s ease, transform .45s ease;}
  .rl-shard.on{opacity:1; transform:scale(1);}
  .rl-ring{
    position:absolute; inset:-5px;
    border-radius:22%;
    pointer-events:none;
    border:2px solid var(--trim);
    box-shadow:0 0 14px var(--trimglow), inset 0 0 10px var(--trimglow);
    opacity:.9;
  }
  .relic.proven:not(.sealed) .rl-base{filter:brightness(.4) drop-shadow(0 0 5px rgba(52,211,153,.7));}
  .relic.proven:not(.sealed) .rl-ring{
    border-color:#34d399;
    box-shadow:0 0 10px rgba(52,211,153,.55), inset 0 0 8px rgba(52,211,153,.28);
    animation:provenGlow 2.4s ease-in-out infinite;
  }
  @keyframes provenGlow{
    0%,100%{box-shadow:0 0 10px rgba(52,211,153,.5), inset 0 0 8px rgba(52,211,153,.25);}
    50%{box-shadow:0 0 17px rgba(52,211,153,.8), inset 0 0 12px rgba(52,211,153,.4);}
  }
  .relic.cond-radiant .rl-ring{border-color:#7df9ff; box-shadow:0 0 16px rgba(34,211,238,.55), inset 0 0 10px rgba(34,211,238,.3);}
  .relic.cond-eternal .rl-ring{
    border-color:#2fd4c0;
    box-shadow:0 0 10px rgba(47,212,192,.7), 0 0 22px rgba(244,185,66,.5), inset 0 0 12px rgba(47,212,192,.35);
    animation:eternalPulse 2.6s ease-in-out infinite;
  }
  @keyframes eternalPulse{
    0%,100%{box-shadow:0 0 10px rgba(47,212,192,.7), 0 0 22px rgba(244,185,66,.45), inset 0 0 12px rgba(47,212,192,.35);}
    50%{box-shadow:0 0 18px rgba(244,185,66,.75), 0 0 30px rgba(47,212,192,.5), inset 0 0 16px rgba(244,185,66,.35);}
  }
  .relic.cond-dimming .rl-base,.relic.cond-dimming .rl-shard{filter:saturate(.72) brightness(.9);}
  .relic.cond-fading .rl-base,.relic.cond-fading .rl-shard{filter:saturate(.35) brightness(.76);}
  .relic.cond-fading .rl-ring{opacity:.35; box-shadow:none;}
  .relic.cond-cracked .rl-base,.relic.cond-cracked .rl-shard{filter:grayscale(.95) brightness(.58);}
  .relic.cond-cracked .rl-ring{opacity:.2; box-shadow:none;}
  .relic.cond-cracked::after{
    content:""; position:absolute; inset:0; border-radius:inherit; pointer-events:none;
    background:
      linear-gradient(63deg, transparent 47.6%, rgba(10,20,30,.85) 48.4%, rgba(200,220,235,.35) 49%, transparent 50%),
      linear-gradient(-38deg, transparent 61.6%, rgba(10,20,30,.8) 62.4%, rgba(200,220,235,.3) 63%, transparent 64%);
  }

  .fl-info{flex:1; min-width:0;}
  .fl-ref{font-size:14.5px; font-weight:950; color:var(--ink); line-height:1.15; overflow-wrap:anywhere;}
  .fl-name{margin-top:1px; font-family:"Cinzel",Georgia,serif; font-size:11px; font-weight:700; color:#8a6a1f; overflow-wrap:anywhere;}
  .fl-meta{margin-top:3px; display:flex; align-items:center; gap:6px; flex-wrap:wrap; color:var(--muted); font-size:10.5px; font-weight:850;}
  .fl-here{

  .fl-chestimg{flex-shrink:0; display:grid; place-items:center;}
  .chest-img{display:block; object-fit:contain; filter:drop-shadow(0 3px 5px rgba(0,5,20,.35));}

  .next-floor{
    display:flex; gap:14px; align-items:flex-start;
    margin:0 0 10px; padding:14px;
    border-radius:22px;
    color:#fff;
    border:1.5px solid var(--thue,#22d3ee);
    background:
      radial-gradient(circle at 90% 0%, var(--tsoft,rgba(34,211,238,.2)), transparent 55%),
      linear-gradient(160deg, rgba(14,32,54,.97), rgba(7,13,31,.98));
    box-shadow:0 0 0 4px var(--tsoft,rgba(34,211,238,.15)), 0 12px 28px rgba(0,5,20,.38);
  }
  .nf-chest{flex-shrink:0; text-align:center;}
  .nf-chest .chest-img{margin:0 auto; animation:chestBob 2.8s ease-in-out infinite;}
  @keyframes chestBob{0%,100%{transform:translateY(0);}50%{transform:translateY(-4px);}}
  .nf-chest-label{
    margin-top:4px; padding:3px 9px; display:inline-block;
    color:#3a2205; background:linear-gradient(180deg,#fbbf24,#f59e0b);

  }

  .nf-title{font-family:"Cinzel",Georgia,serif; font-size:16px; font-weight:800; line-height:1.2;}
  .nf-sub{margin-top:3px; color:#aabbd8; font-size:11.5px; font-weight:700; line-height:1.4;}
  .choice-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin-top:11px;}
  .choice-card{
    position:relative; cursor:pointer; text-align:center;
    padding:26px 8px 10px;
    border-radius:16px;
    background:rgba(255,255,255,.95);

  .choice-card:hover{transform:translateY(-2px); border-color:var(--gold); box-shadow:0 6px 16px rgba(0,5,20,.3);}
  .choice-card .relic{margin:0 auto 7px;}
  .cc-tag{
    position:absolute; top:-1px; left:50%; transform:translateX(-50%);
    white-space:nowrap;
    padding:4px 10px; border-radius:0 0 10px 10px;
    font-size:9.5px; font-weight:950; letter-spacing:.05em; text-transform:uppercase;
    color:#fff; background:#64748b;
  }
  .choice-card.prog .cc-tag{background:linear-gradient(90deg,#0e7490,#22d3ee);}
  .choice-card.quick .cc-tag{background:linear-gradient(90deg,#16a34a,#4ade80);}
  .choice-card.steady .cc-tag{background:linear-gradient(90deg,#d97706,#fbbf24); color:#3a2205;}
  .choice-card.bold .cc-tag{background:linear-gradient(90deg,#be123c,#fb7185);}
  .cc-ref{color:var(--ink); font-size:12.5px; font-weight:950; line-height:1.15; overflow-wrap:anywhere;}
  .cc-theme{margin-top:2px; color:var(--muted); font-size:10px; font-weight:800; line-height:1.25; overflow-wrap:anywhere;}
  .cc-meta{margin-top:5px; color:#8fa6bd; font-size:9.5px; font-weight:900;}
  .mist-note{
    margin:0 0 12px; padding:9px 12px; text-align:center;
    color:#cdddff; background:rgba(7,13,31,.42);
    border:1px solid rgba(255,255,255,.08); border-radius:14px;
    font-size:12px; font-weight:800;
  }

  /* ---- climbable tower visual ---- */
  .tower-visual{
    position:relative; overflow:hidden;
    margin:0 0 12px; border-radius:22px;
    border:1px solid rgba(255,255,255,.16);
    background:
      radial-gradient(circle at 50% 0%, var(--tsoft,rgba(34,211,238,.18)), transparent 55%),
      linear-gradient(180deg, rgba(9,22,42,.94), rgba(5,12,26,.99));
    box-shadow:0 12px 28px rgba(0,5,20,.38);
  }
  .tv-viewport{position:relative; height:340px; overflow:hidden;}
  .tv-world{
    position:absolute; left:50%; bottom:0; width:640px;
    transform:translateX(-50%) scale(var(--tv-scale,0.6)) translateY(var(--tv-y,0px));
    transform-origin:bottom center;
    transition:transform 560ms cubic-bezier(.2,.8,.2,1);
    will-change:transform;
  }
  .tv-piece{display:block; width:640px; height:auto; margin:0 auto; user-select:none; pointer-events:none;}
  .tv-base{width:585px;}
  .tv-repeat{margin-top:-1px;}
  .tv-layer{position:absolute; left:50%; transform:translateX(-50%); width:304px; pointer-events:none;}
  .tv-glow{
    position:absolute; left:50%; top:40px; width:38px; height:58px;
    border-radius:999px 999px 14px 14px; transform:translateX(-50%); opacity:0;
    background:radial-gradient(circle at 50% 30%, rgba(255,252,216,.98), rgba(255,201,94,.82) 42%, rgba(255,183,62,0) 72%);
    filter:blur(.2px); mix-blend-mode:screen; transition:opacity 240ms ease;
  }
  .tv-layer.is-active .tv-glow{
    opacity:1;
    box-shadow:0 0 18px rgba(255,219,118,.95), 0 0 42px rgba(255,184,58,.68);
  }
  .tv-layer.is-complete .tv-glow{
    opacity:.6;
    box-shadow:0 0 8px rgba(255,218,130,.52), 0 0 18px rgba(255,190,78,.28);
  }
  .tv-badge{
    position:absolute; left:-16px; top:50%; z-index:4; width:44px; height:44px;
    display:grid; place-items:center; border-radius:999px;
    color:#3a2205; font-family:"Cinzel",Georgia,serif; font-size:20px; line-height:1;
    background:linear-gradient(180deg,#fde68a,#f4b942);
    border:1.5px solid var(--thue,#f4b942);
    box-shadow:0 8px 18px rgba(0,5,20,.4), 0 0 18px rgba(255,215,124,.5);
    transform:translate(-100%,-50%); opacity:0; transition:opacity 180ms ease;
  }
  .tv-layer.is-active .tv-badge{opacity:1;}
  .tv-badge::after{content:""; position:absolute; left:100%; top:50%; width:22px; border-top:1px solid rgba(244,185,66,.6);}
  .tv-caption{
    position:absolute; z-index:3; top:12px; left:50%; transform:translateX(-50%);
    min-width:118px; padding:6px 16px 7px; border-radius:999px; text-align:center;
    background:rgba(7,13,31,.72); border:1px solid var(--thue,rgba(255,255,255,.18));
    color:#fff;
  }
  .tv-caption span{display:block; font-size:9.5px; font-weight:900; text-transform:uppercase; letter-spacing:.12em; color:#cdddff;}
  .tv-caption strong{display:block; margin-top:1px; font-family:"Cinzel",Georgia,serif; font-size:19px; line-height:1;}
  @media (max-width:520px){
    .tv-viewport{height:300px;}
  }

  .crowned{
    margin:0 0 12px; padding:16px; text-align:center;
    color:#3a2205; border-radius:20px;
    background:linear-gradient(160deg,#fef3c7,#fde68a);
    border:2px solid #f4b942;
    box-shadow:0 0 0 4px rgba(244,185,66,.2), var(--shadow-sm);
    font-size:14px; font-weight:850; line-height:1.5;
  }
  .qalt{margin-top:9px; text-align:center; color:var(--muted); font-size:12px; font-weight:850; cursor:pointer;}
  .qalt:hover{color:var(--indigo-d);}
  @media (max-width:520px){
    .next-floor{flex-direction:column; align-items:center;}
    .choice-grid{grid-template-columns:1fr;}
    .choice-card{display:flex; align-items:center; gap:10px; text-align:left; padding:12px 12px 12px 12px;}
    .choice-card .relic{margin:0;}
    .cc-tag{left:auto; right:10px; transform:none; border-radius:0 0 8px 8px;}
    .cc-info{min-width:0; flex:1;}
    .fl-chestimg{display:none;}
  }

  /* ---- study additions ---- */
  .study-relic{
    display:flex; gap:14px; align-items:center;
    margin:0 0 12px; padding:12px;
    border-radius:18px;
    background:linear-gradient(160deg,#0d2436,#0a1c30);
    border:1.5px solid rgba(148,180,200,.22);
  }
  .study-relic .sr-info{flex:1; min-width:0;}
  .study-relic .sr-name{font-family:"Cinzel",Georgia,serif; color:#fde68a; font-size:16px; font-weight:800; line-height:1.2; overflow-wrap:anywhere;}
  .study-relic .sr-tier{margin-top:3px; color:#9db4d6; font-size:11px; font-weight:900; letter-spacing:.05em; text-transform:uppercase;}
  .study-relic .sr-cond{margin-top:7px;}
  .review-banner{
    display:flex; align-items:center; gap:9px;
    margin:0 0 12px; padding:10px 12px;
    border-radius:16px;
    color:#7c2d12; background:linear-gradient(180deg,#fff7ed,#ffedd5);
    border:1.5px solid #fdba74;
    font-size:12.5px; font-weight:850; line-height:1.35;
  }

  /* ---- toast ---- */
  .toast{
    position:fixed; left:50%; bottom:26px; z-index:60;
    transform:translateX(-50%) translateY(20px);
    max-width:min(420px, calc(100vw - 30px));
    padding:12px 16px; border-radius:16px;
    color:#fff; text-align:center;
    background:linear-gradient(160deg, rgba(13,33,56,.98), rgba(7,13,31,.98));
    border:1.5px solid rgba(125,249,255,.6);
    box-shadow:0 12px 30px rgba(0,5,20,.5), 0 0 20px rgba(34,211,238,.25);
    font-size:13.5px; font-weight:850; line-height:1.4;
    opacity:0; pointer-events:none;
    transition:opacity .3s, transform .3s;
  }
  .toast.show{opacity:1; transform:translateX(-50%) translateY(0);}
  .toast.gold{border-color:rgba(244,185,66,.75); box-shadow:0 12px 30px rgba(0,5,20,.5), 0 0 22px rgba(244,185,66,.35);}

  @media (max-width:520px){
    .tower-grid{grid-template-columns:1fr;}
    .tower-strip{grid-template-columns:1fr;}
    .hero-steps{grid-template-columns:repeat(3,1fr);}
  }
  @media (min-width:720px){
    .tower-grid{grid-template-columns:repeat(2,1fr);}
  }
  @media (prefers-reduced-motion:reduce){
    *{animation:none !important; transition:none !important;}
  }
  /* =========================================================
     HERO — tower segue
     ========================================================= */
  .hero-flex{display:flex; gap:16px; align-items:center;}
  .hero-tower{flex-shrink:0; display:flex; align-items:flex-end; width:220px; height:280px; overflow:hidden; border-radius:10px;}
  .hero-tower img{
    width:100%; height:100%; object-fit:cover; object-position:bottom center;
    filter:drop-shadow(0 12px 26px rgba(0,0,0,.55)) drop-shadow(0 0 18px rgba(255,205,100,.18));
    -webkit-mask-image:linear-gradient(to bottom, transparent 0, #000 34px);
    mask-image:linear-gradient(to bottom, transparent 0, #000 34px);
  }
  .hero-tower.full{height:500px;}
  .hero-tower.full img{
    object-fit:contain; object-position:bottom;
    -webkit-mask-image:none; mask-image:none;
  }
  .hero-copy{flex:1; min-width:0; text-align:center;}
  .hero-alt{margin-top:10px; font-size:12px; font-weight:800; color:#9db4d6; cursor:pointer;}
  .hero-alt:hover{color:#cfdcf3;}
  @media (max-width:430px){ .hero-tower{width:74px; height:100px;} .hero-tower.full{height:260px;} }

  /* =========================================================
     RELICS ON THE TOWER — lit floors carry their trophy
     ========================================================= */
  .tv-layer.tv-clickable{pointer-events:auto; cursor:pointer;}
  .tv-relic{
    position:absolute; top:50%; width:58px; height:58px; z-index:5;
    display:grid; place-items:center; border-radius:16px; opacity:0;
    background:radial-gradient(circle at 50% 32%, rgba(255,246,214,.97), rgba(250,204,110,.9) 58%, rgba(190,130,40,.85));
    border:1px solid rgba(255,226,150,.95);
    box-shadow:0 6px 16px rgba(20,10,0,.4), 0 0 24px rgba(255,200,90,.6);
    transition:transform .55s cubic-bezier(.2,.85,.25,1.2), opacity .4s ease;
  }
  .tv-relic img{width:48px; height:48px; object-fit:contain; filter:drop-shadow(0 2px 3px rgba(60,30,0,.4));}
  .tv-relic span{font-size:28px; line-height:1;}
  .tv-relic::after{
    content:""; position:absolute; top:50%; width:26px;
    border-top:1px solid rgba(255,214,120,.65);
  }
  .tv-relic-left{left:-10px; transform:translate(-100%,-50%) scale(.2);}
  .tv-relic-left::after{left:100%;}
  .tv-relic-right{right:-10px; transform:translate(100%,-50%) scale(.2);}
  .tv-relic-right::after{right:100%;}
  .tv-relic-left.on{opacity:1; transform:translate(-100%,-50%) scale(1);}
  .tv-relic-right.on{opacity:1; transform:translate(100%,-50%) scale(1);}

  .tv-congrats{
    position:absolute; left:50%; bottom:14px; z-index:7;
    transform:translate(-50%,22px); opacity:0; pointer-events:none;
    min-width:230px; max-width:88%; padding:12px 18px; text-align:center;
    border-radius:16px; color:#fff; font-size:13.5px; font-weight:800; line-height:1.45;
    background:linear-gradient(160deg, rgba(13,33,56,.96), rgba(7,13,31,.97));
    border:1px solid rgba(244,185,66,.6);
    box-shadow:0 12px 30px rgba(0,5,20,.5), 0 0 28px rgba(244,185,66,.3);
    transition:opacity .5s ease, transform .5s ease;
  }
  .tv-congrats span{color:#b9c9e2; font-weight:700; font-size:11.5px;}
  .tv-congrats.show{opacity:1; transform:translate(-50%,0);}

  /* =========================================================
     SEAL CEREMONY — chest opens, relic rises
     ========================================================= */
  .cer{position:fixed; inset:0; z-index:80; display:none;}
  .cer.show{display:block;}
  .cer-backdrop{
    position:absolute; inset:0;
    background:radial-gradient(circle at 50% 40%, rgba(30,52,92,.6), rgba(2,6,18,.97) 72%);
    backdrop-filter:blur(6px);
  }
  .cer-stage{
    position:relative; height:100%; display:flex; flex-direction:column;
    align-items:center; justify-content:center; gap:14px; padding:24px; text-align:center;
  }
  .cer-rays{
    position:absolute; left:50%; top:36%; width:560px; height:560px;
    transform:translate(-50%,-50%); opacity:0; pointer-events:none;
    background:repeating-conic-gradient(rgba(255,214,110,.16) 0deg 12deg, transparent 12deg 28deg);
    border-radius:50%;
    -webkit-mask:radial-gradient(circle, #000 0%, transparent 66%);
    mask:radial-gradient(circle, #000 0%, transparent 66%);
    animation:cerSpin 30s linear infinite;
    transition:opacity .9s ease;
  }
  @keyframes cerSpin{to{transform:translate(-50%,-50%) rotate(360deg);}}
  .cer.phase-open .cer-rays{opacity:1;}
  .cer-scene{position:relative; width:240px; height:258px; flex-shrink:0;}
  .cer-chest{position:absolute; left:50%; bottom:0; transform:translateX(-50%); transition:filter .45s ease;}
  .cer-chest .chest-img{filter:drop-shadow(0 10px 22px rgba(0,0,0,.55));}
  .cer.phase-shake .cer-chest{animation:cerShake .5s ease-in-out 2;}
  @keyframes cerShake{
    0%,100%{transform:translateX(-50%) rotate(0);}
    25%{transform:translateX(-53%) rotate(-3.5deg);}
    75%{transform:translateX(-47%) rotate(3.5deg);}
  }
  .cer.phase-open .cer-chest{filter:brightness(1.18) drop-shadow(0 0 28px rgba(255,205,100,.85));}
  .cer-burst{
    position:absolute; left:50%; bottom:104px; width:12px; height:12px;
    border-radius:50%; transform:translate(-50%,0); opacity:0; pointer-events:none;
    background:radial-gradient(circle, #fff7d6, rgba(255,196,60,.9) 40%, transparent 70%);
  }
  .cer.phase-open .cer-burst{animation:cerBurst .85s ease-out;}
  @keyframes cerBurst{
    0%{opacity:1; transform:translate(-50%,0) scale(1);}
    100%{opacity:0; transform:translate(-50%,0) scale(34);}
  }
  .cer-relic-wrap{
    position:absolute; left:50%; bottom:64px; z-index:2;
    transform:translate(-50%,26px) scale(.25); opacity:0;
    transition:transform 1s cubic-bezier(.2,.9,.3,1.15), opacity .5s ease;
  }
  .cer.phase-open .cer-relic-wrap{opacity:1; transform:translate(-50%,-52px) scale(1);}
  .cer-relic-img{
    width:150px; height:150px; object-fit:contain; display:block;
    filter:drop-shadow(0 8px 22px rgba(0,0,0,.5)) drop-shadow(0 0 32px rgba(255,210,110,.6));
    animation:cerFloat 3.6s ease-in-out 1.1s infinite;
  }
  .cer-relic-emoji{
    font-size:100px; line-height:1;
    filter:drop-shadow(0 0 28px rgba(255,210,110,.65));
    animation:cerFloat 3.6s ease-in-out 1.1s infinite;
  }
  @keyframes cerFloat{0%,100%{transform:translateY(0);}50%{transform:translateY(-10px);}}
  .cer-text{opacity:0; transform:translateY(16px); transition:opacity .6s ease, transform .6s ease; color:#fff;}
  .cer.phase-text .cer-text{opacity:1; transform:none;}
  .cer-kicker{font-size:11px; font-weight:950; letter-spacing:.18em; text-transform:uppercase; color:#fbbf24;}
  .cer-name{font-family:"Cinzel",Georgia,serif; font-size:clamp(22px,6vw,30px); font-weight:800; margin-top:6px;}
  .cer-motto{margin-top:4px; color:#cfdcf3; font-size:14.5px; font-weight:700; font-style:italic;}
  .cer-ref{margin-top:8px; color:#9db4d6; font-size:12px; font-weight:800;}
  .cer-btn{opacity:0; transform:translateY(10px); transition:opacity .5s ease .15s, transform .5s ease .15s; width:100%; max-width:280px;}
  .cer.phase-text .cer-btn, .cer-btn.show{opacity:1; transform:none;}
  .cer-skip{opacity:0; transition:opacity .5s ease .35s; color:#9db4d6; font-size:12px; font-weight:800; cursor:pointer;}
  .cer.phase-text .cer-skip, .cer-skip.show{opacity:1;}
  .cer-skip:hover{color:#cfdcf3;}

  /* =========================================================
     RELIC POPUP — tap a relic to see its verse
     ========================================================= */
  .relic-pop-stage{
    position:relative; height:100%; display:flex; align-items:center; justify-content:center; padding:20px;
  }
  .relic-pop-card{
    position:relative;

  .rp-close:hover{background:rgba(255,255,255,.22); border-color:rgba(255,255,255,.4);}
  .rp-relic{margin:4px auto 12px;}
  .rp-relic .relic{--rsz:clamp(170px, 62vw, 300px) !important;}
  .rp-ref{font-family:"Cinzel",Georgia,serif; font-size:22px; font-weight:800;}
  .rp-theme{margin-top:3px; color:#cabffa; font-size:12.5px; font-weight:800;}
  .rp-status{margin:10px 0; display:flex; justify-content:center; flex-wrap:wrap; gap:6px;}
  .rp-text{
    margin:14px 0; padding:14px; border-radius:14px; text-align:left;
