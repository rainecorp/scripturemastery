function arenaDistractors(v, count){
  const sameVol = shuffleArr(VERSES.filter(x=>x.id!==v.id && x.volume===v.volume));
  const rest = shuffleArr(VERSES.filter(x=>x.id!==v.id && x.volume!==v.volume));
  return sameVol.concat(rest).slice(0, count);
}
function pickRandomWord(){
  const v = VERSES[Math.floor(Math.random()*VERSES.length)];
  const words = v.text.trim().split(/\s+/).filter(w=>w.replace(/[^a-zA-Z]/g,"").length>2);
  const w = words[Math.floor(Math.random()*words.length)] || "thing";
  return w.replace(/[.,;:!?"“”'’]/g,"");
}
function scrambleLeadIn(words, start){
  if(start <= 0) return "";
  let leadStart = Math.max(0, start - 14);
  let lead = words.slice(leadStart, start);
  if(lead.length < 6 && leadStart > 0){
    leadStart = Math.max(0, start - 20);
    lead = words.slice(leadStart, start);
  }
  return `${leadStart > 0 ? "… " : ""}${lead.join(" ")}`;
}
function buildArenaQuestion(v, type, diffCfg){
  const q = {v, type, ok:null, hinted:false};
  if(type==="text2ref" || type==="ref2text" || type==="theme2ref" || type==="timedRecall"){
    const distract = arenaDistractors(v, diffCfg.options-1);
    q.options = shuffleArr([v].concat(distract));
    if(type==="timedRecall") q.timeLimit = diffCfg.timer;
  } else if(type==="finishVerse"){
    const words = v.text.trim().split(/\s+/);
    const cut = Math.max(2, Math.floor(words.length*0.6));
    const tailLen = Math.max(2, words.length-cut);
    q.lead = words.slice(0,cut).join(" ");
    const correctEnd = words.slice(cut).join(" ");
    const distract = arenaDistractors(v, diffCfg.options-1).map(x=>{
      const w2 = x.text.trim().split(/\s+/);
      return w2.slice(Math.max(0, w2.length-tailLen)).join(" ");
    });
    q.options = shuffleArr([correctEnd].concat(distract));
    q.correctEnd = correctEnd;
  } else if(type==="buildVerse"){
    q.chunks = chunkVerse(v.text);
    q.builtIndex = 0;
  } else if(type==="fillBlank"){
    const words = v.text.trim().split(/\s+/);
    const candidates = words.map((w,i)=>({w,i})).filter(o=> o.i>0 && o.i<words.length-1 && o.w.replace(/[^a-zA-Z]/g,"").length>2);
    const pick = candidates[Math.floor(Math.random()*candidates.length)] || {w:words[0], i:0};
    q.blankIndex = pick.i;
    q.words = words;
    const clean = pick.w.replace(/[.,;:!?"“”'’]/g,"");
    q.correctWord = clean;
    const distract = [];
    let guard = 0;
    while(distract.length < diffCfg.options-1 && guard < 40){
      guard++;
      const w = pickRandomWord();
      if(w.toLowerCase()!==clean.toLowerCase() && !distract.includes(w)) distract.push(w);
    }
    q.options = shuffleArr([clean].concat(distract));
  } else if(type==="findError"){
    const words = v.text.trim().split(/\s+/);
    const idx = words.length>2 ? 1+Math.floor(Math.random()*(words.length-2)) : 0;
    q.words = words.slice();
    q.errorIndex = idx;
    q.words[idx] = pickRandomWord();
    q.retryUsed = false;
  } else if(type==="wordScramble"){
    const words = v.text.trim().split(/\s+/);
    const n = Math.min(8, words.length);
    const start = words.length > n ? Math.floor(Math.random()*(words.length-n+1)) : 0;
    q.scrTarget = words.slice(start, start+n);
    q.scrStart = start;
    q.scrLead = scrambleLeadIn(words, start);
    q.scrPool = shuffleArr(q.scrTarget.map((w,k)=>({w, k})));
    q.scrNext = 0;
    q.scrMiss = 0;
    q.scrUsed = [];
  } else if(type==="pairMatch"){
    const trio = [v].concat(arenaDistractors(v, 2));
    q.pairLeft = shuffleArr(trio.map(x=>({id:x.id, label:x.ref})));
    q.pairRight = shuffleArr(trio.map(x=>({id:x.id, label:x.theme})));
    q.pairDone = {};
    q.pmMiss = 0;
    q.selL = null;
  }
  // fullRecitation needs no extra fields — self-reported
  return q;
}
function poolForMode(mode){
  if(mode.kind==="quick" || mode.kind==="quest" || mode.kind==="blitz") return arenaFilteredPool();
  if(mode.kind==="book") return bookAreas(mode.vol)[mode.area];
  if(mode.kind==="grand") return grandAreas()[mode.area];
  return [];
}
const QUEST_ROUND_LEN = {fullRecitation:3, buildVerse:4, wordScramble:5, pairMatch:4};
const BLITZ_TYPES = ["text2ref","ref2text","theme2ref","fillBlank","finishVerse"];
const BLITZ_SECONDS = 60;
function makeArenaRound(mode){
  const a = ensureArena();
  const diffCfg = ARENA_DIFF[a.difficulty];
  let rawPool = poolForMode(mode);
  let qs;
  if(mode.kind==="quest"){
    let pool = rawPool.length ? rawPool : VERSES.slice();
    if(mode.type==="fullRecitation"){
      const sealedPool = pool.filter(v=>state.progress[v.id].sealed);
      if(sealedPool.length) pool = sealedPool;
    }
    pool = shuffleArr(pool).slice(0, Math.min(QUEST_ROUND_LEN[mode.type]||6, pool.length));
    qs = pool.map(v=> buildArenaQuestion(v, mode.type, diffCfg));
  } else if(mode.kind==="blitz"){
    const pool = rawPool.length >= 3 ? rawPool : VERSES.slice();
    const seq = [];
    while(seq.length < 30) seq.push(...shuffleArr(pool));
    qs = seq.slice(0,30).map((v,i)=> buildArenaQuestion(v, BLITZ_TYPES[i%BLITZ_TYPES.length], diffCfg));
  } else {
    if(mode.kind==="quick") rawPool = shuffleArr(rawPool).slice(0, Math.min(8, rawPool.length));
    const types = shuffleArr(ARENA_TYPES);
    qs = rawPool.map((v,i)=> buildArenaQuestion(v, types[i%types.length], diffCfg));
  }
  return {
    mode, diffCfg, qs, i:0, correct:0, combo:0, bestCombo:0, score:0,
    hintsUsed:0, noHintCorrect:0, heartBonus:null, resealed:[], booksTouched:new Set(),
    done:false, locked:false, newlyUnlocked:[], newQuestBadges:[], timeLeft:null, timerHandle:null,
    blitzEnd:null, blitzTimer:null
  };
}
/* Jump straight into a quest's own challenge type — the quest card IS the game mode. */
function startQuestRound(questId){
  const def = questDef(questId);
  if(!def) return;
  const a = ensureArena();
  const quests = ensureArenaQuests(a);
  const inst = quests.list.find(q=>q.id===questId);
  if(inst && inst.done){
    view.tab = "trials";
    view.trialRound = null;
    view.arenaStatsOpen = true;
    render();
    showToast(`${def.emoji} <strong>${def.name}</strong> is already won today. Its chest is on your Quest Shelf.`);
    window.scrollTo({top:0});
    return;
  }
  let round;
  if(def.track==="type") round = makeArenaRound({kind:"quest", type:def.type, questId});
  else if(def.track==="buildStep") round = makeArenaRound({kind:"quest", type:def.type, questId});
  else if(def.track==="blitz") round = makeArenaRound({kind:"blitz", questId});
  else round = makeArenaRound({kind:"quick", questId});
  if(!round.qs.length){ showToast("No scriptures match your Arena filters yet — study one first."); return; }
  view.trialRound = round;
  view.tab = "trials";
  render();
  window.scrollTo({top:0});
}
function unlockArenaAchievement(T, id){
  const a = ensureArena();
  if(a.achievements.includes(id)) return;
  a.achievements.push(id);
  T.newlyUnlocked.push(id);
}
function finishArenaSession(T){
  const a = ensureArena();
  if(T.blitzTimer){ clearInterval(T.blitzTimer); T.blitzTimer = null; }
  const answered = T.qs.filter(q=>q.ok!==null).length;
  const total = T.mode.kind==="blitz" ? answered : T.qs.length;
  const perfect = T.mode.kind==="blitz" ? false : (total>0 && T.correct === total);
  if(T.mode.kind==="blitz"){
    a.blitz.played += 1;
    a.blitz.best = Math.max(a.blitz.best, T.correct);
    T.newQuestBadges = T.newQuestBadges.concat(setArenaQuestProgress(a, def=>def.track==="blitz", T.correct));
    if(T.correct >= 15) unlockArenaAchievement(T, "blitz_ace");
  }
  const completedForHeartBonus = total > 0 && T.correct > 0 && (T.mode.kind==="blitz" ? answered > 0 : answered === total);
  if(completedForHeartBonus){
    if(T.hintsUsed === 0){
      T.heartBonus = {
        xp:25,
        label:"Heartstrong Finish",
        desc:"Completed without using a heart. Bonus XP!"
      };
    } else if(T.hintsUsed === 1){
      T.heartBonus = {
        xp:10,
        label:"One-Heart Climb",
        desc:"Completed using only 1 heart. Good job!"
      };
    }
    if(T.heartBonus) T.score += T.heartBonus.xp;
  }
  a.score.total += T.score;
  a.score.best = Math.max(a.score.best, T.score);
  a.streakBest = Math.max(a.streakBest, T.bestCombo);
  T.booksTouched.forEach(vol=>{ if(!a.booksPracticed.includes(vol)) a.booksPracticed.push(vol); });

  unlockArenaAchievement(T, "first_session");
  if(T.bestCombo >= 10) unlockArenaAchievement(T, "streak10");
  if(perfect) unlockArenaAchievement(T, "perfect");
  if(VOLUME_ORDER.every(vol=>a.booksPracticed.includes(vol))) unlockArenaAchievement(T, "all_books");

  a.stats.sessions += 1;
  a.stats.hintsUsed += T.hintsUsed;
  a.stats.resealedCount += T.resealed.length;
  T.newQuestBadges = T.newQuestBadges.concat(bumpArenaQuests(a, def=>def.track==="session", 1));
  if(perfect) T.newQuestBadges = T.newQuestBadges.concat(bumpArenaQuests(a, def=>def.track==="perfect", 1));

  if(T.mode.kind==="book"){
    const complete = perfect;
    if(complete){
      a.bookMastery[T.mode.vol].areas[T.mode.area] = true;
      unlockArenaAchievement(T, "book_area");
      if(a.bookMastery[T.mode.vol].areas.every(Boolean)) unlockArenaAchievement(T, "book_mastery");
    }
  } else if(T.mode.kind==="grand"){
    if(perfect){
      a.grand.areas[T.mode.area] = true;
      if(a.grand.areas.every(Boolean)) unlockArenaAchievement(T, "grand_mastery");
    }
  }
  const masteredCount = VERSES.filter(v=>state.progress[v.id].sealed).length;
  if(masteredCount>=25) unlockArenaAchievement(T, "mastered25");
  if(masteredCount>=50) unlockArenaAchievement(T, "mastered50");
  if(masteredCount>=100) unlockArenaAchievement(T, "mastered100");

  state.xp += T.score;
  touchStreak();
  saveState();
}
function scoreForType(type){
  if(type==="fullRecitation") return 25;
  if(type==="buildVerse" || type==="timedRecall" || type==="wordScramble" || type==="pairMatch") return 15;
  return 10;
}
function settleAnswer(T, q, correct, opts){
  opts = opts || {};
  q.ok = correct;
  if(q.timerHandle){ clearInterval(q.timerHandle); q.timerHandle=null; }
  T.booksTouched.add(q.v.volume);
  const a = ensureArena();
  a.stats.totalAnswered += 1;
  a.stats.byType[q.type].played += 1;
  if(correct){
    T.combo += 1;
    T.bestCombo = Math.max(T.bestCombo, T.combo);
    T.correct += 1;
    let gained = scoreForType(q.type) + Math.min(20, (T.combo-1)*2);
    if(!q.hinted){ gained += 5; T.noHintCorrect += 1; }
    if(opts.penalty) gained = Math.max(3, gained - opts.penalty);
    T.score += gained;
    q.gained = gained;
    a.stats.totalCorrect += 1;
    a.stats.byType[q.type].correct += 1;
    T.newQuestBadges = T.newQuestBadges.concat(bumpArenaQuests(a, def=>def.track==="type" && def.type===q.type, 1));
    T.newQuestBadges = T.newQuestBadges.concat(setArenaQuestProgress(a, def=>def.track==="streak", T.combo));
    const p = state.progress[q.v.id];
    if(isDue(p)){
      const res = resealVerse(p);
      T.score += res.xp;
      T.resealed.push(q.v);
      emitBridge(res.eternal ? "eternal" : "reseal", q.v, res.xp);
    }
    if(q.type==="fullRecitation" && !q.hinted && p.sealed){
      const T2 = view.trialRound;
      if(T2) unlockArenaAchievement(T2, "recite_no_hints");
    }
  } else {
    T.combo = 0;
  }
  saveState(); /* persist stats + quest progress per answer, not just at session end */
}
function recordArenaQuestStep(T, matchFn, amount){
  const a = ensureArena();
  T.newQuestBadges = T.newQuestBadges.concat(bumpArenaQuests(a, matchFn, amount || 1));
  saveState();
}
function questHudHTML(T){
  const questId = T.mode.questId;
  if(!questId) return "";
  const a = ensureArena();
  const quests = ensureArenaQuests(a);
  const inst = quests.list.find(q=>q.id===questId);
  const def = questDef(questId);
  if(!inst || !def) return "";
  const pct = Math.round((inst.progress/inst.goal)*100);
  return `
    <div class="quest-hud">
      <div class="quest-hud-top"><span>${def.emoji} ${def.name}</span><span class="quest-progress">${inst.progress}/${inst.goal}</span></div>
      <div class="quest-hud-desc">${def.desc}</div>
      <span class="quest-bar"><i style="width:${pct}%"></i></span>
    </div>`;
}

/* ---- active session: renders one question at a time ---- */
function renderArenaSession(){
  const body = document.getElementById("body");
  const T = view.trialRound;
  const q = T.qs[T.i];
  const isBlitz = T.mode.kind==="blitz";
  let modeLabel;
  if(T.mode.kind==="quick") modeLabel = "Quick Practice";
  else if(T.mode.kind==="book") modeLabel = `${TOWERS[T.mode.vol].name} · Area ${T.mode.area+1}/5`;
  else if(T.mode.kind==="grand") modeLabel = `Grand Challenge · Area ${T.mode.area+1}/10`;
  else if(isBlitz) modeLabel = "⚡ Lightning Round";
  else if(T.mode.kind==="quest"){
    const def = questDef(T.mode.questId);
    modeLabel = def ? `${def.emoji} Quest: ${def.name}` : "Quest Round";
  } else modeLabel = "Arena";
  if(isBlitz && !T.blitzEnd) T.blitzEnd = Date.now() + BLITZ_SECONDS*1000;

  const shell = (innerHTML)=>{
    const blitzLeft = isBlitz ? Math.max(0, T.blitzEnd - Date.now()) : 0;
    body.innerHTML = `
      <div class="trial-arena">
        <div class="ta-top">
          <button class="ta-quit" id="arenaQuitBtn" title="Quit this round">✕</button>
          ${isBlitz
            ? `<div class="blitz-head"><span class="blitz-secs" id="blitzSecs">${Math.ceil(blitzLeft/1000)}</span><span class="blitz-label">seconds</span><span class="blitz-count">⚡ ${T.correct} correct</span></div>`
            : `<div class="ta-pips">${T.qs.map((x,i)=>`<div class="ta-pip ${i<T.i?(x.ok?'hit':'miss'):(i===T.i?'now':'')}"></div>`).join("")}</div>`}
          <div class="ta-score">✦ ${T.score}</div>
          <div class="ta-combo ${T.combo>1?'hot':''}">🔥 ×${T.combo}</div>
        </div>
        ${isBlitz ? `<div class="ta-timer-wrap blitz-track"><span class="ta-timer-bar" id="blitzTimerBar" style="width:${(blitzLeft/(BLITZ_SECONDS*1000))*100}%; transition:none;"></span></div>` : ""}
        <div class="tc-pill" style="margin-bottom:10px;">${modeLabel} · ${ARENA_TYPE_LABEL[q.type]}</div>
        ${questHudHTML(T)}
        ${arenaHeartsHTML()}
        ${innerHTML}
        <div class="ta-foot">${isBlitz ? `Answer as many as you can before the storm passes ⚡` : `Question ${T.i+1} of ${T.qs.length}`}</div>
      </div>`;
    const quitBtn = document.getElementById("arenaQuitBtn");
    if(quitBtn) quitBtn.onclick = ()=>{
      if(q.timerHandle){ clearInterval(q.timerHandle); q.timerHandle=null; }
      if(T.blitzTimer){ clearInterval(T.blitzTimer); T.blitzTimer = null; }
      view.trialRound = null;
      showToast("Round left — nothing lost, come back anytime.");
      renderTrials();
      window.scrollTo({top:0});
    };
    if(isBlitz){
      if(T.blitzTimer) clearInterval(T.blitzTimer);
      T.blitzTimer = setInterval(()=>{
        if(view.trialRound !== T || T.done){ clearInterval(T.blitzTimer); T.blitzTimer = null; return; }
        const left = Math.max(0, T.blitzEnd - Date.now());
        const bar = document.getElementById("blitzTimerBar");
        const secs = document.getElementById("blitzSecs");
        if(bar) bar.style.width = (left/(BLITZ_SECONDS*1000))*100 + "%";
        if(secs){
          secs.textContent = Math.ceil(left/1000);
          if(left < 11000) secs.classList.add("low");
        }
        if(left <= 0){
          clearInterval(T.blitzTimer); T.blitzTimer = null;
          if(q.timerHandle){ clearInterval(q.timerHandle); q.timerHandle=null; }
          T.locked = true;
          T.done = true;
          finishArenaSession(T);
          SFX.whoosh();
          render();
        }
      }, 150);
    }
  };

  const advance = ()=>{
    setTimeout(()=>{
      if(view.trialRound !== T || T.done) return;
      T.locked = false;
      T.i += 1;
      if(T.i >= T.qs.length){
        T.done = true;
        finishArenaSession(T);
        render();
      } else {
        renderArenaSession();
      }
    }, isBlitz ? (q.ok ? 380 : 750) : (q.ok ? 950 : 1600));
  };
  const shake = ()=>{
    SFX.wrong();
    const arena = body.querySelector(".trial-arena");
    if(arena){ arena.classList.remove("shake"); void arena.offsetWidth; arena.classList.add("shake"); }
  };
  const flash = (btn, gained)=>{
    SFX.correct(T.combo);
    if(!btn){ FX.rain({count:24}); comboPop(); return; }
    const fx = document.createElement("div");
    fx.className = "ta-fly";
    fx.textContent = `+${gained} ✦`;
    btn.appendChild(fx);
    const ring = document.createElement("div");
    ring.className = "ta-ring";
    btn.appendChild(ring);
    setTimeout(()=>{ ring.remove(); }, 700);
    FX.burstAt(btn, {count: Math.min(40, 16 + T.combo*3)});
    comboPop();
  };
  const comboPop = ()=>{
    if(T.combo < 3) return;
    const arena = body.querySelector(".trial-arena");
    if(!arena) return;
    const pop = document.createElement("div");
    pop.className = "ta-combo-pop";
    pop.textContent = T.combo >= 8 ? `UNSTOPPABLE ×${T.combo} 🔥` : T.combo >= 5 ? `ON FIRE ×${T.combo} 🔥` : `COMBO ×${T.combo}!`;
    arena.appendChild(pop);
    setTimeout(()=>pop.remove(), 1100);
  };
  const withHint = ()=>{
    const hearts = arenaHeartCount();
    return `<div class="hint-row"><button class="hint-btn" id="hintBtn" ${hearts<=0?'disabled':''}>💛 Use a heart hint (${hearts}/${ARENA_HEART_MAX})</button></div>`;
  };

  if(q.type==="text2ref" || q.type==="ref2text" || q.type==="theme2ref" || q.type==="timedRecall"){
    const optLabel = (x)=>{
      if(q.type==="ref2text") return `<span class="to-text">"${trialSnippet(x.text,16)}"</span>`;
      if(q.type==="theme2ref") return `<span class="to-ref">${x.ref}</span><span class="to-theme">Choose the matching reference</span>`;
      if(q.type==="timedRecall") return `<span class="to-ref">${x.ref}</span><span class="to-theme">Recall under pressure</span>`;
      return `<span class="to-ref">${x.ref}</span>`;
    };
    let prompt;
    if(q.type==="text2ref" || q.type==="timedRecall"){
      prompt = `<div class="tq-kicker">Whose words are these?</div><div class="tq-text">"${trialSnippet(q.v.text,26)}"</div>`;
    } else if(q.type==="ref2text"){
      prompt = `<div class="tq-kicker">How does it begin?</div><div class="tq-ref">${q.v.ref}</div><div class="tq-theme">${q.v.theme}</div>`;
    } else {
      prompt = `<div class="tq-kicker">Which scripture teaches…</div><div class="tq-text">"${q.v.theme}"</div>`;
    }
    shell(`
      ${q.type==="timedRecall" ? `<div class="ta-timer-wrap"><span class="ta-timer-bar" id="taTimerBar" style="width:100%"></span></div>` : ""}
      <div class="tq-card">${prompt}</div>
      <div class="ta-opts">${q.options.map((x,i)=>`<button class="t-opt" data-i="${i}">${optLabel(x)}</button>`).join("")}</div>
      ${withHint()}
    `);
    const answer = (idx, btn, timedOut)=>{
      if(T.locked) return;
      T.locked = true;
      if(q.timerHandle){ clearInterval(q.timerHandle); q.timerHandle=null; }
      const pick = timedOut ? null : q.options[idx];
      const right = !timedOut && pick.id === q.v.id;
      settleAnswer(T, q, right);
      body.querySelectorAll(".t-opt").forEach((b,bi)=>{
        if(q.options[bi].id === q.v.id) b.classList.add("correct");
        else if(b===btn) b.classList.add("wrong");
        b.disabled = true;
      });
      if(right) flash(btn, q.gained); else shake();
      advance();
    };
    body.querySelectorAll(".t-opt").forEach(btn=>{
      btn.onclick = ()=> answer(Number(btn.dataset.i), btn, false);
    });
    const hintBtn = document.getElementById("hintBtn");
    if(hintBtn) hintBtn.onclick = ()=>{
      if(q.hinted) return;
      if(!spendArenaHeart(T, q, "One wrong answer faded away")) return;
      const wrongBtns = [...body.querySelectorAll(".t-opt")].filter((b,bi)=> q.options[bi].id !== q.v.id && !b.disabled);
      if(wrongBtns.length>1) { wrongBtns[0].disabled = true; wrongBtns[0].style.opacity = ".35"; }
      hintBtn.disabled = true; hintBtn.textContent = "💛 Heart used";
    };
    if(q.type==="timedRecall"){
      T.timeLeft = q.timeLimit;
      const bar = document.getElementById("taTimerBar");
      q.timerHandle = setInterval(()=>{
        T.timeLeft -= 1;
        if(bar) bar.style.width = Math.max(0, (T.timeLeft/q.timeLimit)*100) + "%";
        if(T.timeLeft<=0){ clearInterval(q.timerHandle); q.timerHandle=null; answer(-1, null, true); }
      }, 1000);
    }
  } else if(q.type==="finishVerse"){
    shell(`
      <div class="tq-card"><div class="tq-kicker">Finish the verse</div><div class="tq-text">"${q.lead} …"</div></div>
      <div class="ta-opts">${q.options.map((o,i)=>`<button class="t-opt" data-i="${i}"><span class="to-text">${o}</span></button>`).join("")}</div>
      ${withHint()}
    `);
    body.querySelectorAll(".t-opt").forEach(btn=>{
      btn.onclick = ()=>{
        if(T.locked) return;
        T.locked = true;
        const pick = q.options[Number(btn.dataset.i)];
        const right = pick === q.correctEnd;
        settleAnswer(T, q, right);
        body.querySelectorAll(".t-opt").forEach((b,bi)=>{
          if(q.options[bi]===q.correctEnd) b.classList.add("correct");
          else if(b===btn) b.classList.add("wrong");
          b.disabled = true;
        });
        if(right) flash(btn, q.gained); else shake();
        advance();
      };
    });
    const hintBtn = document.getElementById("hintBtn");
    if(hintBtn) hintBtn.onclick = ()=>{
      if(q.hinted) return;
      if(!spendArenaHeart(T, q, "One ending choice faded away")) return;
      const wrongBtns = [...body.querySelectorAll(".t-opt")].filter((b,bi)=> q.options[bi]!==q.correctEnd && !b.disabled);
      if(wrongBtns.length>1){ wrongBtns[0].disabled=true; wrongBtns[0].style.opacity=".35"; }
      hintBtn.disabled = true; hintBtn.textContent = "💛 Heart used";
    };
  } else if(q.type==="fillBlank"){
    const shown = q.words.map((w,i)=> i===q.blankIndex ? `<span class="blank-slot">&nbsp;</span>` : w).join(" ");
    shell(`
      <div class="tq-card"><div class="tq-kicker">Fill in the blank</div><div class="tq-lead">${shown}</div><div class="tq-theme" style="margin-top:6px;">${q.v.ref}</div></div>
      <div class="ta-opts">${q.options.map((o,i)=>`<button class="t-opt" data-i="${i}"><span class="to-text">${o}</span></button>`).join("")}</div>
      ${withHint()}
    `);
    body.querySelectorAll(".t-opt").forEach(btn=>{
      btn.onclick = ()=>{
        if(T.locked) return;
        T.locked = true;
        const pick = q.options[Number(btn.dataset.i)];
        const right = pick.toLowerCase() === q.correctWord.toLowerCase();
        settleAnswer(T, q, right);
        body.querySelectorAll(".t-opt").forEach((b,bi)=>{
          if(q.options[bi].toLowerCase()===q.correctWord.toLowerCase()) b.classList.add("correct");
          else if(b===btn) b.classList.add("wrong");
          b.disabled = true;
        });
        if(right) flash(btn, q.gained); else shake();
        advance();
      };
    });
    const hintBtn = document.getElementById("hintBtn");
    if(hintBtn) hintBtn.onclick = ()=>{
      if(q.hinted) return;
      if(!spendArenaHeart(T, q, "One blank choice faded away")) return;
      const wrongBtns = [...body.querySelectorAll(".t-opt")].filter((b,bi)=> q.options[bi].toLowerCase()!==q.correctWord.toLowerCase() && !b.disabled);
      if(wrongBtns.length>1){ wrongBtns[0].disabled=true; wrongBtns[0].style.opacity=".35"; }
      hintBtn.disabled = true; hintBtn.textContent = "💛 Heart used";
    };
  } else if(q.type==="findError"){
    shell(`
      <div class="tq-card"><div class="tq-kicker">Tap the word that doesn't belong</div><div class="fe-words">${q.words.map((w,i)=>`<span class="fe-word ${q.retryUsed && Number(q.firstMissIdx)===i ? "picked-wrong used" : ""}" data-i="${i}">${w}</span>`).join(" ")}</div><div class="tq-theme" style="margin-top:6px;">${q.v.ref}</div></div>
      ${q.retryUsed ? `<div class="fe-retry" id="feRetry">💛 Not that one — you get <strong>one more try</strong>. Look closer…</div>` : `<div class="fe-lives">❤️❤️ two tries</div>`}
    `);
    body.querySelectorAll(".fe-word").forEach(sp=>{
      sp.onclick = ()=>{
        if(T.locked || sp.classList.contains("used")) return;
        const idx = Number(sp.dataset.i);
        const right = idx === q.errorIndex;
        if(!right && !q.retryUsed){
          /* second chance: mark the miss, invite another look */
          q.retryUsed = true;
          q.firstMissIdx = idx;
          sp.classList.add("picked-wrong","used");
          SFX.wrong();
          const arena = body.querySelector(".trial-arena");
          if(arena){ arena.classList.remove("shake"); void arena.offsetWidth; arena.classList.add("shake"); }
          const card = body.querySelector(".tq-card");
          const lives = body.querySelector(".fe-lives");
          if(lives) lives.remove();
          if(card && !document.getElementById("feRetry")){
            const note = document.createElement("div");
            note.className = "fe-retry";
            note.id = "feRetry";
            note.innerHTML = `💛 Not that one — you get <strong>one more try</strong>. Look closer…`;
            card.after(note);
          }
          return;
        }
        T.locked = true;
        settleAnswer(T, q, right, right && q.retryUsed ? {penalty:5} : {});
        sp.classList.add(right ? "picked-right" : "picked-wrong");
        const correctSpan = body.querySelector(`.fe-word[data-i="${q.errorIndex}"]`);
        if(correctSpan) correctSpan.classList.add("picked-right");
        if(right){
          const note = document.getElementById("feRetry");
          if(note) note.innerHTML = q.retryUsed ? `💪 <strong>Got it on the retry!</strong> That's how climbers learn.` : "";
          flash(sp, q.gained);
        } else shake();
        advance();
      };
    });
  } else if(q.type==="wordScramble"){
    const remaining = q.scrPool.filter(c=>!q.scrUsed.includes(c.k));
    shell(`
      <div class="tq-card">
        <div class="tq-kicker">Untangle the verse · tap the words in order</div>
        <div class="tq-theme">${q.v.ref}${q.scrStart>0 ? " · starting mid-verse…" : ""}</div>
        ${q.scrLead ? `<div class="scr-context"><strong>Previous words</strong><span class="fade-tail">${escHTML(q.scrLead)}</span></div>` : `<div class="scr-context"><strong>Start here</strong><span class="fade-tail">Begin at the first word of this verse.</span></div>`}
        <div class="scr-built">${q.scrTarget.slice(0,q.scrNext).map(w=>`<span class="pv-chip done">${w}</span>`).join(" ")}${q.scrNext<q.scrTarget.length ? `<span class="pv-chip next">?</span>` : ""}</div>
      </div>
      <div class="scr-hint-row"><button class="hint-btn" id="scrHeartHint" ${arenaHeartCount()<=0?'disabled':''}>💛 Place next word (${arenaHeartCount()}/${ARENA_HEART_MAX})</button></div>
      <div class="scr-pool">
        ${remaining.map(c=>`<button class="scr-chip" data-k="${c.k}">${c.w}</button>`).join("")}
      </div>
    `);
    const finishOrContinueScramble = (anchor)=>{
      if(q.scrNext >= q.scrTarget.length){
        T.locked = true;
        const right = q.scrMiss < 5;
        settleAnswer(T, q, right, {penalty:q.scrMiss*2});
        renderArenaSession();
        const card = body.querySelector(".tq-card") || anchor;
        if(right) flash(card, q.gained); else shake();
        advance();
      } else {
        renderArenaSession();
      }
    };
    body.querySelectorAll(".scr-chip").forEach(btn=>{
      btn.onclick = ()=>{
        if(T.locked) return;
        const k = Number(btn.dataset.k);
        const chip = q.scrPool.find(c=>c.k===k);
        if(chip.w === q.scrTarget[q.scrNext]){
          q.scrUsed.push(k);
          q.scrNext += 1;
          SFX.pick();
          finishOrContinueScramble(btn);
        } else {
          q.scrMiss += 1;
          SFX.wrong();
          btn.classList.add("wrong");
          setTimeout(()=> btn.classList.remove("wrong"), 380);
        }
      };
    });
    const scrHeartHint = document.getElementById("scrHeartHint");
    if(scrHeartHint) scrHeartHint.onclick = ()=>{
      if(T.locked || q.scrNext >= q.scrTarget.length) return;
      if(!spendArenaHeart(T, q, "Next Untangle word placed")) return;
      const nextChip = remaining.find(c=>c.k === q.scrNext);
      if(!nextChip) return;
      q.scrUsed.push(nextChip.k);
      q.scrNext += 1;
      SFX.pick();
      finishOrContinueScramble(scrHeartHint);
    };
  } else if(q.type==="pairMatch"){
    const matchedN = Object.keys(q.pairDone).length;
    shell(`
      <div class="tq-card">
        <div class="tq-kicker">Match each reference to its teaching</div>
        <div class="pm-grid">
          <div class="pm-col">
            ${q.pairLeft.map(o=>`<button class="pm-chip pm-l ${q.pairDone[o.id]?'matched':''} ${q.selL===o.id?'sel':''}" data-id="${o.id}"><span class="to-ref" style="font-size:13px;">${o.label}</span></button>`).join("")}
          </div>
          <div class="pm-col">
            ${q.pairRight.map(o=>`<button class="pm-chip pm-r ${q.pairDone[o.id]?'matched':''}" data-id="${o.id}"><span class="to-theme" style="font-size:11.5px;">${o.label}</span></button>`).join("")}
          </div>
        </div>
        <div class="pm-foot">${matchedN}/3 matched${q.pmMiss ? ` · ${q.pmMiss} slip${q.pmMiss===1?"":"s"}` : ""}</div>
      </div>
    `);
    const settlePairs = ()=>{
      T.locked = true;
      const right = q.pmMiss <= 3;
      settleAnswer(T, q, right, {penalty:q.pmMiss*2});
      const card = body.querySelector(".tq-card");
      if(right) flash(card, q.gained); else shake();
      advance();
    };
    body.querySelectorAll(".pm-l").forEach(btn=>{
      btn.onclick = ()=>{
        if(T.locked || btn.classList.contains("matched")) return;
        q.selL = btn.dataset.id;
        body.querySelectorAll(".pm-l").forEach(b=>b.classList.toggle("sel", b===btn));
        SFX.tap();
      };
    });
    body.querySelectorAll(".pm-r").forEach(btn=>{
      btn.onclick = ()=>{
        if(T.locked || btn.classList.contains("matched") || !q.selL) return;
        if(btn.dataset.id === q.selL){
          q.pairDone[q.selL] = true;
          q.selL = null;
          SFX.pick();
          if(Object.keys(q.pairDone).length >= 3){
            renderArenaSession();
            settlePairs();
          } else {
            renderArenaSession();
          }
        } else {
          q.pmMiss += 1;
          SFX.wrong();
          const selBtn = body.querySelector(".pm-l.sel");
          [btn, selBtn].forEach(b=>{ if(b){ b.classList.add("miss"); setTimeout(()=>b.classList.remove("miss"), 380); } });
          const foot = body.querySelector(".pm-foot");
          if(foot) foot.textContent = `${Object.keys(q.pairDone).length}/3 matched · ${q.pmMiss} slip${q.pmMiss===1?"":"s"}`;
        }
      };
    });
  } else if(q.type==="buildVerse"){
    const done = q.builtIndex >= q.chunks.length;
    let options = [];
    if(!done){
      const correct = q.chunks[q.builtIndex];
      const distract = shuffleArr(q.chunks.filter((c,i)=>i!==q.builtIndex)).slice(0,2);
      options = shuffleArr([correct].concat(distract));
    }
    shell(`
      <div class="tq-card"><div class="tq-kicker">Build the verse · ${q.v.ref}</div>
        <div class="prove-built">${q.chunks.slice(0,q.builtIndex).map(c=>`<span class="pv-chip done">${c}</span>`).join(" ")}${done ? "" : `<span class="pv-chip next">?</span>`}</div>
      </div>
      ${done ? "" : `<div class="prove-options">${options.map(o=>`<button class="btn prove-opt" data-opt="${encodeURIComponent(o)}">${o}</button>`).join("")}</div>`}
    `);
    const builtBox = body.querySelector(".prove-built");
    if(builtBox && builtBox.lastElementChild) builtBox.lastElementChild.scrollIntoView({block:"end", inline:"nearest"});
    if(!done){
      body.querySelectorAll(".prove-opt").forEach(btn=>{
        btn.onclick = ()=>{
          const val = decodeURIComponent(btn.dataset.opt);
          if(val === q.chunks[q.builtIndex]){
            const opts = body.querySelector(".prove-options");
            if(opts) opts.classList.add("resolving");
            body.querySelectorAll(".prove-opt").forEach(b=>b.disabled = true);
            btn.classList.add("correct");
            recordArenaQuestStep(T, def=>def.track==="buildStep" && def.type===q.type, 1);
            q.builtIndex++;
            if(q.builtIndex>=q.chunks.length){
              settleAnswer(T, q, true);
              flash(btn, q.gained);
              advance();
            } else {
              SFX.pick();
              setTimeout(()=> renderArenaSession(), 95);
            }
          } else {
            SFX.wrong();
            btn.classList.add("wrong");
            setTimeout(()=> btn.classList.remove("wrong"), 400);
          }
        };
      });
    }
  } else if(q.type==="fullRecitation"){
    shell(`
      <div class="tq-card"><div class="tq-kicker">Full recitation</div><div class="tq-ref">${q.v.ref}</div><div class="tq-theme">${q.v.theme}</div>
        <p style="margin-top:10px;color:#b9aef2;font-size:12.5px;font-weight:700;">Recite the entire scripture aloud from memory, then be honest with yourself.</p>
      </div>
      ${q.peekOpen ? `<div class="recite-peek">"${numberedVerseText(q.v)}"</div>` : ``}
      <div class="recite-btns">
        <button class="btn primary" id="reciteGood">✓ I recited it fully</button>
        <button class="btn" id="reciteHint">${q.peekOpen ? "🙈 Hide the words" : "👀 Peek at the words"}</button>
        <button class="btn" id="reciteMiss">✗ I need more practice</button>
      </div>
    `);
    document.getElementById("reciteGood").onclick = ()=>{
      if(T.locked) return; T.locked = true;
      settleAnswer(T, q, true);
      flash(document.getElementById("reciteGood"), q.gained);
      advance();
    };
    document.getElementById("reciteMiss").onclick = ()=>{
      if(T.locked) return; T.locked = true;
      settleAnswer(T, q, false);
      shake();
      advance();
    };
    document.getElementById("reciteHint").onclick = ()=>{
      if(!q.peekOpen && !spendArenaHeart(T, q, "Scripture words revealed")) return;
      q.peekOpen = !q.peekOpen;
      renderArenaSession();
    };
  }
}

/* ---- results screen ---- */
function renderArenaResults(){
  const body = document.getElementById("body");
  const T = view.trialRound;
  const a = ensureArena();
  const isBlitz = T.mode.kind==="blitz";
  const answered = T.qs.filter(q=>q.ok!==null).length;
  const total = isBlitz ? answered : T.qs.length;
  const perfect = isBlitz ? false : (total>0 && T.correct === total);
  const stars = isBlitz
    ? (T.correct >= 15 ? 3 : (T.correct >= 8 ? 2 : (T.correct > 0 ? 1 : 0)))
    : (perfect ? 3 : (T.correct >= Math.ceil(total*0.6) ? 2 : (T.correct > 0 ? 1 : 0)));
  const accuracy = total ? Math.round((T.correct/total)*100) : 0;
  const practiced = [...new Set(T.qs.filter(q=>q.ok!==null).map(q=>q.v.id))];
  const improved = [...new Set(T.qs.filter(q=>q.ok && !state.progress[q.v.id].sealed).map(q=>q.v.id))];
  const mastered = [...new Set(T.qs.filter(q=>q.ok && state.progress[q.v.id].sealed).map(q=>q.v.id))];
  let challengeLine = "Quick Practice session";
  if(T.mode.kind==="book") challengeLine = `${TOWERS[T.mode.vol].name} · Area ${T.mode.area+1}/5 ${perfect ? "— cleared ✦" : "(clear all questions to master this area)"}`;
  if(T.mode.kind==="grand") challengeLine = `Grand Scripture Challenge · Area ${T.mode.area+1}/10 ${perfect ? "— cleared ✦" : "(clear all questions to master this area)"}`;
  if(T.mode.kind==="quest"){ const qd = questDef(T.mode.questId); challengeLine = qd ? `${qd.emoji} Quest round · ${qd.name}` : "Quest round"; }
  if(isBlitz) challengeLine = `⚡ Lightning Round · ${T.correct} correct in ${BLITZ_SECONDS}s${T.correct >= a.blitz.best && T.correct>0 ? " — new best!" : ""}`;
  let headline, subline;
  if(isBlitz){
    headline = T.correct >= 15 ? "⚡ Lightning Ace!" : T.correct >= 8 ? "⚡ Storm Rider!" : T.correct > 0 ? "The Storm Passes" : "The Storm Humbles All";
    subline = `${T.correct} correct in ${BLITZ_SECONDS} seconds · best streak ×${T.bestCombo}`;
  } else {
    headline = perfect ? "Flawless Victory!" : (T.correct ? "Trial Complete" : "The Arena Humbles All");
    subline = `${T.correct} of ${total} struck true · best streak ×${T.bestCombo}`;
  }
  const shareLine = isBlitz
    ? `⚡ I scored ${T.correct} correct in a ${BLITZ_SECONDS}-second Lightning Round in Scripture Quest! Best combo ×${T.bestCombo}. Think you can beat me? 🏰`
    : `⚔️ Arena victory in Scripture Quest: ${T.correct}/${total} correct (${accuracy}%)${perfect ? " — FLAWLESS ✨" : ""}, best combo ×${T.bestCombo}.${T.heartBonus ? ` ${T.heartBonus.label} +${T.heartBonus.xp} XP!` : ""} ${sealedTotal()} verses sealed and climbing! 🏰`;
  body.innerHTML = `
    <div class="trial-hall trial-results">
      ${perfect ? `<div class="tr-stamp">FLAWLESS</div>` : ""}
      <div class="tr-stars">${[1,2,3].map(i=>`<span class="tr-star ${i<=stars?'lit':''}" style="animation-delay:${i*0.2}s">★</span>`).join("")}</div>
      <h2>${headline}</h2>
      <p>${subline}</p>
      <div class="tr-xp">+${T.score} score${perfect ? " · flawless" : ""}${T.heartBonus ? ` · ${T.heartBonus.label}` : ""}</div>
      ${T.heartBonus ? `
        <div class="tr-resealed" style="max-width:400px;">
          <div class="trr-title">💛 ${T.heartBonus.label}</div>
          <div class="trr-item"><span>${T.heartBonus.desc}</span><span style="margin-left:auto;">+${T.heartBonus.xp} XP</span></div>
        </div>` : ""}
      <div class="tr-resealed" style="max-width:400px;">
        <div class="trr-title">Session summary</div>
        <div class="trr-item"><span>🎯 Accuracy</span><span style="margin-left:auto;">${accuracy}%</span></div>
        <div class="trr-item"><span>🔥 Best streak</span><span style="margin-left:auto;">×${T.bestCombo}</span></div>
        <div class="trr-item"><span>📚 Scriptures practiced</span><span style="margin-left:auto;">${practiced.length}</span></div>
        <div class="trr-item"><span>📈 Scriptures improved</span><span style="margin-left:auto;">${improved.length}</span></div>
        <div class="trr-item"><span>🏺 Scriptures mastered</span><span style="margin-left:auto;">${mastered.length}</span></div>
        <div class="trr-item"><span>💛 Hearts used</span><span style="margin-left:auto;">${T.hintsUsed}</span></div>
        <div class="trr-item"><span>🗺️ Challenge</span><span style="margin-left:auto;text-align:right;">${challengeLine}</span></div>
      </div>
      ${T.resealed.length ? `
        <div class="tr-resealed">
          <div class="trr-title">🕯️ Seals restored by your victory</div>
          ${T.resealed.map(v=>`<div class="trr-item">${relicHTML(v, 40)}<span>${v.ref}</span></div>`).join("")}
        </div>` : ""}
      ${T.newlyUnlocked.length ? `
        <div class="tr-resealed">
          <div class="trr-title">🎖️ New achievements</div>
          ${T.newlyUnlocked.map(id=>{
            const ac = ARENA_ACHIEVEMENTS.find(x=>x.id===id);
            return `<div class="trr-item"><span>${ac.emoji}</span><span>${ac.name} — ${ac.desc}</span></div>`;
          }).join("")}
        </div>` : ""}
      ${T.newQuestBadges.length ? `
        <div class="tr-resealed">
          <div class="trr-title">🎁 Quests completed</div>
          ${T.newQuestBadges.map(def=>`<div class="trr-item">${chestImg(def.chest,28)}<span>${def.emoji} ${def.name} — ${def.desc}</span></div>`).join("")}
        </div>` : ""}
      <div class="tr-btns">
        <button class="btn primary" id="trAgain">Another round ▸</button>
        ${T.mode.questId ? `<button class="btn" id="trQuests">Today's quests</button>` : ""}
        <button class="btn" id="trShare">📣 Share</button>
        <button class="btn" id="trHome">Back to camp</button>

function nextRankInfo(){
  let curT = 0, curName = RANKS[0][1], nextT = null, nextName = null;
  RANKS.forEach(([t,n])=>{ if(state.xp>=t){ curT = t; curName = n; } });
  const nxt = RANKS.find(([t])=>t>state.xp);
  if(nxt){ nextT = nxt[0]; nextName = nxt[1]; }
  const pct = nextT ? Math.round(((state.xp-curT)/(nextT-curT))*100) : 100;
  return {curName, nextT, nextName, pct};
}

  body.querySelectorAll(".quest-done-card").forEach(el=>{

      view.tab = "trials";

      showToast(`${def ? def.emoji+" <strong>"+def.name+"</strong>" : "Quest"} chest is already on your Quest Shelf.`);
      window.scrollTo({top:0});

  body.querySelectorAll(".achv-top[data-achv]").forEach(el=>{

  const heroTower = document.getElementById("heroTower");
  if(heroTower) heroTower.onclick = ()=>{ view.tab = "towers"; view.volume = "Book of Mormon"; render(); window.scrollTo({top:0}); };
  const shelfGo = document.getElementById("shelfGo");
  if(shelfGo) shelfGo.onclick = ()=>{ view.tab = "shelf"; render(); window.scrollTo({top:0}); };
  body.querySelectorAll(".shelf-strip-item").forEach(el=>{

  });
  const trialBtn = document.getElementById("trialBtn");
  if(trialBtn) trialBtn.onclick = ()=>{ view.tab = "trials"; view.trialRound = null; render(); window.scrollTo({top:0}); };
  body.querySelectorAll(".choice-card").forEach(el=>{
    el.onclick = ()=> openStudy(el.dataset.id, false);
  });
  const qb = document.getElementById("questBtn");
  if(qb) qb.onclick = ()=>{ view.tab = "towers"; view.volume = recommendedVerse().volume; render(); window.scrollTo({top:0}); };
  const qa = document.getElementById("questAlt");

  body.querySelectorAll(".review-item").forEach(el=>{

  body.querySelectorAll(".tstrip").forEach(el=>{
    el.onclick = ()=>{ view.volume = el.dataset.vol; view.tab = "towers"; render(); };
  });
}

/* =========================================================
   TOWER VISUAL — the climbable tower art (25 floors, 5 pieces).
   Each volume has its own kit in temple-towers/ (see TOWERS[vol].art):
   <prefix>bottom.png (ground), <prefix>window-01.png (floor 1),
   <prefix>window-repeat.png (floors 2-23), <prefix>top-window-24.png
   (floor 24), and <prefix>roof-final-25.png (floor 25, the crown).
   All kits share the same piece geometry (640w · 251/87/94/302).
   ========================================================= */
const TV_ASSET = { repeatLevels:22, roofHeight:251, topHeight:87, windowHeight:94, baseHeight:302 };
TV_ASSET.worldHeight = TV_ASSET.roofHeight + TV_ASSET.topHeight
  + (TV_ASSET.repeatLevels * TV_ASSET.windowHeight) + TV_ASSET.windowHeight + TV_ASSET.baseHeight;

function tvLevelTop(level){
  const {roofHeight:R, topHeight:T, windowHeight:W, repeatLevels:REP} = TV_ASSET;
  if(level === 25) return 0;
  if(level === 24) return R;
  if(level >= 2) return R + T + ((23 - level) * W);
  return R + T + (REP * W);
}
function tvLevelHeight(level){
  if(level === 25) return TV_ASSET.roofHeight;
  if(level === 24) return TV_ASSET.topHeight;
  return TV_ASSET.windowHeight;
}
// Each art piece's window sits at a slightly different offset within its tile —
// measured directly from the PNGs rather than guessed from tile height.
function tvGlowTop(level){
  if(level === 25) return 163;
  if(level === 1) return 36;
  if(level === 24) return 32;
  return 31;
}
function tvLevelOffset(viewportEl, scale, level){
  if(level === 1) return 0;
  const viewportHeight = viewportEl.clientHeight;
  const viewportTarget = viewportHeight * 0.58;
  const dist = TV_ASSET.worldHeight - (tvLevelTop(level) + tvLevelHeight(level) / 2);
  const raw = dist - (viewportTarget / scale);
  const minOffset = 0;
  const maxOffset = (TV_ASSET.worldHeight * scale - viewportHeight) / scale;
  return Math.max(minOffset, Math.min(maxOffset, raw));
}

function buildTowerVisual(container, vol){
  const art = (TOWERS[vol] && TOWERS[vol].art) || {prefix:"temple-towers/restoration-temple-", baseWidth:585};
  container.innerHTML = `
    <div class="tv-viewport">
      <div class="tv-caption"><span>Floor</span><strong id="tvCaptionNum">1</strong></div>
      <div class="tv-floorinfo" id="tvFloorInfo"></div>
      <div class="tv-nav">
        <button type="button" class="tv-nav-btn" id="tvUp" title="Climb up">▲</button>
        <button type="button" class="tv-nav-btn" id="tvHere" title="Jump to your floor">⌖</button>
        <button type="button" class="tv-nav-btn" id="tvDown" title="Climb down">▼</button>
      </div>
      <div class="tv-world" id="tvWorld">
        <img class="tv-piece" src="${art.prefix}roof-final-25.png" alt="">
        <img class="tv-piece" src="${art.prefix}top-window-24.png" alt="">
        <div id="tvRepeatStack"></div>
        <img class="tv-piece" src="${art.prefix}window-01.png" alt="">
        <img class="tv-piece tv-base" src="${art.prefix}bottom.png" alt="" style="width:${art.baseWidth}px">
        <div id="tvLevelLayers"></div>
      </div>
    </div>`;
  const repeatStack = container.querySelector("#tvRepeatStack");
  for(let i=0; i<TV_ASSET.repeatLevels; i++){
    const img = document.createElement("img");
    img.className = "tv-piece tv-repeat";
    img.src = `${art.prefix}window-repeat.png`;
    img.alt = "";
    repeatStack.appendChild(img);
  }
  const levelLayers = container.querySelector("#tvLevelLayers");
  for(let level=1; level<=25; level++){
    const layer = document.createElement("div");
    layer.className = "tv-layer";
    layer.style.top = `${tvLevelTop(level)}px`;
    layer.style.height = `${tvLevelHeight(level)}px`;
    layer.dataset.level = String(level);

    const glow = document.createElement("div");
    glow.className = "tv-glow";
    glow.style.top = `${tvGlowTop(level)}px`;

    if(level === 25){
      glow.style.width = "96px"; glow.style.height = "74px"; glow.style.borderRadius = "18px";
    }

    const badge = document.createElement("div");
    badge.className = "tv-badge";
    badge.textContent = String(level);

    const relic = document.createElement("div");
    relic.className = "tv-relic " + (level % 2 ? "tv-relic-right" : "tv-relic-left");
    layer.append(glow, relic, badge);
    levelLayers.appendChild(layer);
  }
}

function updateTowerVisual(container, litCount, activeLevel, vol){
  const viewportEl = container.querySelector(".tv-viewport");
  const world = container.querySelector("#tvWorld");
  if(!viewportEl || !world) return;
  const scale = Math.min(0.86, Math.max(0.4, (viewportEl.clientWidth / 640) * 0.94));
  world.style.setProperty("--tv-scale", scale);
  world.style.setProperty("--tv-y", `${tvLevelOffset(viewportEl, scale, activeLevel)}px`);
  const log = vol ? climbLog(vol) : [];
  container.querySelectorAll(".tv-layer").forEach(layer=>{
    const lvl = Number(layer.dataset.level);
    layer.classList.toggle("is-active", lvl === activeLevel);
    layer.classList.toggle("is-complete", lvl <= litCount && lvl !== activeLevel);
    const slot = layer.querySelector(".tv-relic");
    if(slot){
      const id = (lvl <= litCount) ? log[lvl-1] : null;
      const v = id ? VERSES.find(x=>x.id===id) : null;
      if(v){
        if(layer.dataset.verse !== v.id){
          const r = relicFor(v);
          slot.innerHTML = (RELIC_IMAGES && r.designed)
            ? `<img src="relics/${v.id}.webp" alt="" loading="lazy">`
            : `<span>${r.emoji}</span>`;
          slot.title = `${v.ref} · ${r.name}`;
          layer.dataset.verse = v.id;
        }
        slot.classList.add("on");
        layer.classList.add("tv-clickable");
      } else {
        slot.classList.remove("on");
        layer.classList.remove("tv-clickable");
        delete layer.dataset.verse;
      }
    }
  });
  const info = container.querySelector("#tvFloorInfo");
  if(info && vol){
    const fid = log[activeLevel-1];
    let inner;
    if(fid){
      const fv = VERSES.find(x=>x.id===fid);
      const fr = relicFor(fv);
      const fp = state.progress[fv.id];
      inner = `<strong>${fv.ref}</strong><span>${fr.name}${isEternal(fp) ? " ♾️" : (isDue(fp) ? " 🕯️" : " ✦")}</span>`;
    } else if(activeLevel === log.length + 1){
      inner = `<strong>🗝️ Floor ${activeLevel}</strong><span>Seal a verse to light this window</span>`;
    } else {
      inner = `<strong>🌫️ Floor ${activeLevel}</strong><span>Still hidden in the mist</span>`;
    }
    if(info.innerHTML !== inner){
      info.innerHTML = inner;
      info.classList.remove("pop"); void info.offsetWidth; info.classList.add("pop");
    }
    info.classList.add("show");
  }
  const cap = container.querySelector("#tvCaptionNum");
  if(cap) cap.textContent = String(activeLevel);
  container._tvLast = { lit: litCount, active: activeLevel, vol };
}

window.addEventListener("resize", ()=>{
  const tv = document.getElementById("towerVisual");
  if(tv && tv._tvLast) updateTowerVisual(tv, tv._tvLast.lit, tv._tvLast.active, tv._tvLast.vol);
});

function renderTowerDetail(vol){
  const body = document.getElementById("body");
  const t = TOWERS[vol];
  const vs = versesInVolume(vol);
  const s = towerStats(vol);
  const log = climbLog(vol);
  const nextFloor = log.length + 1;
  const complete = log.length >= vs.length;

  /* --- next floor: pick your verse, open the next chest --- */
  let nextHTML = "";
  if(!complete){
    const choices = climbChoices(vol);
    nextHTML = `
      <div class="next-floor" style="--thue:${t.hue};--tsoft:${t.soft}">
        <div class="nf-chest">
          ${chestImg(nextFloor, 92)}
          <div class="nf-chest-label">Chest ${nextFloor}</div>
        </div>
        <div class="nf-body">
          <div class="nf-title">Floor ${nextFloor} · choose your verse</div>
          <div class="nf-sub">Seal any one of these and this chest opens. The climb is yours: every climber's tower is different.</div>
          <div class="choice-grid">
            ${choices.map(c=>{
              const d = difficultyForVerse(c.v);
              const p = state.progress[c.v.id];
              const started = (p.stage||0) > 0;
              return `
                <div class="choice-card ${c.cls}" data-id="${c.v.id}">
                  <div class="cc-tag">${c.tag}</div>
                  ${relicHTML(c.v, 62)}
                  <div class="cc-info">
                    <div class="cc-ref">${c.v.ref}</div>
                    <div class="cc-theme">${c.v.theme}</div>
                    <div class="cc-meta">${d.emoji} ${d.label} · ${d.words} words${started ? ` · ${shardsFor(p)}/5 shards` : ""}</div>
                  </div>
                </div>`;
            }).join("")}
          </div>
        </div>
      </div>
      ${vs.length - log.length > 1 ? `<div class="mist-note">🌫️ ${vs.length - log.length - 1} more chests wait in the mist above.</div>` : ""}`;
  } else {
    nextHTML = `<div class="crowned">👑 <strong>${t.name} is crowned!</strong><br><span>Every chest opened, every relic claimed. Keep your seals burning to keep it lit.</span></div>`;
  }

  /* --- climbed floors, highest first --- */
  const rows = log.map((id, i)=>{
    const v = VERSES.find(x=>x.id===id);
    if(!v) return "";
    const p = state.progress[v.id];
    const r = relicFor(v);
    return `
      <div class="floor lit" data-id="${v.id}">
        <div class="fl-num">${i+1}</div>
        <div class="fl-chestimg">${chestImg(i+1, 48)}</div>
        <div style="position:relative;flex-shrink:0;">${relicHTML(v, 58)}</div>
        <div class="fl-info">
          <div class="fl-ref">${v.ref} <span class="fl-torch">🔥</span></div>
          <div class="fl-name">${r.name}</div>
          <div class="fl-meta">${condBadgeHTML(p)} <span>${nextReviewText(p)}</span></div>
        </div>
        ${isDue(p) ? `<div class="fl-here" style="background:linear-gradient(180deg,#fdba74,#f97316);box-shadow:0 2px 0 #c2410c;">Re-seal</div>` : ""}
      </div>`;
  }).reverse().join("");

  body.innerHTML = `
    <div class="tower-head" style="--thue:${t.hue};--tsoft:${t.soft}">
      <span class="th-back" id="backTowers">◂ All towers</span>
      <div class="th-name">${t.icon} ${t.name}</div>
      <div class="th-vol">${displayVolumeName(vol)} · your climb: ${log.length}/${vs.length} floors</div>
      <div class="th-stats">
        <span class="tc-pill">${s.sealed}/${s.total} chests opened</span>
        ${s.eternal?`<span class="tc-pill">♾️ ${s.eternal} eternal</span>`:''}
        ${s.due?`<span class="tc-pill warn">🕯️ ${s.due} fading</span>`:''}
      </div>
      <div class="th-bar"><i style="width:${Math.round(s.pct*100)}%"></i></div>
    </div>
    <div class="tower-cols">
      <div class="tower-col-main">
        ${nextHTML}
        ${rows ? `<div class="floors">${rows}</div>` : `<footer class="hint">No floors climbed yet. Pick a verse; sealing it builds Floor 1 of your tower.</footer>`}
        ${rows ? `<footer class="hint">Your tower is built one memorized verse at a time, in your order. Re-seal before a floor cracks to keep it lit.</footer>` : ""}
      </div>
      <div class="tower-col-side">
        <div class="tower-visual" id="towerVisual" style="--thue:${t.hue};--tsoft:${t.soft}"></div>
      </div>
    </div>`;

  const towerVisual = document.getElementById("towerVisual");
  buildTowerVisual(towerVisual, vol);
  const climbing = (pendingClimb && pendingClimb.vol === vol) ? pendingClimb : null;
  pendingClimb = null;
  if(climbing){
    /* arrive one floor below, then ride up as the new window lights */
    updateTowerVisual(towerVisual, climbing.floor - 1, Math.max(1, climbing.floor - 1), vol);
    const climbedId = log[climbing.floor - 1];
    const climbedV = climbedId ? VERSES.find(x=>x.id===climbedId) : null;
    const ban = document.createElement("div");
    ban.className = "tv-congrats";
    ban.innerHTML = `🎉 <strong>Floor ${climbing.floor} conquered!</strong><br><span>${climbedV ? relicFor(climbedV).name + " now shines in the window." : "The tower grows."}</span>`;
    towerVisual.querySelector(".tv-viewport").appendChild(ban);
    setTimeout(()=>{
      updateTowerVisual(towerVisual, log.length, Math.min(25, climbing.floor), vol);
      ban.classList.add("show");
    }, 750);
    setTimeout(()=>{ ban.classList.remove("show"); }, 7200);
  } else {
    updateTowerVisual(towerVisual, log.length, complete ? 25 : Math.min(25, nextFloor), vol);
  }
  towerVisual.querySelectorAll(".tv-layer").forEach(layer=>{
    layer.onclick = ()=>{
      const id = layer.dataset.verse;
      if(id) openStudy(id, isDue(state.progress[id]));
    };
  });
  const tvNav = (delta)=>{
    const cur = towerVisual._tvLast || {active: 1, lit: log.length};
    const target = delta === 0
      ? (complete ? 25 : Math.min(25, nextFloor))
      : Math.max(1, Math.min(25, cur.active + delta));
    updateTowerVisual(towerVisual, cur.lit, target, vol);
  };
  const tvUp = towerVisual.querySelector("#tvUp");
  const tvDown = towerVisual.querySelector("#tvDown");
  const tvHere = towerVisual.querySelector("#tvHere");
  if(tvUp) tvUp.onclick = (e)=>{ e.stopPropagation(); tvNav(1); };
  if(tvDown) tvDown.onclick = (e)=>{ e.stopPropagation(); tvNav(-1); };
  if(tvHere) tvHere.onclick = (e)=>{ e.stopPropagation(); tvNav(0); };

  document.getElementById("backTowers").onclick = ()=>{ view.volume = null; render(); };
  body.querySelectorAll(".choice-card").forEach(el=>{
    el.onclick = ()=> openStudy(el.dataset.id, false);
  });
  body.querySelectorAll(".floor").forEach(el=>{
    el.onclick = ()=>{
      const p = state.progress[el.dataset.id];
      openStudy(el.dataset.id, isDue(p));
    };
  });
}

/* =========================================================
   LIBRARY
   ========================================================= */
function libraryFilters(){
  return [
    {id:"gettingStarted", label:"🌱 Getting Started"},
    {id:"due", label:"🕯️ Fading seals"},
    {id:"popular", label:"🔖 Popular"},
    {id:"easy", label:"☀️ Easy"},
    {id:"medium", label:"⛅ Medium"},
    {id:"hard", label:"🌧️ Hard"},
    {id:"challenge", label:"⛈️ Challenge"},
    {id:"impossible", label:"🌪️ Impossible"},
    {id:"unsealed", label:"🧭 Unsealed"},
    {id:"all", label:"📚 All"}
  ];
}
function versesForCurrentFilter(){
  let list = VERSES.slice();
  const f = view.filter || "gettingStarted";
  if(f === "gettingStarted"){
    return list
      .filter(v=>isPopularVerse(v) && difficultyForVerse(v).index <= 1 && !state.progress[v.id].sealed)
      .sort((a,b)=>difficultyForVerse(a).index - difficultyForVerse(b).index || wordCount(a.text) - wordCount(b.text))
      .slice(0,5);
  }
  if(f === "due") return dueReviews();
  if(f === "popular") return list.filter(isPopularVerse);
  if(f === "easy") return list.filter(v=>difficultyForVerse(v).index===0);
  if(f === "medium") return list.filter(v=>difficultyForVerse(v).index===1);
  if(f === "hard") return list.filter(v=>difficultyForVerse(v).index===2);
  if(f === "challenge") return list.filter(v=>difficultyForVerse(v).index===3);
  if(f === "impossible") return list.filter(v=>difficultyForVerse(v).index===4);
  if(f === "unsealed") return list.filter(v=>!state.progress[v.id].sealed);
  return list;
}
function filterCountText(){
  const n = versesForCurrentFilter().length;
  if(view.filter === "gettingStarted") return `${n}/5 shown`;
  return `${n} shown`;
}
function renderFilterPanelHTML(){
  return `
    <div class="filter-panel" id="filterPanel">
      <div class="filter-title"><span>Quest Path</span><span class="count">${filterCountText()}</span></div>
      <div class="filter-chips">
        ${libraryFilters().map(f=>`<button class="filter-chip ${view.filter===f.id?'active':''}" data-filter="${f.id}">${f.label}</button>`).join("")}
      </div>
    </div>`;
}
function popularBookmarkHTML(v){
  return isPopularVerse(v) ? '<div class="popular-bookmark" title="Popular / often quoted scripture">🔖</div>' : '';
}
function popularPillHTML(v){
  return isPopularVerse(v) ? '<div class="study-popular" title="Popular / often quoted scripture">🔖 Popular / often quoted</div>' : '';
}
function cardHTML(v){
  const p = state.progress[v.id];
  const diff = difficultyForVerse(v);
  return `
    <div class="card level-${diff.index} ${p.sealed ? 'sealed-card' : ''} ${isPopularVerse(v) ? 'popular-card' : ''}" data-id="${v.id}">
      ${popularBookmarkHTML(v)}
      <div class="difficulty-badge" title="${p.sealed ? 'Sealed' : `${diff.label} · ${diff.words} words`}">${p.sealed ? '✨' : diff.emoji}</div>
      <div class="ref">${v.ref}</div>
      <div class="theme">${v.theme}</div>
      <div class="stage-row">
        ${STAGES.map((s,i)=>`<div class="pip ${p.sealed?'sealed':(i<p.stage?'done':'')}"></div>`).join("")}
      </div>
      ${p.sealed ? `<div class="seal-tag">${isEternal(p) ? 'Eternal ✦' : (isDue(p) ? 'Re-seal due 🕯️' : 'Sealed ✦')}</div>` : ''}
    </div>`;
}
function renderLibrary(){
  const body = document.getElementById("body");
  const selected = versesForCurrentFilter();
  let html = "";
  if(view.filter === "gettingStarted"){
    html += `<div class="getting-started-note">🌱 <strong>Getting Started</strong> shows up to 5 short, popular scriptures so the first memorization wins feel fast and encouraging.</div>`;
  }
  if(view.filter === "due" && selected.length){
    html += `<div class="getting-started-note">🕯️ These seals are fading. A quick honest recitation restores each one and climbs its ladder toward an <strong>Eternal Seal</strong>.</div>`;
  }
  if(selected.length === 0){
    html += `<div class="empty">No scriptures match this filter yet.</div>`;
  } else {
    VOLUME_ORDER.forEach(vol=>{
      const items = selected.filter(v=>v.volume===vol);
      if(!items.length) return;
      html += `<div class="volume"><h2>${displayVolumeName(vol)}</h2><div class="verse-grid">`;
      items.forEach(v=>{ html += cardHTML(v); });
      html += `</div></div>`;
    });
  }
  body.innerHTML = html;
  body.querySelectorAll(".card").forEach(c=>{
    c.onclick = ()=>{
      const p = state.progress[c.dataset.id];
      openStudy(c.dataset.id, isDue(p));
    };
  });
}

/* =========================================================
   WORD HELPERS + STUDY
   ========================================================= */
function tokenize(text){ return text.split(/(\s+)/).filter(t=>t.length); }
function isWord(tok){ return /\w/.test(tok); }
function escHTML(s){
  return String(s)
    .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;").replace(/'/g,"&#39;");
}

/* ---- multi-verse number markers (e.g. "Alma 34:32–34") ----
   We only store the combined text per reference, not a per-verse
   breakdown, so verse boundaries are approximated by distributing
   sentences evenly across the verse range. Good enough to give a
   visual sense of where each verse starts; not scripture-accurate. */
function verseRangeFor(ref){
  const m = (ref||"").match(/(\d+):(\d+)[–-](\d+)$/);
  if(!m) return null;
  const start = parseInt(m[2],10), end = parseInt(m[3],10);
  if(!(end > start)) return null;
  return { start, end, count: end - start + 1 };
}
function verseNumberMarks(text, range){
  const toks = tokenize(text);
  const sentenceStarts = [];
  let wIdx = 0, atStart = true;
  toks.forEach(tok=>{
    if(isWord(tok)){
      if(atStart){ sentenceStarts.push(wIdx); atStart = false; }
      wIdx++;
    } else if(/[.!?]/.test(tok)){
      atStart = true;
    }
  });
  const n = range.count;
  if(sentenceStarts.length < n) return [{wordIdx:0, num:range.start}];
  const base = Math.floor(sentenceStarts.length / n), extra = sentenceStarts.length % n;
  const marks = [];
  let sentIdx = 0;
  for(let i=0; i<n; i++){
    marks.push({ wordIdx: sentenceStarts[sentIdx], num: range.start + i });
    sentIdx += base + (i < extra ? 1 : 0);
  }
  return marks;
}
function verseNumberMap(v){
  const range = verseRangeFor(v.ref);
  if(!range) return null;
  const marks = verseNumberMarks(v.text, range);
  return new Map(marks.map(m=>[m.wordIdx, m.num]));
}
function numberedVerseText(v){
  const map = verseNumberMap(v);
  if(!map) return escHTML(v.text);
  const toks = tokenize(v.text);
  let wIdx = 0, out = "";
  toks.forEach(tok=>{
    if(isWord(tok)){
      if(map.has(wIdx)) out += `<sup class="vnum">${map.get(wIdx)}</sup>`;
      out += escHTML(tok);
      wIdx++;
    } else {
      out += escHTML(tok);
    }
  });
  return out;
}

/* Stems intentionally cover scriptural inflections: remember/remembrance,
   pray/prayer/prayed, bless/blessings, repent/repentance, etc. */
function lexicalRoot(word){
  let w = word.toLowerCase().replace(/[^a-z']/g,"");
  const irregular = {men:"man",women:"woman",children:"child",fathers:"father",brethren:"brother",souls:"soul",chose:"choose",chosen:"choose",kept:"keep",built:"build",thoughts:"thought"};
  if(irregular[w]) return irregular[w];
  const special = [
    [/^remember/,"remember"],[/^prayer|^pray/,"pray"],[/^repent/,"repent"],
    [/^forgiv/,"forgive"],[/^believ/,"believe"],[/^bless/,"bless"],
    [/^command/,"commandment"],[/^scriptur/,"scripture"],[/^covenant/,"covenant"],
    [/^foundat/,"foundation"],[/^redeem/,"redeemer"],[/^salvat/,"salvation"],
    [/^resurrect/,"resurrection"],[/^revelat|^reveal/,"revelation"],
    [/^obedien|^obey/,"obey"],[/^tempt/,"tempt"],[/^destroy/,"destroy"],
    [/^condemn/,"condemn"],[/^exalt/,"exalt"],[/^deliver/,"deliver"],
    [/^strength/,"strength"],[/^serv/,"serve"],[/^endure/,"endure"],
    [/^testif/,"testify"],[/^prophe/,"prophecy"],[/^sanctif/,"sanctify"]
  ];
  for(const [re,root] of special) if(re.test(w)) return root;
  if(w.length>5 && w.endsWith("ing")) w=w.slice(0,-3);
  else if(w.length>4 && w.endsWith("ed")) w=w.slice(0,-2);
  else if(w.length>4 && w.endsWith("es")) w=w.slice(0,-2);
  else if(w.length>3 && w.endsWith("s")) w=w.slice(0,-1);
  return w;
}

const HL_WORD_MAP = (()=>{
  const m=new Map();
  HL_LEXICON.forEach(([role,priority,words])=>words.forEach(word=>{
    const root=lexicalRoot(word);
    const prior=m.get(root);
    if(!prior || priority>prior.priority) m.set(root,{role,priority});
  }));
  return m;
})();

function classifyVerse(text){
  const toks=tokenize(text);
  const words=[];
  let wIdx=0;
  toks.forEach(tok=>{ if(isWord(tok)){ words.push({idx:wIdx,clean:tok.toLowerCase().replace(/[^a-z']/g,""),root:lexicalRoot(tok)}); wIdx++; } });

  const candidates=[];
  words.forEach(w=>{
    const hit=HL_WORD_MAP.get(w.root);
    if(hit) candidates.push({start:w.idx,end:w.idx,role:hit.role,priority:hit.priority,type:"word"});
  });

  const occupiedByPhrase=new Set();
  HL_PHRASES.forEach(p=>{
    for(let i=0;i<=words.length-p.words.length;i++){
      let ok=true;
      for(let j=0;j<p.words.length;j++){
        if(words[i+j].root!==lexicalRoot(p.words[j])){ok=false;break;}
      }
      if(ok){
        const idxs=words.slice(i,i+p.words.length).map(w=>w.idx);
        if(idxs.some(x=>occupiedByPhrase.has(x))) continue;
        idxs.forEach(x=>occupiedByPhrase.add(x));
        candidates.push({start:idxs[0],end:idxs[idxs.length-1],role:p.role,priority:p.priority,type:"phrase"});
      }
    }
  });

  const count=words.length;
  const maxHighlighted=Math.max(2,Math.min(Math.ceil(count*.45), count<12?4:count<28?9:14));
  const selected=new Map();

  /* Phrase spans always receive first consideration. */
  candidates.filter(c=>c.type==="phrase").sort((a,b)=>b.priority-a.priority || (b.end-b.start)-(a.end-a.start)).forEach(c=>{
    for(let i=c.start;i<=c.end;i++) selected.set(i,{role:c.role,priority:c.priority,type:"phrase"});
  });

  /* Preserve repeated structural anchors, especially remember/foundation. */
  const repeats=new Map();
  words.forEach(w=>repeats.set(w.root,(repeats.get(w.root)||0)+1));
  candidates.filter(c=>c.type==="word").sort((a,b)=>b.priority-a.priority).forEach(c=>{
    if(selected.has(c.start)) return;
    const root=words.find(w=>w.idx===c.start)?.root;
    const structural=root && ["remember","foundation","rock","pray","ask","choose","serve"].includes(root);
    if(selected.size<maxHighlighted || (structural && repeats.get(root)>1)) selected.set(c.start,{role:c.role,priority:c.priority,type:"word"});
  });

  /* Coverage safeguard: every passage gets at least one meaningful span. */
  if(!selected.size && words.length){
    const stop=new Set(["the","and","of","to","a","in","that","is","it","for","with","on","be","ye","shall","unto","his","he","they","them","this"]);
    const fallback=words.find(w=>!stop.has(w.clean) && w.clean.length>3) || words[0];
    selected.set(fallback.idx,{role:"anchor",priority:55,type:"fallback"});
  }
  return {selected};
}

function renderVerseHTML(text, stage, blanked, marks, smart){
  const toks=tokenize(text);
  let wIdx=0;
  return toks.map(tok=>{
    if(!isWord(tok)) return escHTML(tok);
    const myIdx=wIdx++;
    const safeTok=escHTML(tok);
    const hideThis=blanked.has(myIdx);
    const num=marks&&marks.has(myIdx)?`<sup class="vnum">${marks.get(myIdx)}</sup>`:"";
    let hl="",style="",meta="";
    const hit=smart?.selected?.get(myIdx);
    if(hit){
      const role=HL_ROLES[hit.role];
      hl=" hlc";
      const strength=hit.priority>=95?"0 0 0 1px rgba(30,41,59,.10) inset":"none";
      style=` style="background:${role.color};box-shadow:${strength}"`;
      meta=` data-role="${hit.role}" data-priority="${hit.priority}" title="${role.label}"`;
    }
    if(stage===0) return `${num}<span class="w${hl}" data-i="${myIdx}"${meta}${style}>${safeTok}</span>`;
    if(stage===1||stage===2){
      if(hideThis) return `${num}<span class="w blank" data-i="${myIdx}">${safeTok}</span>`;
      return `${num}<span class="w${hl}" data-i="${myIdx}"${meta}${style}>${safeTok}</span>`;
    }
    if(stage===3){
      const m=tok.match(/^(\w)(\w*)(.*)$/);
      if(!m) return `${num}<span class="w">${safeTok}</span>`;
      const stub=escHTML(m[1]+"…"+m[3]);
      return `${num}<span class="w letter" data-i="${myIdx}" data-full="${safeTok}">${stub}</span>`;
    }
    if(stage===4) return `${num}<span class="w blank" data-i="${myIdx}">${safeTok}</span>`;
    return `${num}<span class="w${hl}" data-i="${myIdx}"${meta}${style}>${safeTok}</span>`;
  }).join("");
}
function pickBlankSet(text, fraction){
  const toks = tokenize(text);
  const wordIdxs = [];
  let wIdx=0;
  toks.forEach(t=>{ if(isWord(t)){ wordIdxs.push(wIdx); wIdx++; } });
  const n = Math.round(wordIdxs.length * fraction);
  const shuffled = wordIdxs.slice().sort(()=>Math.random()-0.5);
  return new Set(shuffled.slice(0,n));
}

/* =========================================================
   PROVE IT — order-recall puzzle. Break the verse into
   clickable sections and rebuild it in the correct order.
   ========================================================= */
let proveState = null;
function chunkVerse(text){
  const clean = String(text||"").replace(/\s+/g," ").trim();
  if(!clean) return [];
  const words = clean.split(" ");
  const N = words.length;
  // Scale piece count with verse length: short verses still get ~5
  // pieces (2-3 words each), long passages never exceed 20 pieces.
  const target = Math.max(5, Math.min(20, Math.round(N/8)));
  const size = Math.max(2, Math.ceil(N/target));
  const chunks = [];
  let start = 0;
  while(start < N){
    const remain = N - start;
    if(remain <= size+1){ chunks.push(words.slice(start).join(" ")); break; }
    // Prefer a natural punctuation break near the target size.
    let chosen = -1;
    const lo = start + Math.max(1, size-2);
    const hi = Math.min(start + size, N-1);
    for(let i=hi; i>=lo; i--){
      if(/[,:;.!?]$/.test(words[i])){ chosen=i+1; break; }
    }
    if(chosen < 0) chosen = start + size;
    // Do not leave a one-word final fragment.
    if(N-chosen>0 && N-chosen<2) chosen = N;
    chunks.push(words.slice(start,chosen).join(" "));
    start = chosen;
  }
  // Guarantee the bounds: split the longest piece while under-count…
  const minPieces = Math.min(5, Math.floor(N/2));
  while(chunks.length < minPieces){
    let li = 0;
    chunks.forEach((c,i)=>{ if(c.split(" ").length > chunks[li].split(" ").length) li = i; });
    const w = chunks[li].split(" ");
    if(w.length < 4) break;
    const mid = Math.ceil(w.length/2);
    chunks.splice(li, 1, w.slice(0,mid).join(" "), w.slice(mid).join(" "));
  }
  // …and merge the shortest neighbors while over-count.
  while(chunks.length > 20){
    let si = 0;
    chunks.forEach((c,i)=>{ if(c.split(" ").length < chunks[si].split(" ").length) si = i; });
    const j = (si===0 || (si<chunks.length-1 && chunks[si+1].length < chunks[si-1].length)) ? si : si-1;
    chunks.splice(j, 2, chunks[j] + " " + chunks[j+1]);
  }
  return chunks;
}
function openProveIt(v){
  const chunks = chunkVerse(v.text);
  if(chunks.length < 2){ showToast("This verse is too short for Prove It."); return; }
  proveState = { v, chunks, builtIndex:0, misses:0, feedback:"", locked:false };
  renderProveIt();
}
function closeProveIt(){
  const el = document.getElementById("proveIt");
  el.classList.remove("show");
  el.innerHTML = "";
  proveState = null;
  document.removeEventListener("keydown",proveKeyHandler);
}
function proveKeyHandler(e){
  if(!proveState || proveState.locked) return;
  const n=Number(e.key);
  if(n>=1 && n<=3){
    const btn=document.querySelector(`#proveIt .prove-opt[data-key="${n}"]`);
    if(btn) btn.click();
  }
}
function proveReaderHTML(chunks,builtIndex){
  const complete=chunks.slice(0,builtIndex).join(" ");
  const upcoming=chunks.slice(builtIndex).join(" ");
  return `${complete?`<span class="prove-complete">${complete}</span> `:""}<span class="prove-cursor" id="proveCursor" aria-label="next phrase"></span>${upcoming?` <span class="prove-upcoming">${upcoming}</span>`:""}`;
}
function renderProveIt(){
  const el = document.getElementById("proveIt");
  const {v,chunks,builtIndex}=proveState;
  const done=builtIndex>=chunks.length;
  const pct=Math.round((builtIndex/chunks.length)*100);
  let options=[];
  if(!done){
    const correct=chunks[builtIndex];
    const pool=chunks.filter((c,i)=>i!==builtIndex && c!==correct);
    const distractors=shuffleArr(pool).slice(0,2);
    options=shuffleArr([correct,...distractors]);
  }
  el.innerHTML=`
    <div class="cer-backdrop" id="proveItBackdrop"></div>
    <div class="relic-pop-stage">
      <div class="cer-stage prove-stage" role="dialog" aria-modal="true" aria-label="Prove It ${v.ref}">
        <button class="rp-close" id="proveItClose" aria-label="Close">✕</button>
        <div class="prove-head">
          <div class="cer-kicker">🧩 Prove It</div>
          <div class="prove-title-row"><div class="prove-ref">${v.ref}</div><div class="prove-step">${builtIndex} of ${chunks.length}</div></div>
          <div class="prove-progress" style="--pct:${pct}%"><i></i></div>
        </div>
        ${done?`
          <div class="prove-instruction">Complete scripture rebuilt in order</div>
          <div class="prove-finish">
            <div><div class="prove-finish-glyph">✦</div><div class="cer-name">Proven!</div><div class="cer-motto">You followed the scripture from beginning to end.</div></div>
            <div class="prove-finish-text">${v.text}</div>
            <button class="btn primary cer-btn show" id="proveClose">Claim victory ▸</button>
          </div>
          <div></div>
        `:`
          <div class="prove-instruction"><span>Read what you have built.</span><strong> Choose the phrase that follows.</strong></div>
          <div class="prove-reader-wrap"><div class="prove-reader" id="proveReader">${proveReaderHTML(chunks,builtIndex)}</div></div>
          <div class="prove-action">
            <div class="prove-prompt">What comes next?</div>
            <div class="prove-options">
              ${options.map((o,i)=>`<button class="btn prove-opt" data-key="${i+1}" data-opt="${encodeURIComponent(o)}">${o}</button>`).join("")}
            </div>
            <div class="prove-feedback" id="proveFeedback">${proveState.feedback||""}</div>
            <div class="prove-tools">
              <button class="prove-tool" id="proveUndo" ${builtIndex===0?"disabled":""}>↶ Undo last</button>
              <button class="prove-tool" id="proveSkip">Finish later</button>
            </div>
          </div>
        `}
      </div>
    </div>`;
  el.classList.add("show");
  document.getElementById("proveItClose").onclick=closeProveIt;
  document.getElementById("proveItBackdrop").onclick=closeProveIt;
  document.removeEventListener("keydown",proveKeyHandler);
  document.addEventListener("keydown",proveKeyHandler);
  if(!done){
    requestAnimationFrame(()=>{
      const reader=document.getElementById("proveReader");
      const cursor=document.getElementById("proveCursor");
      if(reader&&cursor) reader.scrollTop=Math.max(0,cursor.offsetTop-reader.clientHeight*.42);
    });
    el.querySelectorAll(".prove-opt").forEach(btn=>{
      btn.onclick=()=>{
        if(proveState.locked) return;
        const val=decodeURIComponent(btn.dataset.opt);
        if(val===chunks[proveState.builtIndex]){
          proveState.locked=true; btn.classList.add("correct"); SFX.pick();
          const opts=el.querySelector(".prove-options");
          if(opts) opts.classList.add("resolving");
          el.querySelectorAll(".prove-opt").forEach(b=>b.disabled=true);
          state.xp+=3; saveState();
          setTimeout(()=>{ proveState.builtIndex++; proveState.feedback=""; proveState.locked=false; renderProveIt(); },95);
        }else{
          proveState.misses++; proveState.feedback=proveState.misses===1?"Not quite. Follow the meaning and rhythm of the sentence.":"Look at the final words you completed, then test which option connects naturally.";
          SFX.wrong(); btn.classList.add("wrong");
          const fb=document.getElementById("proveFeedback"); if(fb) fb.textContent=proveState.feedback;
          setTimeout(()=>btn.classList.remove("wrong"),420);
        }
      };
    });
    document.getElementById("proveUndo").onclick=()=>{ if(proveState.builtIndex>0){proveState.builtIndex--;proveState.feedback="Previous phrase removed.";renderProveIt();} };
    document.getElementById("proveSkip").onclick=closeProveIt;
  }else{
    state.xp+=15; touchStreak();
    const p=state.progress[v.id];
    if(!p.provenIt){p.provenIt=true;showToast(`🧩 <strong>${v.ref}</strong> proven! Its relic now glows on the shelf.`);}
    saveState(); SFX.fanfare(); FX.rain({count:70});
    document.getElementById("proveClose").onclick=closeProveIt;
  }
}

window.__achvReady = true;
checkAchievements(); // one load-time sweep so long-time climbers get credit
render();

/* =========================================================
   Username-system bridge (usernames.html)
   - New visitor (no climber, no save, hasn't chosen guest):
     welcome gate → create a username or continue as guest.
   - Guest with progress: floating "Save your progress" pill →
     usernames.html?claim=1 (creates a profile and adopts the
     guest save under it).
   ========================================================= */
(function(){
  const USERNAMES_URL = "usernames.html";
  if(CLIMBER) return; // signed in — nothing to do
  const hasGuestSave = HAD_SAVE_AT_BOOT;
  const guestOk = localStorage.getItem("sq_guestOk") === "1";

  if(!hasGuestSave && !guestOk){
    const gate = document.createElement("div");
    gate.id = "userGate";
    gate.innerHTML = `
      <style>
        #userGate{position:fixed; inset:0; z-index:400; background:rgba(10,7,24,.88);
          backdrop-filter:blur(6px); display:flex; align-items:center; justify-content:center; padding:20px;}
        #userGate .gcard{max-width:420px; width:100%; background:linear-gradient(180deg,#2c2352,#221a3e);
          border:1px solid #3a2f66; border-radius:20px; padding:26px 22px; text-align:center;
          box-shadow:0 20px 60px rgba(0,0,0,.5); color:#f3eeff; font-family:inherit;}
        #userGate h2{margin:0 0 6px; font-size:20px; color:#ffdf8e;}
        #userGate p{margin:0 0 18px; font-size:13.5px; color:#a89cc8; line-height:1.5;}
        #userGate .gbtn{display:block; width:100%; border:none; border-radius:14px; padding:14px;
          font-size:15px; font-weight:800; cursor:pointer; margin:8px 0;
          background:linear-gradient(180deg,#ffdf8e,#f5c04a); color:#3a2a00;}
        #userGate .gbtn.ghost{background:none; border:1px solid #3a2f66; color:#a89cc8; font-weight:600;}
      </style>
      <div class="gcard">
        <h2>⚔️ Welcome, climber!</h2>
        <p>Pick a scripture-hero username so your climb is saved under your own name — or just start exploring.</p>
        <button class="gbtn" id="gateCreate">✨ Choose my scripture username</button>
        <button class="gbtn ghost" id="gateGuest">Continue as guest</button>
      </div>`;
    document.body.appendChild(gate);
    document.getElementById("gateCreate").onclick = ()=>{ location.href = USERNAMES_URL; };
    document.getElementById("gateGuest").onclick = ()=>{
      localStorage.setItem("sq_guestOk","1");
      gate.remove();
      addSavePill();
    };
    return;
  }
  addSavePill();

  function addSavePill(){
    const pill = document.createElement("div");
    pill.id = "savePill";
    pill.innerHTML = `
      <style>
        #savePill{position:fixed; right:12px; bottom:calc(96px + env(safe-area-inset-bottom,0px));
          z-index:120; background:linear-gradient(180deg,#ffdf8e,#f5c04a); color:#3a2a00;
          font:700 12.5px -apple-system,"Segoe UI",Roboto,sans-serif; padding:10px 14px;
          border-radius:999px; cursor:pointer; box-shadow:0 8px 24px rgba(0,0,0,.4);}
        @media(min-width:641px){ #savePill{bottom:18px;} }
      </style>
      💾 Save your progress`;
    pill.onclick = ()=>{ location.href = USERNAMES_URL + "?claim=1"; };
    document.body.appendChild(pill);
  }
})();
</script>
