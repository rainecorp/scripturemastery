  .rp-text sup.vnum{font-size:.6em; font-weight:900; color:#fde68a; margin-right:1px; opacity:.85;}
  .rp-btns{display:flex; flex-direction:column; gap:9px; margin-top:14px;}
  .rp-btns .btn{width:100%;}
  .rp-link{color:#a78bfa; font-size:12.5px; font-weight:800; text-decoration:none;}
  .rp-link:hover{text-decoration:underline;}

  /* =========================================================
     PROVE IT V2 — focused, no-page-scroll scripture builder
     ========================================================= */
  .prove-stage{
    position:relative;
    width:min(760px,calc(100vw - 24px));
    height:min(760px,calc(100dvh - 24px));
    max-height:none;
    overflow:hidden;
    margin:0 auto;
    padding:0;
    display:grid;
    grid-template-rows:auto auto minmax(0,1fr) auto;
    color:#fff;
    background:
      radial-gradient(circle at 50% -20%,rgba(34,211,238,.18),transparent 45%),
      linear-gradient(160deg,rgba(24,16,48,.99),rgba(8,6,22,.995));
    border:1px solid rgba(167,139,250,.48);
    border-radius:24px;
    box-shadow:0 22px 58px rgba(0,5,20,.62),0 0 0 1px rgba(255,255,255,.04) inset;
  }
  .prove-head{
    position:relative;
    padding:20px 58px 13px 20px;
    border-bottom:1px solid rgba(255,255,255,.1);
    background:rgba(255,255,255,.035);
  }
  .prove-head .cer-kicker{margin:0;color:#fde68a;}
  .prove-title-row{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-top:5px;}
  .prove-ref{font-family:"Cinzel",Georgia,serif;font-size:clamp(20px,5vw,28px);font-weight:800;line-height:1.1;}
  .prove-step{flex-shrink:0;color:#cabffa;font-size:11px;font-weight:950;letter-spacing:.06em;text-transform:uppercase;}
  .prove-progress{height:7px;margin:12px 0 0;border-radius:999px;overflow:hidden;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.08);}
  .prove-progress i{display:block;height:100%;width:var(--pct,0%);border-radius:inherit;background:linear-gradient(90deg,#22d3ee,#a78bfa 58%,#fbbf24);box-shadow:0 0 12px rgba(34,211,238,.5);transition:width .35s ease;}
  .prove-instruction{
    display:flex;align-items:center;justify-content:center;gap:8px;
    min-height:42px;padding:8px 18px;text-align:center;
    color:#c7d2e6;background:rgba(7,13,31,.45);
    border-bottom:1px solid rgba(255,255,255,.08);
    font-size:12px;font-weight:850;line-height:1.35;
  }
  .prove-reader-wrap{min-height:0;padding:14px 16px 10px;display:flex;}
  .prove-reader{
    position:relative;flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;
    padding:clamp(18px,4vw,28px);
    border-radius:18px;
    color:#f8f5ff;background:linear-gradient(180deg,rgba(255,255,255,.075),rgba(255,255,255,.04));
    border:1px solid rgba(255,255,255,.12);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.06);
    font-family:Georgia,"Times New Roman",serif;
    font-size:clamp(18px,3.8vw,25px);line-height:1.72;text-align:left;
    scrollbar-width:thin;scrollbar-color:rgba(167,139,250,.6) transparent;
  }
  .prove-reader::-webkit-scrollbar{width:7px}.prove-reader::-webkit-scrollbar-thumb{background:rgba(167,139,250,.55);border-radius:999px;}
  .prove-complete{color:#fff;}
  .prove-current{
    display:inline;border-radius:6px;padding:.06em .13em;
    background:rgba(244,185,66,.19);box-shadow:0 0 0 1px rgba(244,185,66,.34);
    box-decoration-break:clone;-webkit-box-decoration-break:clone;
  }
  .prove-cursor{
    display:inline-block;width:.68em;height:1.15em;margin:0 .15em -.18em;
    border-radius:4px;background:linear-gradient(180deg,#fde68a,#f59e0b);
    box-shadow:0 0 12px rgba(251,191,36,.75);
    animation:proveCursor 1.1s ease-in-out infinite;
  }
  @keyframes proveCursor{0%,100%{opacity:.45;transform:scaleY(.82)}50%{opacity:1;transform:scaleY(1)}}
  .prove-upcoming{color:rgba(199,210,230,.20);filter:blur(3.5px);user-select:none;}
  .prove-empty{color:#9c93c9;font-style:italic;}
  .prove-action{
    padding:12px 16px calc(14px + env(safe-area-inset-bottom,0px));
    border-top:1px solid rgba(255,255,255,.1);
    background:linear-gradient(180deg,rgba(12,9,29,.94),rgba(8,6,22,.99));
    box-shadow:0 -12px 30px rgba(0,0,0,.18);
  }
  .prove-prompt{margin:0 0 9px;text-align:center;color:#fde68a;font-size:11px;font-weight:950;letter-spacing:.1em;text-transform:uppercase;}
  .prove-options{display:grid;grid-template-columns:1fr;gap:8px;width:100%;max-width:680px;margin:0 auto;}
  .prove-opt{
    position:relative;width:100%;min-height:48px;padding:11px 13px 11px 48px!important;
    white-space:normal;text-align:left;line-height:1.34!important;
    color:#f7f4ff!important;background:rgba(255,255,255,.075)!important;
    border:1.5px solid rgba(167,139,250,.28)!important;box-shadow:none!important;
    font-family:Georgia,"Times New Roman",serif!important;font-size:clamp(14px,2.8vw,17px)!important;font-weight:700!important;
  }
  .prove-opt::before{
    content:attr(data-key);position:absolute;left:12px;top:50%;transform:translateY(-50%);
    width:25px;height:25px;display:grid;place-items:center;border-radius:8px;
    color:#d8d1ff;background:rgba(167,139,250,.16);border:1px solid rgba(167,139,250,.34);
    font-family:var(--font);font-size:11px;font-weight:950;
  }
  .prove-opt:hover{transform:translateY(-1px);border-color:rgba(34,211,238,.72)!important;background:rgba(34,211,238,.11)!important;}
  .prove-opt.correct{border-color:#34d399!important;background:rgba(52,211,153,.16)!important;}
  .prove-opt.wrong{animation:cerShake .35s ease-in-out;border-color:#f87171!important;background:rgba(248,113,113,.14)!important;}
  .prove-options.resolving{pointer-events:none; opacity:.52; transform:translateY(2px); transition:opacity .1s ease, transform .1s ease;}
  .prove-options.resolving .prove-opt:not(.correct){opacity:.42;}
  .prove-tools{display:flex;justify-content:center;gap:12px;margin-top:9px;}
  .prove-tool{appearance:none;border:0;background:transparent;color:#9c93c9;font:850 11px var(--font);cursor:pointer;padding:5px 7px;}
  .prove-tool:hover{color:#fff}.prove-tool:disabled{opacity:.3;cursor:default;}
  .prove-feedback{min-height:18px;margin-top:5px;text-align:center;color:#fca5a5;font-size:11px;font-weight:850;}
  .prove-finish{display:grid;place-items:center;text-align:center;min-height:0;padding:22px;overflow-y:auto;}
  .prove-finish-glyph{font-size:56px;filter:drop-shadow(0 0 18px rgba(251,191,36,.5));animation:glyphFloat 2.5s ease-in-out infinite;}
  .prove-finish .cer-name{margin-top:6px;}
  .prove-finish-text{max-width:540px;margin:12px auto 18px;padding:16px;border-radius:16px;text-align:left;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);font-family:Georgia,"Times New Roman",serif;font-size:15px;line-height:1.58;color:#f2eefc;}
  @media (min-width:680px){.prove-options{grid-template-columns:repeat(3,1fr)}.prove-opt{padding:13px 12px 13px 42px!important;}}
  @media (max-width:520px){
    .relic-pop-stage{padding:6px;}
    .prove-stage{width:calc(100vw - 12px);height:calc(100dvh - 12px);border-radius:20px;}
    .prove-head{padding:15px 50px 10px 14px;}
    .prove-reader-wrap{padding:9px 9px 7px;}
    .prove-reader{padding:16px;font-size:18px;line-height:1.62;}
    .prove-action{padding:9px 9px calc(10px + env(safe-area-inset-bottom,0px));}
    .prove-opt{min-height:44px;padding-top:9px!important;padding-bottom:9px!important;}
  }
  /* =========================================================
     RELIC SHELF — the trophy room
     ========================================================= */
  .shelf-head{
    margin:0 0 14px; padding:22px 18px; border-radius:24px; text-align:center; color:#fff;
    background:
      radial-gradient(circle at 50% -30%, rgba(244,185,66,.28), transparent 55%),
      linear-gradient(160deg, rgba(46,29,14,.98), rgba(22,13,5,.99));
    border:1px solid rgba(244,185,66,.38);
    box-shadow:0 14px 34px rgba(0,5,20,.4);
  }
  .shelf-head h2{margin:0 0 8px; font-family:"Cinzel",Georgia,serif; font-size:clamp(20px,5.5vw,28px); font-weight:800;}
  .shelf-head p{margin:0 auto 12px; max-width:470px; color:#e6d3b3; font-size:13px; font-weight:700; line-height:1.5;}
  .shelf-count{
    display:inline-block; padding:5px 16px; border-radius:999px;
    background:rgba(244,185,66,.16); border:1px solid rgba(244,185,66,.5);
    color:#fde68a; font-size:12px; font-weight:900;
  }
  .shelf-room{
    margin:0 0 16px; padding:16px 12px 8px; border-radius:24px;
    background:
      radial-gradient(circle at 50% 0%, rgba(255,205,110,.08), transparent 55%),
      linear-gradient(160deg, #3a2712, #241608 60%, #180e04);
    border:1px solid rgba(130,88,44,.6);
    box-shadow:inset 0 0 70px rgba(0,0,0,.5), 0 14px 34px rgba(0,5,20,.35);
  }
  .shelf-room h3{
    margin:2px 6px 12px; display:flex; justify-content:space-between; align-items:baseline; gap:8px;
    color:#fde68a; font-family:"Cinzel",Georgia,serif; font-size:15px; font-weight:800;
  }
  .shelf-room h3 .sr-count{font-family:inherit; font-size:11px; color:#d8b98a; font-weight:800; white-space:nowrap;}
  .shelf-grid{display:grid; grid-template-columns:repeat(5,1fr); gap:28px 16px;}
  .shelf-slot{
    position:relative; padding:12px 4px 14px; text-align:center; cursor:pointer;
    border-radius:12px; transition:transform .2s ease, background .2s ease;
  }
  .shelf-slot:hover{transform:translateY(-3px); background:rgba(255,220,150,.07);}
  .shelf-slot::after{
    content:""; position:absolute; left:2px; right:2px; bottom:0; height:8px; border-radius:3px;
    background:linear-gradient(180deg,#7a5122,#4a2d10);
    box-shadow:0 3px 6px rgba(0,0,0,.55), inset 0 1px 0 rgba(255,220,160,.25);
  }
  .shelf-slot .relic{margin:0 auto 7px;}
  .shelf-slot.dark .relic{filter:saturate(.35) brightness(.7);}
  .ss-num{position:absolute; top:3px; left:7px; font-size:10px; font-weight:950; color:#a5824f;}
  .ss-ref{font-size:10.5px; font-weight:900; color:#e8d5b5; line-height:1.25;}
  .shelf-slot.dark .ss-ref{color:#8a7350;}
  .ss-floor{
    margin-top:4px; display:flex; align-items:center; justify-content:center; gap:4px;
    font-size:9.5px; font-weight:900; color:#fbbf24;
  }
  .ss-floor .chest-img{width:15px; height:15px;}
  .ss-shards{margin-top:4px; font-size:9.5px; font-weight:900; color:#8d744c;}

  .shelf-strip{display:flex; gap:10px; flex-wrap:wrap; align-items:center; margin-bottom:6px;}
  .shelf-strip-item{cursor:pointer; transition:transform .15s ease;}
  .shelf-strip-item:hover{transform:translateY(-3px);}

  /* =========================================================
     TOWER PAGE — two columns: chests left, tall tower right
     ========================================================= */
  .tower-cols{display:grid; grid-template-columns:minmax(0,1fr) clamp(280px,42%,430px); gap:14px; align-items:start;}
  .tower-col-side{position:sticky; top:12px;}
  .tower-col-side .tower-visual{margin:0;}
  .tower-col-side .tv-viewport{height:min(78vh,800px);}
  @media (max-width:760px){
    .tower-cols{display:flex; flex-direction:column; align-items:stretch;}
    .tower-col-side{position:static; order:-1; margin-bottom:2px;}
    .tower-col-side .tv-viewport{height:440px;}
  }

  .tv-nav{position:absolute; right:10px; top:50%; transform:translateY(-50%); z-index:8; display:flex; flex-direction:column; gap:8px;}
  .tv-nav-btn{
    width:44px; height:44px; border-radius:14px; cursor:pointer;
    border:1px solid rgba(255,255,255,.28); background:rgba(7,13,31,.78);
    color:#fde68a; font-size:16px; font-weight:900; line-height:1;
    box-shadow:0 6px 16px rgba(0,5,20,.45);
    transition:transform .12s ease, background .15s ease, box-shadow .15s ease;
    backdrop-filter:blur(4px);
  }
  .tv-nav-btn:hover{background:rgba(22,38,66,.92); transform:scale(1.08); box-shadow:0 8px 20px rgba(0,5,20,.55), 0 0 14px rgba(255,215,124,.25);}
  .tv-nav-btn:active{transform:scale(.94);}

  .tv-floorinfo{
    position:absolute; z-index:6; left:50%; bottom:12px; transform:translateX(-50%);
    min-width:190px; max-width:86%; padding:9px 18px; border-radius:14px; text-align:center;
    background:rgba(7,13,31,.84); border:1px solid rgba(244,185,66,.5); color:#fff;
    opacity:0; transition:opacity .3s ease; pointer-events:none; backdrop-filter:blur(4px);
  }
  .tv-floorinfo.show{opacity:1;}
  .tv-floorinfo strong{display:block; font-family:"Cinzel",Georgia,serif; font-size:15px; line-height:1.2;}
  .tv-floorinfo span{display:block; margin-top:2px; font-size:11px; font-weight:800; color:#cdddff;}
  .tv-floorinfo.pop{animation:infoPop .35s cubic-bezier(.2,.9,.3,1.3);}
  @keyframes infoPop{0%{transform:translateX(-50%) scale(.82);}100%{transform:translateX(-50%) scale(1);}}

  /* =========================================================
     TODAY — continue-the-climb card + trial tease
     ========================================================= */
  .climb-now{display:flex; gap:14px; align-items:center; margin-bottom:12px;}
  .cn-tower{flex-shrink:0; width:66px; height:120px; display:flex; align-items:flex-end; overflow:hidden; border-radius:10px;}
  .cn-tower img{
    width:100%; height:100%; object-fit:cover; object-position:bottom center;
    filter:drop-shadow(0 6px 14px rgba(0,5,20,.35));
    -webkit-mask-image:linear-gradient(to bottom, transparent 0, #000 20px);
    mask-image:linear-gradient(to bottom, transparent 0, #000 20px);
  }
  .cn-tower.full{height:160px;}
  .cn-tower.full img{
    height:auto; max-height:160px; object-fit:contain;
    -webkit-mask-image:none; mask-image:none;
  }
  .cn-info{flex:1; min-width:0;}
  .cn-name{font-family:"Cinzel",Georgia,serif; font-weight:800; font-size:18.5px; color:var(--ink);}
  .cn-floor{font-size:11.5px; font-weight:900; color:var(--muted); margin:3px 0 7px;}
  .cn-current{margin-top:9px; font-size:12px; font-weight:700; color:var(--muted); line-height:1.4;}
  .cn-current strong{color:var(--ink);}
  .climb-card > .btn.primary{margin-top:2px;}
  .cn-or{margin:13px 0 0; text-align:center; font-size:10.5px; font-weight:950; letter-spacing:.1em; text-transform:uppercase; color:var(--muted);}
  .tt-row{display:flex; gap:12px; align-items:center; margin-bottom:12px;}
  .tt-glyph{
    width:54px; height:54px; flex-shrink:0; display:grid; place-items:center; font-size:26px; border-radius:16px;
    background:linear-gradient(160deg, rgba(24,16,48,.98), rgba(8,6,22,.99));
    border:1px solid rgba(167,139,250,.5); box-shadow:0 6px 16px rgba(24,16,48,.35);
    animation:glyphFloat 3s ease-in-out infinite;
  }
  .tt-title{font-weight:900; font-size:14px; color:var(--ink);}
  .tt-sub{margin-top:2px; font-size:11.5px; font-weight:800; color:var(--muted);}

  /* =========================================================
     TRIAL GROUNDS
     ========================================================= */
  .trial-hall{
    padding:34px 20px 30px; border-radius:24px; text-align:center; color:#fff;
    background:
      radial-gradient(circle at 50% -20%, rgba(167,139,250,.32), transparent 55%),
      linear-gradient(160deg, rgba(24,16,48,.98), rgba(8,6,22,.99));
    border:1px solid rgba(167,139,250,.4); box-shadow:0 14px 34px rgba(0,5,20,.4);
  }
  .th-glyph{font-size:46px; animation:glyphFloat 3s ease-in-out infinite;}
  @keyframes glyphFloat{0%,100%{transform:translateY(0) rotate(-4deg);}50%{transform:translateY(-8px) rotate(4deg);}}
  .trial-hall h2{margin:8px 0 10px; font-family:"Cinzel",Georgia,serif; font-size:clamp(22px,6vw,30px); font-weight:800;}
  .trial-hall p{margin:0 auto 14px; max-width:450px; color:#cabffa; font-size:13.5px; font-weight:700; line-height:1.55;}
  .trial-badges{display:flex; gap:8px; justify-content:center; flex-wrap:wrap; margin-bottom:18px;}
  .trial-start{max-width:300px; margin:0 auto;}
  .trial-arena{
    position:relative; padding:18px 14px 22px; border-radius:24px; color:#fff;
    background:linear-gradient(160deg, rgba(24,16,48,.98), rgba(8,6,22,.99));
    border:1px solid rgba(167,139,250,.4); box-shadow:0 14px 34px rgba(0,5,20,.4);
  }
  .trial-arena.shake{animation:arenaShake .5s ease;}
  @keyframes arenaShake{0%,100%{transform:translateX(0);}20%{transform:translateX(-9px);}40%{transform:translateX(8px);}60%{transform:translateX(-5px);}80%{transform:translateX(3px);}}
  .ta-top{display:flex; justify-content:space-between; align-items:center; gap:8px; margin-bottom:12px; padding:0 4px;}
  .ta-quit{
    flex-shrink:0; width:26px; height:26px; display:flex; align-items:center; justify-content:center;
    background:rgba(255,255,255,.07); border:1px solid rgba(255,255,255,.16); border-radius:50%;
    color:#9c93c9; font-size:12px; font-weight:900; cursor:pointer; padding:0;
  }
  .ta-quit:hover{background:rgba(248,113,113,.18); border-color:rgba(248,113,113,.5); color:#fca5a5;}
  .ta-pips{display:flex; gap:6px;}
  .ta-pip{width:28px; height:9px; border-radius:999px; background:rgba(255,255,255,.14); transition:background .3s;}
  .ta-pip.now{background:linear-gradient(90deg,#a78bfa,#60a5fa); box-shadow:0 0 10px rgba(167,139,250,.7); animation:pipPulse 1.2s ease-in-out infinite;}
  @keyframes pipPulse{0%,100%{opacity:1;}50%{opacity:.5;}}
  .ta-pip.hit{background:linear-gradient(90deg,#34d399,#10b981); box-shadow:0 0 8px rgba(52,211,153,.5);}
  .ta-pip.miss{background:linear-gradient(90deg,#f87171,#ef4444);}
  .ta-combo{font-size:13px; font-weight:950; color:#8b83b8; transition:color .2s, transform .2s, text-shadow .2s;}
  .ta-combo.hot{color:#fbbf24; transform:scale(1.15); text-shadow:0 0 14px rgba(251,191,36,.65);}
  .tq-card{
    padding:22px 16px; border-radius:18px; text-align:center; margin-bottom:14px;
    background:rgba(255,255,255,.06); border:1px solid rgba(255,255,255,.14);
  }
  .tq-kicker{font-size:10.5px; font-weight:950; letter-spacing:.16em; text-transform:uppercase; color:#a78bfa; margin-bottom:9px;}
  .tq-text{font-family:Georgia,"Times New Roman",serif; font-size:16.5px; line-height:1.55; color:#f2eefc;}
  .tq-ref{font-family:"Cinzel",Georgia,serif; font-size:25px; font-weight:800;}
  .tq-theme{margin-top:5px; font-size:12.5px; font-weight:800; color:#cabffa;}
  .ta-opts{display:grid; gap:10px;}
  .t-opt{
    position:relative; appearance:none; width:100%; text-align:left; padding:13px 16px;
    border-radius:16px; cursor:pointer; color:#fff; font-family:var(--font);
    background:rgba(255,255,255,.07); border:1px solid rgba(255,255,255,.16);
    transition:transform .15s ease, background .15s ease, border-color .15s ease;
  }
  .t-opt:not(:disabled):hover{transform:translateY(-2px); background:rgba(167,139,250,.18); border-color:rgba(167,139,250,.6);}
  .t-opt:disabled{cursor:default;}
  .to-ref{display:block; font-family:"Cinzel",Georgia,serif; font-size:15px; font-weight:800;}
  .to-theme{display:block; margin-top:2px; font-size:11px; font-weight:800; color:#b9aef2;}
  .to-text{display:block; font-family:Georgia,"Times New Roman",serif; font-size:13.5px; line-height:1.5; color:#f2eefc;}
  .t-opt.correct{background:rgba(52,211,153,.2); border-color:#34d399; box-shadow:0 0 22px rgba(52,211,153,.4); animation:optPop .45s cubic-bezier(.2,.9,.3,1.4);}
  @keyframes optPop{0%{transform:scale(1);}45%{transform:scale(1.04);}100%{transform:scale(1);}}
  .t-opt.wrong{background:rgba(248,113,113,.16); border-color:#f87171; opacity:.85;}
  .ta-foot{margin-top:12px; text-align:center; font-size:11px; font-weight:900; color:#8b83b8;}
  .ta-fly{
    position:absolute; right:12px; top:-10px; pointer-events:none;
    color:#fbbf24; font-weight:950; font-size:15px; text-shadow:0 0 12px rgba(251,191,36,.7);
    animation:flyUp 1s ease-out forwards;
  }
  @keyframes flyUp{0%{opacity:0; transform:translateY(6px) scale(.7);}25%{opacity:1; transform:translateY(-4px) scale(1.15);}100%{opacity:0; transform:translateY(-32px) scale(1);}}
  .tr-stars{font-size:0; margin-bottom:4px;}
  .tr-star{display:inline-block; font-size:46px; color:rgba(255,255,255,.16); margin:0 7px; transform:scale(.8);}
  .tr-star.lit{color:#fbbf24; text-shadow:0 0 24px rgba(251,191,36,.85); animation:starIn .6s cubic-bezier(.2,.9,.3,1.5) both;}
  @keyframes starIn{0%{opacity:0; transform:scale(.2) rotate(-30deg);}100%{opacity:1; transform:scale(1) rotate(0);}}
  .tr-xp{
    display:inline-block; margin:4px 0 16px; padding:7px 20px; border-radius:999px;
    background:rgba(251,191,36,.15); border:1px solid rgba(251,191,36,.55);
    color:#fde68a; font-weight:950; font-size:14px;
  }
  .tr-resealed{margin:0 auto 18px; max-width:340px; padding:12px 14px; border-radius:16px; background:rgba(255,255,255,.06); border:1px solid rgba(255,255,255,.14); text-align:left;}
  .trr-title{font-size:11px; font-weight:950; letter-spacing:.1em; text-transform:uppercase; color:#fbbf24; margin-bottom:8px; text-align:center;}
  .trr-item{display:flex; align-items:center; gap:10px; padding:5px 0; font-weight:800; font-size:13px;}
  .tr-btns{display:flex; gap:10px; justify-content:center; flex-wrap:wrap;}
  .tr-btns .btn{max-width:220px;}

  /* =========================================================
     ARENA SETUP — filters, difficulty, challenge formats
     ========================================================= */
  .arena-setup{max-width:none; margin:0 auto;}
  .arena-setup > p, .arena-setup .arena-rank{max-width:450px; margin-left:auto; margin-right:auto;}
  .arena-stats{display:flex; gap:8px; justify-content:center; flex-wrap:wrap; margin-bottom:16px;}
  .arena-card, .af-active-line, .arena-badges, .af-steps{max-width:640px; margin-left:auto; margin-right:auto;}
  .arena-formats{max-width:none;}
  .af-section{margin-bottom:18px; text-align:left;}
  .af-title{font-size:11px; font-weight:950; letter-spacing:.12em; text-transform:uppercase; color:#a78bfa; margin-bottom:8px;}
  .af-row{display:flex; flex-wrap:wrap; gap:7px;}
  .af-chip{
    appearance:none; border:1px solid rgba(255,255,255,.16); border-radius:999px;
    background:rgba(255,255,255,.05); color:#cabffa;
    padding:7px 13px; font-family:var(--font); font-size:12px; font-weight:900;
    cursor:pointer; transition:transform .08s, background .15s, border-color .15s;
  }
  .af-chip.active{color:#3a2205; border-color:#facc15; background:linear-gradient(180deg,#fef3c7,#fbbf24); box-shadow:0 0 14px rgba(251,191,36,.4);}
  .af-chip:active{transform:translateY(1px);}
  .af-active-line{
    margin-bottom:16px; padding:9px 12px; border-radius:14px; text-align:left;
    background:rgba(255,255,255,.05); border:1px solid rgba(255,255,255,.1);
    color:#b9aef2; font-size:11.5px; font-weight:800; line-height:1.5;
  }
  .arena-formats{display:grid; gap:14px; margin-top:6px;}
  @media (min-width:760px){
    .arena-formats{grid-template-columns:1fr 1fr; align-items:start;}
  }
  .arena-card{
    padding:16px; border-radius:18px; text-align:left;
    background:linear-gradient(160deg, rgba(20,16,46,.7), rgba(9,7,22,.85));
    border:1px solid rgba(167,139,250,.28);
  }
  .arena-card h4{margin:0 0 4px; font-family:"Cinzel",Georgia,serif; font-size:16px; font-weight:800; color:#f2eefc;}
  .arena-card p{margin:0 0 10px; font-size:12px; color:#b9aef2; font-weight:700; line-height:1.5;}
  .arena-book-grid{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:6px;}
  .arena-book-card{
    padding:12px; border-radius:14px; text-align:left;
    background:rgba(255,255,255,.04); border:1px solid rgba(255,255,255,.12); cursor:pointer;
    transition:transform .1s, border-color .15s;
  }
  .arena-book-card:hover{transform:translateY(-2px); border-color:rgba(167,139,250,.5);}
  .arena-book-card .abc-name{font-family:"Cinzel",Georgia,serif; font-size:13px; font-weight:800; color:#f2eefc;}
  .arena-book-card .abc-sub{margin-top:2px; font-size:10.5px; font-weight:800; color:#9c93c9;}
  .arena-book-card .abc-areas{display:flex; gap:4px; margin-top:8px;}
  .abc-area-dot{flex:1; height:7px; border-radius:999px; background:rgba(255,255,255,.14);}
  .abc-area-dot.done{background:linear-gradient(90deg,#34d399,#10b981); box-shadow:0 0 6px rgba(52,211,153,.5);}
  .arena-badges{display:flex; gap:8px; flex-wrap:wrap; justify-content:center; margin:14px 0;}
  .arena-badge{
    width:44px; height:44px; border-radius:12px; display:grid; place-items:center; font-size:20px;
    background:rgba(255,255,255,.05); border:1px solid rgba(255,255,255,.12); opacity:.3; filter:grayscale(1);
  }
  .arena-badge.on{opacity:1; filter:none; border-color:rgba(251,191,36,.55); background:rgba(251,191,36,.12); box-shadow:0 0 12px rgba(251,191,36,.35);}
  .arena-badge{cursor:pointer;}
  .arena-badge-wrap{display:flex; flex-direction:column; align-items:center; width:60px;}
  .arena-badge-label{margin-top:4px; font-size:9px; font-weight:800; color:#9c93c9; text-align:center; line-height:1.25;}
  .arena-rank{color:#fde68a; font-weight:950; font-size:13px; margin-bottom:4px;}
  .af-toggle{
    margin:4px 0 14px; padding:10px 14px; border-radius:14px; text-align:center; cursor:pointer;
    background:rgba(255,255,255,.05); border:1px dashed rgba(167,139,250,.4);
    color:#cabffa; font-size:12.5px; font-weight:900;
  }
  .af-toggle:hover{border-color:rgba(167,139,250,.7); color:#f2eefc;}
  .af-steps{margin-bottom:8px;}

  /* ---- Arena stats ---- */
  .stat-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:8px;}
  .stat-tile{padding:10px 6px; border-radius:12px; text-align:center; background:rgba(255,255,255,.05); border:1px solid rgba(255,255,255,.1);}
  .stat-tile .st-n{font-family:"Cinzel",Georgia,serif; font-size:19px; font-weight:800; color:#fde68a;}
  .stat-tile .st-l{margin-top:2px; font-size:9.5px; font-weight:800; letter-spacing:.05em; text-transform:uppercase; color:#9c93c9;}
  .type-stat-list{display:flex; flex-direction:column; gap:7px;}
  .type-stat-row{display:grid; grid-template-columns:118px 1fr 38px; align-items:center; gap:8px;}
  .ts-label{font-size:11px; font-weight:800; color:#cabffa;}
  .ts-bar{display:block; height:7px; border-radius:999px; background:rgba(255,255,255,.1); overflow:hidden;}
  .ts-bar i{display:block; height:100%; background:linear-gradient(90deg,#a78bfa,#60a5fa);}
  .ts-val{font-size:10.5px; font-weight:900; color:#9c93c9; text-align:right;}

  /* ---- Arena quests + quest shelf ---- */
  .quest-list{display:flex; flex-direction:column; gap:10px;}
  .quest-item{
    display:flex; align-items:center; gap:10px; padding:10px; border-radius:14px;
    background:rgba(255,255,255,.05); border:1px solid rgba(255,255,255,.12);
  }
  .quest-item.done{border-color:rgba(52,211,153,.55); background:rgba(52,211,153,.1);}
  .quest-item.done .quest-bar i{background:linear-gradient(90deg,#fde68a,#34d399);}
  .quest-item.done .quest-progress{color:#86efac;}
  .quest-chest{flex-shrink:0;}
  .quest-info{flex:1; min-width:0;}
  .quest-name{font-size:12.5px; font-weight:900; color:#f2eefc;}
  .quest-desc{margin-top:1px; font-size:10.5px; font-weight:700; color:#9c93c9;}
  .quest-bar{display:block; height:6px; border-radius:999px; background:rgba(255,255,255,.1); overflow:hidden; margin-top:6px;}
  .quest-bar i{display:block; height:100%; background:linear-gradient(90deg,#34d399,#10b981);}
  .quest-progress{flex-shrink:0; font-size:11px; font-weight:950; color:#fde68a;}
  .quest-shelf-grid{display:flex; flex-wrap:wrap; gap:10px; margin-top:6px;}
  .quest-shelf-badge{position:relative; width:52px; text-align:center;}
  .qsb-emoji{
    position:absolute; left:50%; top:2px; transform:translateX(-50%); font-size:16px;
    filter:drop-shadow(0 2px 3px rgba(0,0,0,.6));
  }

  /* ---- in-session extras ---- */
  .ta-score{font-size:13px; font-weight:950; color:#fde68a;}
  .ta-timer-wrap{height:5px; border-radius:999px; background:rgba(255,255,255,.1); overflow:hidden; margin-bottom:10px;}
  .ta-timer-bar{display:block; height:100%; background:linear-gradient(90deg,#34d399,#fbbf24,#f87171); transition:width 1s linear;}
  .tq-lead{font-family:Georgia,"Times New Roman",serif; font-size:15.5px; line-height:1.55; color:#f2eefc;}
  .tq-lead .blank-slot{display:inline-block; min-width:52px; border-bottom:2px dashed rgba(167,139,250,.6); color:transparent;}
  .fe-words{font-family:Georgia,"Times New Roman",serif; font-size:15.5px; line-height:1.8; color:#f2eefc;}
  .fe-word{cursor:pointer; padding:1px 3px; border-radius:5px; transition:background .12s;}
  .fe-word:hover{background:rgba(167,139,250,.22);}
  .fe-word.picked-wrong{background:rgba(248,113,113,.3);}
  .fe-word.picked-right{background:rgba(52,211,153,.3);}
  .recite-btns{display:flex; flex-direction:column; gap:10px; max-width:320px; margin:0 auto;}
  .hint-row{margin-top:10px;}
  .hint-btn{
    appearance:none; border:1px dashed rgba(255,255,255,.25); border-radius:12px; background:transparent;
    color:#9c93c9; font-size:11.5px; font-weight:800; padding:7px 12px; cursor:pointer;
  }
  .hint-btn:hover{color:#cabffa; border-color:rgba(167,139,250,.5);}

  /* =========================================================
     GAME FEEL — sheen, hover lift, entrance motion
     ========================================================= */
  .btn.primary{position:relative; overflow:hidden;}
  .btn.primary::after{
    content:""; position:absolute; top:0; left:-70%; width:42%; height:100%;
    transform:skewX(-20deg); pointer-events:none;
    background:linear-gradient(90deg, transparent, rgba(255,255,255,.35), transparent);
    animation:btnSheen 3.4s ease-in-out infinite;
  }
  @keyframes btnSheen{0%,55%{left:-70%;}100%{left:140%;}}
  button.btn:not(:disabled):hover{transform:translateY(-1px); filter:brightness(1.06);}
  button.btn:not(:disabled):active{transform:translateY(1px); filter:brightness(.98);}
  .choice-card{transition:transform .18s ease, box-shadow .18s ease;}
  .choice-card:hover{transform:translateY(-3px); box-shadow:0 14px 28px rgba(0,5,20,.22);}
  .shelf-slot .relic, .review-item .relic{transition:transform .2s ease;}
  .shelf-slot:hover .relic{transform:scale(1.08) rotate(-2deg);}
  .spark{display:inline-block; animation:sparkTwinkle 2.6s ease-in-out infinite;}
  @keyframes sparkTwinkle{0%,100%{transform:scale(1);}50%{transform:scale(1.2) rotate(8deg);}}
  #body > *{animation:riseIn .5s cubic-bezier(.2,.8,.2,1) both;}
  #body > *:nth-child(2){animation-delay:.06s;}
  #body > *:nth-child(3){animation-delay:.12s;}
  #body > *:nth-child(4){animation-delay:.18s;}
  #body > *:nth-child(5){animation-delay:.24s;}
  #body > *:nth-child(6){animation-delay:.3s;}
  @keyframes riseIn{from{opacity:0; transform:translateY(14px);}to{opacity:1; transform:none;}}
  .verse-text.reshuffled{animation:reshuffleFlash .5s ease;}
  @keyframes reshuffleFlash{0%{filter:brightness(1);}35%{filter:brightness(1.4);}100%{filter:brightness(1);}}
  .shuffle-btn:active{transform:rotate(-3deg) translateY(1px) !important;}

  /* study controls: flexible row (Easier · Shuffle · Harder) */
  .controls{display:flex; flex-wrap:wrap; gap:8px;}
  .controls .btn{flex:1 1 140px; width:auto;}

  /* shelf on small screens: 3 across */
  @media (max-width:600px){
    .shelf-grid{grid-template-columns:repeat(3,1fr); gap:24px 10px;}
  }
  /* six tabs fit */
  nav.tabs button{padding:9px 8px;}
  @media (max-width:640px){
    nav.tabs{flex-wrap:wrap;}
    nav.tabs button{font-size:12px; min-height:38px; flex:1 1 30%;}
  }

  /* =========================================================
     HEADER V2 — rank progress, streak flame tiers, quick keys
     ========================================================= */
  .hdr-btns{position:relative; z-index:3; display:flex; justify-content:flex-end; gap:8px; margin:-6px -6px 4px 0;}
  .hdr-round{
    appearance:none; display:flex; align-items:center; gap:4px; padding:6px 10px; min-height:32px;
    background:rgba(255,255,255,.09); border:1px solid rgba(255,255,255,.18); border-radius:999px;
    color:#fff; font-family:var(--font); font-size:14px; font-weight:900; cursor:pointer;
    transition:background .15s, transform .1s;
  }
  .hdr-round:hover{background:rgba(255,255,255,.18);}
  .hdr-round:active{transform:translateY(1px);}
  .hdr-achv-n{font-size:11px; color:#fde68a;}
  .stat-tap{cursor:pointer; transition:transform .1s, background .15s;}
  .stat-tap:hover{background:rgba(255,255,255,.13);}
  .stat-tap:active{transform:translateY(1px);}
  .stat-streak .n{display:flex; align-items:center; justify-content:center; gap:3px;}
  .stat-streak .flame{display:inline-block; font-size:15px; transition:filter .3s, transform .3s;}
  .stat-streak.tier-0 .flame{filter:grayscale(1); opacity:.4;}
  .stat-streak.tier-2 .flame{filter:drop-shadow(0 0 5px rgba(251,146,60,.8));}
  .stat-streak.tier-3 .flame{filter:drop-shadow(0 0 7px rgba(251,146,60,.95)); animation:flamePulse 1.6s ease-in-out infinite;}
  .stat-streak.tier-4 .flame{filter:hue-rotate(190deg) drop-shadow(0 0 8px rgba(34,211,238,.9)); animation:flamePulse 1.4s ease-in-out infinite;}
  .stat-streak.tier-5 .flame{filter:hue-rotate(-15deg) saturate(1.6) drop-shadow(0 0 9px rgba(244,185,66,1)); animation:flamePulse 1.2s ease-in-out infinite;}
  @keyframes flamePulse{0%,100%{transform:scale(1);}50%{transform:scale(1.22);}}
  .shield-mini{font-size:10px; margin-left:2px; letter-spacing:-.02em;}
  .rank-bar{position:relative; z-index:1; margin-top:10px;}
  .rank-bar-track{height:7px; border-radius:999px; background:rgba(255,255,255,.12); overflow:hidden;}
  .rank-bar-track i{display:block; height:100%; border-radius:999px; background:linear-gradient(90deg,var(--aqua),var(--gold)); box-shadow:0 0 10px rgba(244,185,66,.5); transition:width .6s ease;}
  .rank-bar-label{margin-top:5px; text-align:center; color:#aabbd8; font-size:10.5px; font-weight:800;}
  .rank-bar-label strong{color:#fde68a;}

  /* =========================================================
     TABS V2 — icon tabs; app-style fixed bottom bar on phones
     ========================================================= */
  nav.tabs button{display:flex; align-items:center; justify-content:center; gap:6px; position:relative; flex-wrap:nowrap;}
  .tab-ico{position:relative; font-size:15px; line-height:1;}
  .tab-txt{line-height:1;}
  .tab-dot{
    position:absolute; top:-7px; right:-11px; min-width:15px; height:15px; padding:0 3px;
    display:flex; align-items:center; justify-content:center; border-radius:999px;
    background:linear-gradient(180deg,#fb923c,#ea580c); color:#fff; font-size:9px; font-weight:950; font-style:normal;
    box-shadow:0 1px 4px rgba(0,0,0,.35);
  }
  @media (max-width:640px){
    nav.tabs{
      position:fixed; left:8px; right:8px; bottom:0; z-index:60;
      margin:0 0 calc(8px + env(safe-area-inset-bottom,0px));
      flex-wrap:nowrap; gap:2px; padding:5px;
      background:rgba(255,255,255,.97);
      box-shadow:0 -6px 24px rgba(7,13,31,.28), var(--shadow-sm);
      backdrop-filter:blur(8px); -webkit-backdrop-filter:blur(8px);
    }
    nav.tabs button{
      flex:1 1 0; min-width:0; min-height:46px; padding:5px 2px;
      flex-direction:column; gap:3px; font-size:9.5px; letter-spacing:0;
    }
    nav.tabs button .tab-ico{font-size:17px;}
    nav.tabs button .tab-txt{white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:100%;}
  }

  /* =========================================================
     TODAY GREETING
     ========================================================= */
  .today-greet{margin:2px 2px 12px; color:#eaf4ff;}
  .tg-word{font-family:"Cinzel",Georgia,serif; font-size:clamp(17px,4.6vw,22px); font-weight:800; color:#fff; text-shadow:0 2px 8px rgba(0,5,20,.4);}
  .tg-sub{margin-top:3px; font-size:12.5px; font-weight:800; color:#b9c9e2; line-height:1.45;}

  /* =========================================================
     DAILY CHECK-IN — flame, weekly chain, blessing chest
     ========================================================= */
  /* Spotlight: pulsing glow on the control that earns a tapped achievement */
  .spotlit{position:relative; z-index:5; outline:3px solid rgba(244,185,66,.9); outline-offset:3px; border-radius:14px; animation:spotPulse 1.1s ease-in-out 5;}
  @keyframes spotPulse{0%,100%{box-shadow:0 0 0 0 rgba(244,185,66,0);}50%{box-shadow:0 0 22px 6px rgba(244,185,66,.55);}}
  .achv-top.achv-link{cursor:pointer; border-radius:12px; transition:background .15s;}
  .achv-top.achv-link:hover{background:rgba(244,185,66,.08);}
  .achv-item.achv-link{cursor:pointer; border-radius:12px; transition:background .15s;}
  .achv-item.achv-link:hover{background:rgba(244,185,66,.08);}
  .checkin-card{border-width:1.5px;}
  .checkin-card.tier-3, .checkin-card.tier-4, .checkin-card.tier-5{border-color:rgba(244,185,66,.55); box-shadow:0 2px 10px rgba(11,45,66,.07), 0 0 18px rgba(244,185,66,.18);}
  .ci-shields{margin-left:auto; font-size:11px; color:#0e7490; letter-spacing:0;}
  .ci-top{display:flex; gap:12px; align-items:center;}
  .ci-flame-wrap{flex-shrink:0; width:64px; text-align:center;}
  .ci-flame{font-size:34px; line-height:1; transition:filter .3s;}
  .checkin-card.tier-0 .ci-flame{filter:grayscale(1); opacity:.4;}
  .checkin-card.tier-2 .ci-flame{filter:drop-shadow(0 0 6px rgba(251,146,60,.8));}
  .checkin-card.tier-3 .ci-flame{filter:drop-shadow(0 0 8px rgba(251,146,60,.95)); animation:flamePulse 1.6s ease-in-out infinite;}
  .checkin-card.tier-4 .ci-flame{filter:hue-rotate(190deg) drop-shadow(0 0 9px rgba(34,211,238,.9)); animation:flamePulse 1.4s ease-in-out infinite;}
  .checkin-card.tier-5 .ci-flame{filter:hue-rotate(-15deg) saturate(1.6) drop-shadow(0 0 10px rgba(244,185,66,1)); animation:flamePulse 1.2s ease-in-out infinite;}
  .ci-streak-n{font-family:"Cinzel",Georgia,serif; font-size:24px; font-weight:800; color:var(--ink); line-height:1; margin-top:2px;}
  .ci-streak-l{font-size:9px; font-weight:950; letter-spacing:.1em; text-transform:uppercase; color:var(--muted);}
  .ci-main{flex:1; min-width:0;}
  .ci-title{font-size:14.5px; font-weight:950; color:var(--ink);}
  .ci-sub{margin-top:2px; font-size:11.5px; font-weight:750; color:var(--muted); line-height:1.45;}
  .ci-sub strong{color:#b45309;}
  .ci-week-wrap{margin-top:10px;}
  .ci-week-label{display:flex; justify-content:space-between; gap:8px; margin-bottom:6px; color:var(--muted); font-size:9.5px; font-weight:900;}
  .ci-week-label strong{color:var(--indigo-d);}
  .ci-week{display:grid; grid-template-columns:repeat(7,minmax(36px,1fr)); gap:5px;}
  .ci-day{
    position:relative; min-width:0; text-align:center; padding:6px 2px 5px; border-radius:11px;
    background:linear-gradient(180deg,#f7fafc,#edf4f8); border:1.5px solid #dce9ef;
    transition:transform .15s, border-color .15s, box-shadow .15s;
  }
  .ci-day.lit{background:linear-gradient(180deg,#fff7df,#ffe7ad); border-color:#f4b942; box-shadow:0 2px 0 rgba(180,83,9,.18);}
  .ci-day.today{outline:2px solid var(--aqua); outline-offset:1px; transform:translateY(-1px);}
  .ci-day.future{background:linear-gradient(180deg,#fbfdff,#f1f7fa); border-style:dashed;}
  .ci-day.reward{border-color:#d9b45a; background:linear-gradient(180deg,#fffaf0,#f8f1df);}
  .ci-day.reward::after{content:""; position:absolute; inset:-3px; border-radius:13px; border:1px solid rgba(244,185,66,.22); pointer-events:none;}
  .ci-dow{display:block; font-size:8px; font-weight:950; color:var(--muted); letter-spacing:.05em;}
  .ci-step{display:block; margin-top:1px; font-size:7.5px; font-weight:950; color:#8fa6bd; text-transform:uppercase; letter-spacing:.04em;}
  .ci-dot{display:grid; place-items:center; min-height:18px; margin-top:1px; font-size:13px; line-height:18px;}
  .ci-day.future .ci-dot{opacity:.72; filter:saturate(.8);}
  .ci-gift{flex-shrink:0; width:86px; text-align:center; position:relative;}
  .ci-gift:not(.claimed){cursor:pointer;}
  .ci-gift:not(.claimed) .chest-img{animation:giftBeckon 2.2s ease-in-out infinite; filter:drop-shadow(0 0 10px rgba(244,185,66,.55));}
  @keyframes giftBeckon{0%,100%{transform:translateY(0) rotate(0);}8%{transform:translateY(-3px) rotate(-3deg);}16%{transform:translateY(0) rotate(2deg);}24%{transform:translateY(-2px) rotate(0);}32%{transform:translateY(0);}}
  .ci-gift.opening .chest-img{animation:giftOpen .65s ease-in-out;}
  @keyframes giftOpen{0%,100%{transform:scale(1) rotate(0);}25%{transform:scale(1.12) rotate(-6deg);}50%{transform:scale(1.18) rotate(5deg);}75%{transform:scale(1.24) rotate(-3deg); filter:brightness(1.5) drop-shadow(0 0 18px rgba(255,205,100,1));}}
  .ci-gift.claimed .chest-img{filter:grayscale(.5); opacity:.75;}
  .ci-gift-tag{
    margin-top:2px; font-size:10px; font-weight:950; color:#b45309; line-height:1.2;
    text-transform:uppercase; letter-spacing:.04em;
  }
  .ci-gift-tag.done{color:var(--green);}
  .ci-chain-toggle{
    margin-top:11px; padding:8px; border-radius:12px; text-align:center; cursor:pointer;
    border:1.5px dashed #d5e2ea; color:var(--muted); font-size:11.5px; font-weight:900;
  }
  .ci-chain-toggle:hover{border-color:var(--aqua); color:var(--indigo-d);}
  .ci-journey-head{display:flex; align-items:flex-end; justify-content:space-between; gap:10px; margin-top:11px;}
  .ci-journey-title{font-size:12px; font-weight:950; color:var(--ink);}
  .ci-journey-sub{margin-top:2px; font-size:9.5px; font-weight:800; color:var(--muted);}
  .ci-next-reward{flex-shrink:0; padding:5px 8px; border-radius:999px; color:#7c4a03; background:#fff4d6; border:1px solid #f2cf72; font-size:9px; font-weight:950;}
  .ci-chain{display:grid; grid-template-columns:repeat(14,1fr); gap:6px 4px; margin-top:10px;}
  .ci-chain-day{
    position:relative; aspect-ratio:1; display:grid; place-items:center; border-radius:7px;
    background:linear-gradient(180deg,#f7fafc,#edf4f8); border:1.5px solid #dfeaf0;
    color:#9aabba; font-size:8px; font-weight:950;
  }
  .ci-chain-day.lit{color:#5f3c00; background:linear-gradient(160deg,#fde68a,#f7b733); border-color:#dda52f; box-shadow:0 0 7px rgba(244,185,66,.35);}
  .ci-chain-day.today{outline:2px solid var(--aqua); outline-offset:1px; z-index:2;}

  .achv-top .achv-name{font-size:12.5px; font-weight:950; color:var(--ink);}
  .achv-top .achv-desc{font-size:10.5px; font-weight:750; color:var(--muted); margin-top:1px;}
  .achv-top .achv-bar{height:6px; border-radius:999px; background:#e8eef4; overflow:hidden; margin-top:5px;}
  .achv-top .achv-bar i{display:block; height:100%; background:linear-gradient(90deg,var(--aqua),var(--gold));}
  .achv-top .achv-prog{flex-shrink:0; font-size:11px; font-weight:950; color:var(--gold-2);}
  .achv-card{max-width:520px; text-align:left;}
  .achv-head{text-align:center; margin-bottom:14px;}
  .achv-trophy{font-size:40px; animation:glyphFloat 3s ease-in-out infinite;}
  .achv-count{margin-top:2px; color:#cabffa; font-size:12px; font-weight:800;}
  .achv-total-bar{height:8px; margin:10px auto 0; max-width:280px; border-radius:999px; background:rgba(255,255,255,.12); overflow:hidden;}
  .achv-total-bar i{display:block; height:100%; background:linear-gradient(90deg,#a78bfa,#fbbf24); box-shadow:0 0 10px rgba(251,191,36,.5);}
  .achv-cat{margin-bottom:14px;}
  .achv-cat-title{
    display:flex; justify-content:space-between; align-items:center;
    font-size:11px; font-weight:950; letter-spacing:.12em; text-transform:uppercase; color:#a78bfa; margin-bottom:7px;
  }
  .achv-cat-title span{color:#9c93c9; letter-spacing:0;}
  .achv-item{
    display:flex; align-items:center; gap:10px; padding:8px 9px; margin-bottom:6px;

  }
  .achv-item .achv-badge{background:rgba(255,255,255,.06); border-color:rgba(255,255,255,.14); filter:grayscale(1); opacity:.45;}
  .achv-item.won{border-color:rgba(251,191,36,.5); background:rgba(251,191,36,.08);}

  .achv-item .achv-info{flex:1; min-width:0;}
  .achv-item .achv-name{font-size:12.5px; font-weight:900; color:#f2eefc;}
  .achv-check{color:#34d399;}
  .achv-item .achv-desc{font-size:10.5px; font-weight:700; color:#9c93c9; margin-top:1px;}
  .achv-item .achv-bar{height:5px; border-radius:999px; background:rgba(255,255,255,.1); overflow:hidden; margin-top:5px;}
  .achv-item .achv-bar i{display:block; height:100%; background:linear-gradient(90deg,#a78bfa,#fbbf24);}
  .achv-item .achv-prog{flex-shrink:0; font-size:10.5px; font-weight:950; color:#fde68a;}

  /* =========================================================
     SHARE POP
     ========================================================= */
  .share-card{max-width:430px;}
  .share-preview{margin:12px auto 4px; display:flex; justify-content:center;}
  .share-preview .relic{margin:0 auto;}
  .share-img{width:100%; max-width:280px; border-radius:14px; border:1px solid rgba(244,185,66,.5); box-shadow:0 10px 26px rgba(0,5,20,.5);}
  .share-text{
    margin:12px 0 2px; padding:12px; border-radius:13px; text-align:left;
    background:rgba(255,255,255,.06); border:1px solid rgba(255,255,255,.12);
    color:#e6def8; font-size:12.5px; font-weight:700; line-height:1.55;
  }

  /* =========================================================
     ARENA V2 — game modes, playable quests, blitz, new types
     ========================================================= */
  .mode-grid{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
  .mode-card{
    position:relative; padding:14px 12px 12px; border-radius:16px; text-align:center; cursor:pointer;
    background:rgba(255,255,255,.05); border:1.5px solid rgba(167,139,250,.35);
    transition:transform .12s, border-color .15s, box-shadow .15s;
  }
  .mode-card:hover{transform:translateY(-2px); border-color:rgba(167,139,250,.75); box-shadow:0 8px 20px rgba(0,5,20,.35);}
  .mode-card:active{transform:translateY(1px);}
  .mode-card.blitz{border-color:rgba(251,191,36,.45);}
  .mode-card.blitz:hover{border-color:rgba(251,191,36,.85);}
  .mc-ico{font-size:27px; line-height:1;}
  .mc-name{margin-top:6px; font-family:"Cinzel",Georgia,serif; font-size:13.5px; font-weight:800; color:#f2eefc;}
  .mc-sub{margin-top:3px; font-size:10.5px; font-weight:750; color:#9c93c9; line-height:1.4;}
  .mc-play{
    display:inline-block; margin-top:8px; padding:4px 13px; border-radius:999px;
    background:linear-gradient(180deg,#fef3c7,#fbbf24); color:#3a2205;
    font-size:10.5px; font-weight:950; letter-spacing:.06em;
  }
  .quest-click{cursor:pointer; transition:transform .12s, border-color .15s, box-shadow .15s;}
  .quest-click:hover{transform:translateY(-2px); border-color:rgba(251,191,36,.65); box-shadow:0 8px 18px rgba(0,5,20,.3);}
  .quest-click:active{transform:translateY(1px);}
  .quest-side{flex-shrink:0; display:flex; flex-direction:column; align-items:flex-end; gap:5px;}
  .quest-play{
    padding:3px 10px; border-radius:999px; background:linear-gradient(180deg,#fef3c7,#fbbf24);
    color:#3a2205; font-size:9.5px; font-weight:950; letter-spacing:.05em; white-space:nowrap;
  }
  .quest-won{
    padding:3px 10px; border-radius:999px; background:rgba(52,211,153,.16);
    border:1px solid rgba(52,211,153,.45); color:#bbf7d0;
    font-size:9.5px; font-weight:950; letter-spacing:.05em; white-space:nowrap;
  }
  .quest-list-light .quest-item{background:#f8fbff; border:1.5px solid #e2ecf2;}
  .quest-list-light .quest-item.done{border-color:rgba(22,163,74,.5); background:#f0fdf4;}
  .quest-list-light .quest-name{color:var(--ink);}
  .quest-list-light .quest-desc{color:var(--muted);}
  .quest-list-light .quest-bar{background:#e8eef4;}
  .quest-list-light .quest-progress{color:var(--gold-2);}
  .quest-list-light .quest-click:hover{border-color:var(--gold);}
  .quest-list-light .quest-won{background:#dcfce7; border-color:#86efac; color:#166534;}
  .quest-done-card{cursor:pointer; transition:transform .12s, box-shadow .15s;}
  .quest-done-card:hover{transform:translateY(-1px); box-shadow:0 7px 16px rgba(0,5,20,.18);}
  .quest-hud{
    margin:-2px 0 10px; padding:10px 12px; border-radius:14px; text-align:left;
    background:rgba(251,191,36,.08); border:1px solid rgba(251,191,36,.28);
  }
  .quest-hud-top{display:flex; justify-content:space-between; gap:10px; align-items:center; color:#fde68a; font-size:11px; font-weight:950;}
  .quest-hud-desc{margin-top:3px; color:#b9aef2; font-size:10.5px; font-weight:750; line-height:1.35;}
  .quest-hud .quest-bar{background:rgba(255,255,255,.13);}
  .quest-hud .quest-progress{color:#fde68a;}
  .arena-heart-bank{display:flex; align-items:center; justify-content:center; gap:4px; margin:-2px 0 10px; font-size:15px;}
  .arena-heart-bank .heart{filter:drop-shadow(0 0 5px rgba(248,113,113,.45));}
  .arena-heart-bank .heart.empty{opacity:.28; filter:grayscale(1);}
  .arena-heart-bank .heart-label{margin-left:4px; color:#9c93c9; font-size:10px; font-weight:900; letter-spacing:.08em; text-transform:uppercase;}
  .heart-refill{
    display:inline-flex; align-items:center; gap:5px; margin-left:6px; padding:2px 8px; border-radius:999px;
    background:rgba(248,113,113,.12); border:1px solid rgba(248,113,113,.28);
    color:#fecaca; font-size:9.5px; font-weight:950; white-space:nowrap;
  }

  .blitz-head{display:flex; align-items:baseline; gap:6px; min-width:0;}
  .blitz-secs{font-family:"Cinzel",Georgia,serif; font-size:24px; font-weight:800; color:#fde68a; line-height:1;}
  .blitz-secs.low{color:#f87171; animation:blitzLow .6s ease-in-out infinite;}
  @keyframes blitzLow{0%,100%{transform:scale(1);}50%{transform:scale(1.15);}}
  .blitz-label{font-size:10px; font-weight:900; color:#9c93c9; text-transform:uppercase; letter-spacing:.08em;}
  .blitz-count{margin-left:8px; font-size:11.5px; font-weight:950; color:#a5f3fc; white-space:nowrap;}
  .blitz-track{margin-bottom:10px;}

  .scr-built{
    display:flex; flex-wrap:wrap; gap:6px; justify-content:center; margin-top:10px; padding:10px;
    border-radius:13px; background:rgba(255,255,255,.05); border:1px solid rgba(255,255,255,.1);
    min-height:44px;
  }
  .scr-context{
    margin:8px auto 0; max-width:560px; padding:10px 12px; border-radius:14px; text-align:left;
    background:rgba(255,255,255,.045); border:1px dashed rgba(167,139,250,.28);
    color:#b9aef2; font-family:Georgia,"Times New Roman",serif; font-size:13.5px; line-height:1.5;
  }
  .scr-context strong{display:block; margin-bottom:3px; color:#fde68a; font:950 10px var(--font); letter-spacing:.12em; text-transform:uppercase;}
  .scr-context .fade-tail{color:#f2eefc;}
  .scr-hint-row{display:flex; justify-content:center; margin:10px 0 0;}
  .scr-pool{display:flex; flex-wrap:wrap; gap:8px; justify-content:center;}
  .scr-chip{
    appearance:none; padding:10px 15px; border-radius:12px; cursor:pointer;
    background:rgba(255,255,255,.08); border:1px solid rgba(255,255,255,.2); color:#f2eefc;
    font-family:Georgia,"Times New Roman",serif; font-size:15px; font-weight:700;
    transition:transform .1s, background .15s, border-color .15s;
  }
  .scr-chip:hover{transform:translateY(-2px); background:rgba(167,139,250,.18); border-color:rgba(167,139,250,.6);}
  .scr-chip.wrong{animation:cerShake .35s ease-in-out; border-color:#f87171; background:rgba(248,113,113,.14);}

  .pm-grid{display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-top:10px; text-align:left;}
  .pm-col{display:flex; flex-direction:column; gap:8px; min-width:0;}
  .pm-chip{
    appearance:none; width:100%; padding:10px 10px; border-radius:12px; cursor:pointer; text-align:left;
    background:rgba(255,255,255,.07); border:1.5px solid rgba(255,255,255,.16); color:#fff;
    font-family:var(--font); transition:transform .1s, background .15s, border-color .15s, opacity .3s;
  }
  .pm-chip:hover{border-color:rgba(167,139,250,.6);}
  .pm-chip.sel{border-color:var(--aqua); background:rgba(34,211,238,.14); box-shadow:0 0 12px rgba(34,211,238,.35);}
  .pm-chip.matched{border-color:rgba(52,211,153,.6); background:rgba(52,211,153,.13); opacity:.55; cursor:default;}
  .pm-chip.miss{animation:cerShake .35s ease-in-out; border-color:#f87171; background:rgba(248,113,113,.14);}
  .pm-foot{margin-top:9px; text-align:center; font-size:10.5px; font-weight:900; color:#9c93c9;}

  .fe-lives{margin:2px 0 0; text-align:center; font-size:11px; font-weight:900; color:#9c93c9;}
  .fe-retry{
    margin:10px 0 0; padding:10px 13px; border-radius:13px; text-align:center;
    background:rgba(251,191,36,.12); border:1px solid rgba(251,191,36,.5);
    color:#fde68a; font-size:12.5px; font-weight:800; line-height:1.45;
    animation:riseIn .35s cubic-bezier(.2,.8,.2,1) both;
  }
  .fe-word.used{cursor:default; text-decoration:line-through; opacity:.6;}

  .ta-ring{
    position:absolute; inset:-3px; border-radius:18px; pointer-events:none;
    border:2.5px solid #34d399; opacity:0;
    animation:ringOut .65s ease-out forwards;
  }
  @keyframes ringOut{0%{opacity:.95; transform:scale(.96);}100%{opacity:0; transform:scale(1.09);}}
  .ta-combo-pop{
    position:absolute; left:50%; top:38%; transform:translate(-50%,-50%);
    pointer-events:none; z-index:5; white-space:nowrap;
    font-family:"Cinzel",Georgia,serif; font-size:clamp(20px,6vw,30px); font-weight:800;
    color:#fde68a; text-shadow:0 0 18px rgba(251,191,36,.85), 0 2px 4px rgba(0,0,0,.5);
    animation:comboPop 1.05s cubic-bezier(.2,.9,.3,1.2) forwards;
  }
  @keyframes comboPop{0%{opacity:0; transform:translate(-50%,-50%) scale(.4) rotate(-6deg);}22%{opacity:1; transform:translate(-50%,-50%) scale(1.12) rotate(2deg);}38%{transform:translate(-50%,-50%) scale(1);}75%{opacity:1;}100%{opacity:0; transform:translate(-50%,-64%) scale(1.02);}}
  .tr-stamp{
    position:absolute; top:18px; right:14px; z-index:4; pointer-events:none;
    padding:7px 14px; border:3px solid #fbbf24; border-radius:10px; transform:rotate(9deg);
    font-family:"Cinzel",Georgia,serif; font-size:19px; font-weight:800; letter-spacing:.14em;
    color:#fde68a; text-shadow:0 0 14px rgba(251,191,36,.7);
    box-shadow:0 0 18px rgba(251,191,36,.35), inset 0 0 14px rgba(251,191,36,.2);
    animation:stampIn .5s cubic-bezier(.2,.9,.3,1.4) .45s both;
  }
  @keyframes stampIn{0%{opacity:0; transform:rotate(9deg) scale(2.4);}100%{opacity:1; transform:rotate(9deg) scale(1);}}
  .trial-results{position:relative;}

  /* =========================================================
     FX CANVAS + REDUCED MOTION
     ========================================================= */
  #fxCanvas{position:fixed; inset:0; z-index:220; pointer-events:none;}
  @media (prefers-reduced-motion:reduce){
    .ci-gift:not(.claimed) .chest-img, .stat-streak .flame, .ci-flame, .blitz-secs.low{animation:none !important;}
  }

  /* =========================================================
     RESPONSIVE POLISH — landscape phones + small screens
     ========================================================= */
  @media (max-width:400px){
    .ci-top{flex-wrap:wrap;}
    .ci-gift{width:74px; margin-left:auto;}
    .ci-flame-wrap{width:54px;}
    .ci-flame{font-size:28px;}
    .mode-grid{grid-template-columns:1fr;}
    .pm-grid{grid-template-columns:1fr;}
    .hdr-round{padding:5px 8px; font-size:13px;}
  }
  @media (max-width:640px){
    .toast{bottom:calc(96px + env(safe-area-inset-bottom,0px)); z-index:70;}
  }
  @media (orientation:landscape) and (max-height:520px){
    header.top{padding:12px 14px 12px;}
    header.top h1{font-size:24px;}
    header.top h1::after{display:none;}
    .hero-start{padding:16px 14px;}
    .cer-stage, .prove-stage{max-height:94vh; overflow-y:auto;}
    .relic-pop-card{max-height:94vh;}
    .rp-relic .relic{--rsz:clamp(110px, 24vh, 200px) !important;}
    nav.tabs{position:static; margin:10px 0 12px; box-shadow:var(--shadow-sm);}
    nav.tabs button{flex-direction:row; min-height:36px; font-size:11px; gap:5px;}
    nav.tabs button .tab-ico{font-size:14px;}
  }

</style>

  {trim:"#b0763b", glow:"rgba(176,118,59,.45)", metal:"Bronze"},
  {trim:"#9fb2c1", glow:"rgba(159,178,193,.5)", metal:"Silver"},
  {trim:"#a3b52f", glow:"rgba(163,181,47,.45)", metal:"Green Gold"},

function wordCount(text){ return (text||"").trim().split(/\s+/).filter(Boolean).length; }
function difficultyIndexForText(text){
  const words = wordCount(text);
  if(words <= 25) return 0;
  if(words <= 55) return 1;
  if(words <= 90) return 2;
  if(words <= 145) return 3;
  return 4;
}
function difficultyForVerse(v){
  const idx = difficultyIndexForText(v.text);
  return {...DIFFICULTIES[idx], index:idx, words:wordCount(v.text), trim:TIER_TRIMS[idx]};
}
function difficultyLabelForVerse(v){
  const d = difficultyForVerse(v);
  return `<span class="emoji">${d.emoji}</span><span>${d.label} scripture · ${d.words} words</span>`;
}
function stageLabel(stage){
  const d = DIFFICULTIES[stage] || DIFFICULTIES[0];
  return `${d.stage}`;
}

/* =========================================================

   When this app lives on the SAME DOMAIN as Daily Quest,
   localStorage is shared: we read who is playing and write
   seal events that Daily Quest converts into XP and a
   completed scriptures daily.
   ========================================================= */
const DAILY_QUEST_URL = "/daily/"; // Daily Quest lives at myrateplace.com/daily
const CLIMBER = (function(){
  const q = new URLSearchParams(location.search).get("climber");
  if(q && q.trim()){
    try{ localStorage.setItem("sq_activeClimber", q.trim()); }catch(e){}
    return q.trim();
  }
  try{
    const dq = JSON.parse(localStorage.getItem("dailyUnlocks_v1"));
    if(dq && dq.selectedProfile) return dq.selectedProfile;
  }catch(e){}
  // profile chosen earlier via usernames.html (persists across visits)
  try{
    const a = localStorage.getItem("sq_activeClimber");
    if(a && a.trim()) return a.trim();
  }catch(e){}
  return null;
})();
const FROM_DQ = new URLSearchParams(location.search).has("from");
const BRIDGE_KEY = "lul_bridge_events";
function localISODate(){
  const d = new Date();
  return new Date(d.getTime() - d.getTimezoneOffset()*60000).toISOString().slice(0,10);
}
function emitBridge(type, v, xp){
  if(!CLIMBER) return;
  try{
    const q = JSON.parse(localStorage.getItem(BRIDGE_KEY) || "[]");
    q.push({
      id: "lul_" + Date.now() + "_" + Math.random().toString(36).slice(2,7),
      ts: new Date().toISOString(),
      date: localISODate(),
      climber: CLIMBER,
      type, ref: v.ref, xp
    });
    while(q.length > 200) q.shift();
    localStorage.setItem(BRIDGE_KEY, JSON.stringify(q));
    // Close the loop for Daily Quest kids: remind them the daily +100 XP
    // bonus is now claimable. (Delayed so it lands after the seal ceremony
    // starts; harmless if the ceremony is still up — toasts float above.)
    setTimeout(()=>{
      try{ showToast(`🎁 <strong>Daily Quest bonus unlocked!</strong><br><span style="font-size:11.5px;color:#9db4d6;">Head back to Daily Quest and claim your +100 XP for memorizing.</span>`, true); }catch(e){}
    }, 4500);
  }catch(e){}
}

const STORE_KEY = CLIMBER ? "lineUponLine_v1::" + CLIMBER : "lineUponLine_v1";
// snapshot before boot writes an empty save (username-gate uses this)
const HAD_SAVE_AT_BOOT = !!localStorage.getItem("lineUponLine_v1");
const DAY = 86400000;
const REVIEW_LADDER = [1,3,7,14,30,90]; // days between re-seals

function loadState(){
  try{
    const raw = localStorage.getItem(STORE_KEY);
    if(raw) return JSON.parse(raw);
  }catch(e){}
  return {xp:0, streak:0, lastDay:null, progress:{}, edits:{}};
}
function persistState(){ localStorage.setItem(STORE_KEY, JSON.stringify(state)); }
function saveState(){
  persistState();
  if(window.__achvReady) checkAchievements();
}

let state = loadState();
/* v2 migrations: habit calendar, streak shields, achievements, sharing, sound */
(function migrateV2(){
  let ch = false;
  const def = (k, val)=>{ if(state[k] == null){ state[k] = val; ch = true; } };
  def("calendar", {});
  def("bestStreak", state.streak||0);
  def("shields", 0);
  def("achv", {unlocked:{}});
  def("shares", 0);
  def("resealsTotal", 0);
  def("sound", true);
  if(state.lastDay === todayStr()){
    const iso = localISODate();
    if(!state.calendar[iso]){ state.calendar[iso] = {a:1}; ch = true; }
  }
  if(ch) persistState();
})();
VERSES.forEach(v=>{
  if(v.id in (state.edits||{})) v.text = state.edits[v.id];
  if(!state.progress[v.id]) state.progress[v.id] = {stage:0, sealed:false};
});
/* migrate old sealed verses into the review system */
(function migrate(){
  const now = Date.now();
  let changed = false;
  Object.values(state.progress).forEach(p=>{
    if(p.sealed && p.sealedAt == null){
      p.sealedAt = now; p.reviewLevel = 0; p.reviews = 0;
      p.nextReviewAt = now + REVIEW_LADDER[0]*DAY;
      changed = true;
    }
  });
  if(changed) saveState();
})();

    if(!state.climb[vol]){ state.climb[vol] = []; changed = true; }

      .filter(v=>state.progress[v.id].sealed && !state.climb[vol].includes(v.id))
      .sort((a,b)=>(state.progress[a.id].sealedAt||0)-(state.progress[b.id].sealedAt||0));
    missing.forEach(v=>{ state.climb[vol].push(v.id); changed = true; });
  });
  if(changed) saveState();
})();

  const picks = [];
  if(inProg.length) picks.push({v:inProg[0], tag:"⛏️ In progress", cls:"prog"});
  if(fresh.length) picks.push({v:fresh[0], tag:"😌 Quick win", cls:"quick"});

  const y2 = new Date(); y2.setDate(y2.getDate()-2);

  state.bestStreak = Math.max(state.bestStreak||0, state.streak);

/* =========================================================
   REVIEW ENGINE — seals fade, re-seals climb the ladder
   ========================================================= */
function isEternal(p){ return p.sealed && (p.reviewLevel||0) >= REVIEW_LADDER.length; }
function sealVerse(p){
  const now = Date.now();
  p.sealed = true; p.stage = 4;
  p.sealedAt = now; p.reviewLevel = 0; p.reviews = 0;
  p.nextReviewAt = now + REVIEW_LADDER[0]*DAY;
}
function resealVerse(p){
  const now = Date.now();
  const overdueDays = (now - (p.nextReviewAt||now)) / DAY;
  let lvl = p.reviewLevel || 0;
  if(overdueDays > 10) lvl = Math.max(0, lvl - 1);   // cracked seals slip a rung
  else lvl = Math.min(REVIEW_LADDER.length, lvl + 1);
  p.reviewLevel = lvl;
  p.reviews = (p.reviews||0) + 1;
  p.lastReviewAt = now;
  state.resealsTotal = (state.resealsTotal||0) + 1;
  const eternal = lvl >= REVIEW_LADDER.length;
  p.nextReviewAt = eternal ? now + 365*DAY*50 : now + REVIEW_LADDER[Math.min(lvl, REVIEW_LADDER.length-1)]*DAY;
  const xp = 15 + 5*lvl + (overdueDays <= 0 ? 10 : 0);
  return {eternal, xp, lvl};
}
function isDue(p){ return p.sealed && !isEternal(p) && Date.now() >= (p.nextReviewAt||0); }
function sealCondition(p){
  if(!p || !p.sealed) return null;
  if(isEternal(p)) return {id:"eternal", label:"Eternal ✦", cls:"cond-eternal"};
  const od = (Date.now() - (p.nextReviewAt||0)) / DAY;
  if(od < 0)  return {id:"radiant", label:"Radiant", cls:"cond-radiant"};
  if(od < 3)  return {id:"dimming", label:"Dimming", cls:"cond-dimming"};
  if(od < 10) return {id:"fading",  label:"Fading",  cls:"cond-fading"};
  return {id:"cracked", label:"Cracked", cls:"cond-cracked"};
}
function dueReviews(){
  return VERSES
    .filter(v=>isDue(state.progress[v.id]))
    .sort((a,b)=>state.progress[a.id].nextReviewAt - state.progress[b.id].nextReviewAt);
}
function nextReviewText(p){
  if(isEternal(p)) return "Sealed forever";
  const ms = (p.nextReviewAt||0) - Date.now();
  if(ms <= 0) return "Re-seal due now";
  const d = Math.ceil(ms/DAY);
  return d === 1 ? "Re-seal in 1 day" : `Re-seal in ${d} days`;
}

/* =========================================================
   SFX — tiny WebAudio synth. No files, no dependencies.
   Every call checks state.sound; context is created lazily
   on the first user-gesture-driven play.
   ========================================================= */
const SFX = (function(){
  let ctx = null;
  function ac(){
    if(state.sound === false) return null;
    try{
      if(!ctx) ctx = new (window.AudioContext || window.webkitAudioContext)();
      if(ctx.state === "suspended") ctx.resume();
      return ctx;
    }catch(e){ return null; }
  }
  function tone(freq, t0, dur, type, vol, slide){
    const c = ac(); if(!c) return;
    const o = c.createOscillator(), g = c.createGain();
    o.type = type || "sine";
    o.frequency.setValueAtTime(freq, c.currentTime + t0);
    if(slide) o.frequency.exponentialRampToValueAtTime(slide, c.currentTime + t0 + dur);
    g.gain.setValueAtTime(0.0001, c.currentTime + t0);
    g.gain.exponentialRampToValueAtTime(vol || 0.12, c.currentTime + t0 + 0.012);
    g.gain.exponentialRampToValueAtTime(0.0001, c.currentTime + t0 + dur);
    o.connect(g); g.connect(c.destination);
    o.start(c.currentTime + t0);
    o.stop(c.currentTime + t0 + dur + 0.05);
  }
  return {
    tap(){ tone(660, 0, .08, "sine", .07); },
    pick(){ tone(520, 0, .07, "triangle", .09); tone(780, .05, .09, "sine", .07); },
    correct(combo){
      const base = 523.25 * Math.pow(1.059463, Math.min(12, (combo||1)-1)); // rises with combo, caps +1 octave
      tone(base, 0, .12, "sine", .12);
      tone(base*1.25, .07, .12, "sine", .11);
      tone(base*1.5, .14, .2, "sine", .1);
    },
    wrong(){ tone(196, 0, .18, "triangle", .1, 150); tone(147, .12, .22, "triangle", .08, 110); },
    seal(){ [523.25,659.25,783.99,1046.5].forEach((f,i)=> tone(f, i*.09, .34, "sine", .12)); tone(2093, .4, .5, "sine", .05); },
    chest(){ tone(120, 0, .16, "square", .06, 90); tone(220, .12, .1, "triangle", .07); },
    fanfare(){ [523.25,659.25,783.99,1046.5,1318.5].forEach((f,i)=> tone(f, i*.1, .4, "triangle", .1)); tone(1568, .55, .6, "sine", .07); },
    milestone(){ [392,523.25,659.25,783.99].forEach((f,i)=> tone(f, i*.08, .3, "sine", .11)); },
    gift(){ tone(880, 0, .3, "sine", .09, 1760); tone(1318.5, .18, .3, "sine", .08); tone(1760, .32, .4, "sine", .07); },
    whoosh(){ tone(300, 0, .25, "sine", .05, 900); },
    tick(){ tone(880, 0, .04, "square", .03); }
  };
})();

/* =========================================================
   FX — lightweight canvas confetti (bursts + celebrations)
   ========================================================= */
const FX = (function(){
  const COLORS = ["#f4b942","#fbbf24","#22d3ee","#34d399","#a78bfa","#ffffff","#fb923c"];
  let canvas = null, cx = null, parts = [], raf = null;
  const reduced = ()=> window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  function ensure(){
    if(!canvas){
      canvas = document.createElement("canvas");
      canvas.id = "fxCanvas";
      document.body.appendChild(canvas);
      cx = canvas.getContext("2d");
    }
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
  }
  function spawn(n, x, y, spread, up){
    for(let i=0;i<n;i++){
      const a = (Math.random()*spread - spread/2) * Math.PI/180 - Math.PI/2;
      const sp = 3 + Math.random()*(up||7);
      parts.push({
        x, y,
        vx: Math.cos(a)*sp, vy: Math.sin(a)*sp,
        w: 4+Math.random()*5, h: 3+Math.random()*4,
        rot: Math.random()*Math.PI, vr: (Math.random()-.5)*.3,
        color: COLORS[Math.floor(Math.random()*COLORS.length)],
        life: 60 + Math.random()*40, round: Math.random()<.3
      });
    }
    if(!raf) loop();
  }
  function loop(){
    raf = requestAnimationFrame(()=>{
      cx.clearRect(0,0,canvas.width,canvas.height);
      parts = parts.filter(p=>p.life>0 && p.y < canvas.height+20);
      parts.forEach(p=>{
        p.x += p.vx; p.y += p.vy; p.vy += 0.22; p.vx *= .99; p.rot += p.vr; p.life -= 1;
        cx.save();
        cx.translate(p.x, p.y);
        cx.rotate(p.rot);
        cx.globalAlpha = Math.max(0, Math.min(1, p.life/30));
        cx.fillStyle = p.color;
        if(p.round){ cx.beginPath(); cx.arc(0,0,p.w/2,0,7); cx.fill(); }
        else cx.fillRect(-p.w/2, -p.h/2, p.w, p.h);
        cx.restore();
      });
      if(parts.length) loop();
      else { raf = null; cx.clearRect(0,0,canvas.width,canvas.height); }
    });
  }
  return {
    burst(x, y, opts){
      if(reduced()) return;
      ensure();
      spawn((opts&&opts.count)||26, x, y, (opts&&opts.spread)||120, (opts&&opts.power)||7);
    },
    burstAt(el, opts){
      if(!el || reduced()) return;
      const r = el.getBoundingClientRect();
      this.burst(r.left + r.width/2, r.top + r.height/2, opts);
    },
    rain(opts){
      if(reduced()) return;
      ensure();
      const n = (opts&&opts.count)||90;
      for(let i=0;i<4;i++){
        spawn(Math.ceil(n/4), canvas.width*(0.15+0.7*Math.random()), canvas.height*0.22, 160, 10);
      }
    }
  };
})();

  const start = currentStreakStart();
  const todayIso = localISODate();
  return Array.from({length:n},(_,i)=>{
    const d=addLocalDays(start,i), iso=isoForDate(d), step=i+1;
    const rec=state.calendar[iso];
    return {iso, step, dow:"SMTWTFS"[d.getDay()], isToday:iso===todayIso, isFuture:iso>todayIso, rec, milestone:CHECKIN_MILESTONES.find(m=>m.day===step)||null};
  });
}
function currentJourneyWeek(){
  const all=journeyDays(35);
  const currentStep=Math.max(1,state.streak||1);
  const chapterStart=Math.floor((currentStep-1)/7)*7;
  return all.slice(chapterStart,chapterStart+7);
}

function topProgressingAchievements(n){
  return ACHIEVEMENTS
    .filter(a=>!state.achv.unlocked[a.id])
    .map(a=>({a, cur:achvCur(a), pct:achvCur(a)/a.goal}))
    .sort((x,y)=> y.pct - x.pct || x.a.goal - y.a.goal)
    .slice(0, n||5);
}
let _achvBusy = false;
function checkAchievements(){
  if(_achvBusy) return [];
  _achvBusy = true;
  const fresh = [];
  try{
    for(let pass=0; pass<3; pass++){
      let any = false;
      ACHIEVEMENTS.forEach(a=>{
        if(state.achv.unlocked[a.id]) return;
        if(achvCur(a) >= a.goal){
          state.achv.unlocked[a.id] = Date.now();
          state.xp += 10;
          fresh.push(a);
          any = true;
        }
      });
      if(!any) break;
    }
    if(fresh.length){
      persistState();
      if(fresh.length > 2){
        setTimeout(()=>{ showToast(`🏆 <strong>${fresh.length} achievements unlocked!</strong><br><span style="font-size:11.5px;color:#9db4d6;">Tap the 🏆 trophy up top to see them all.</span>`, true); SFX.milestone(); FX.rain({count:80}); }, 350);
      } else {
        fresh.forEach((a,i)=> setTimeout(()=>{
          showToast(`🏆 Achievement unlocked: <strong>${a.emoji} ${a.name}</strong><br><span style="font-size:11.5px;color:#9db4d6;">${a.desc} · +10 XP</span>`, true);
          SFX.milestone(); FX.rain({count:55});
        }, 350 + i*2600));
      }
      const hdr = document.querySelector(".hdr-achv-n");
      if(hdr) hdr.textContent = achvUnlockedCount();
    }
  } finally { _achvBusy = false; }
  return fresh;
}

/* =========================================================
   SHARE — share a sealed relic (image card when possible),
   or plain victory text. Everything degrades gracefully:
   Web Share API → clipboard copy → manual.
   ========================================================= */
function bumpShares(){ state.shares = (state.shares||0)+1; saveState(); }
async function shareText(text){
  try{
    if(navigator.share){ await navigator.share({text}); bumpShares(); return true; }
  }catch(e){ if(e && e.name === "AbortError") return false; }
  try{
    await navigator.clipboard.writeText(text);
    showToast("📋 <strong>Copied!</strong> Paste it anywhere to share.", true);
    bumpShares();
    return true;
  }catch(e){}
  showToast("Couldn't open sharing on this device.");
  return false;
}
function shareTextForVerse(v){
  const r = relicFor(v);
  const fl = floorOf(v);
  return `✦ I memorized ${v.ref} in Scripture Quest! “${r.motto}” — that's ${sealedTotal()} verse${sealedTotal()===1?"":"s"} sealed${fl?` and Floor ${fl} of ${TOWERS[v.volume].name} lit`:""}. 🏰🔥`;
}
function drawShareCanvas(v, done){
  const r = relicFor(v);
  const d = difficultyForVerse(v);
  const fl = floorOf(v);
  const W = 1000, H = 1250;
  const c = document.createElement("canvas");
  c.width = W; c.height = H;
  const x = c.getContext("2d");
  const finish = ()=>{
    /* frame + text over whatever art landed */
    x.strokeStyle = "rgba(244,185,66,.85)"; x.lineWidth = 6;
    x.strokeRect(28, 28, W-56, H-56);
    x.strokeStyle = "rgba(244,185,66,.35)"; x.lineWidth = 2;
    x.strokeRect(44, 44, W-88, H-88);
    x.textAlign = "center";
    x.fillStyle = "#f4b942";
    x.font = "900 34px Georgia, serif";
    x.fillText("✦ SCRIPTURE QUEST ✦", W/2, 118);
    x.fillStyle = "#ffffff";
    x.font = "800 72px Georgia, serif";
    x.fillText(v.ref, W/2, 800);
    x.fillStyle = "#fde68a";
    x.font = "italic 700 40px Georgia, serif";
    wrapText(x, `“${r.motto}”`, W/2, 875, W-200, 52);
    x.fillStyle = "#9db4d6";
    x.font = "800 30px Georgia, serif";
    x.fillText(`${r.name} · ${d.trim.metal} relic`, W/2, 1010);
    x.fillStyle = "#aabbd8";
    x.font = "800 28px Georgia, serif";
    x.fillText(`✦ Sealed${fl ? ` · Floor ${fl} of ${TOWERS[v.volume].name}` : ""}`, W/2, 1062);
    x.fillStyle = "#f4b942";
    x.font = "900 30px Georgia, serif";
    x.fillText(`${sealedTotal()} verses sealed · ${state.streak}-day streak 🔥`, W/2, 1150);
    done(c);
  };
  const wrapText = (ctx, text, cx2, cy, maxW, lh)=>{
    const words = text.split(" ");
    let line = "", lines = [];
    words.forEach(w=>{
      const t = line ? line+" "+w : w;
      if(ctx.measureText(t).width > maxW && line){ lines.push(line); line = w; }
      else line = t;
    });
    if(line) lines.push(line);
    lines.forEach((l,i)=> ctx.fillText(l, cx2, cy + i*lh));
  };
  /* backdrop */
  const g = x.createLinearGradient(0,0,0,H);
  g.addColorStop(0,"#070d1f"); g.addColorStop(.55,"#0b2d42"); g.addColorStop(1,"#134e6b");
  x.fillStyle = g; x.fillRect(0,0,W,H);
  const rad = x.createRadialGradient(W/2, 440, 40, W/2, 440, 420);
  rad.addColorStop(0,"rgba(244,185,66,.35)"); rad.addColorStop(1,"rgba(244,185,66,0)");
  x.fillStyle = rad; x.fillRect(0,0,W,H);
  if(RELIC_IMAGES && r.designed){
    const img = new Image();
    img.onload = ()=>{ try{ x.drawImage(img, W/2-260, 180, 520, 520); }catch(e){} finish(); };
    img.onerror = ()=>{ x.font = "300px serif"; x.textAlign="center"; x.fillText(r.emoji, W/2, 560); finish(); };
    img.src = `relics/${v.id}.webp`;
  } else {
    x.font = "300px serif"; x.textAlign = "center"; x.fillText(r.emoji, W/2, 560);
    finish();
  }
}
function openSharePop(v){
  const pop = document.getElementById("sharePop");
  if(!pop) return;

  });
  const nat = document.getElementById("shareNative");
  if(nat) nat.onclick = async ()=>{
    try{
      const payload = {text};
      if(cardBlob && navigator.canShare){
        const file = new File([cardBlob], "scripture-quest.png", {type:"image/png"});
        if(navigator.canShare({files:[file]})) payload.files = [file];
      }
      await navigator.share(payload);
      bumpShares();
      close();
    }catch(e){ if(!e || e.name !== "AbortError") shareText(text); }
  };
  document.getElementById("shareCopy").onclick = async ()=>{
    try{
      await navigator.clipboard.writeText(text);
      showToast("📋 <strong>Copied!</strong> Paste it anywhere to share.", true);
      bumpShares();
    }catch(e){ showToast("Couldn't copy on this device."); }
  };
}

function ensureArenaQuests(a){
  const today = todayStr();
  if(!a.quests || a.quests.date !== today){
    const picks = shuffleArr(ARENA_QUEST_POOL).slice(0,3);
    a.quests = {
      date: today,
      list: picks.map(t=>({id:t.id, progress:0, goal:t.goal, done:false}))

  a.questBadges = a.questBadges || [];

}
function questDef(id){ return ARENA_QUEST_POOL.find(t=>t.id===id); }
function bumpArenaQuests(a, matchFn, amount){
  const q = ensureArenaQuests(a);
  let anyDone = [];
  q.list.forEach(inst=>{
    if(inst.done) return;
    const def = questDef(inst.id);
    if(!def || !matchFn(def)) return;
    inst.progress = Math.min(inst.goal, inst.progress + amount);
    if(inst.progress >= inst.goal){
      inst.done = true;
      a.questBadges.push({id:def.id, name:def.name, emoji:def.emoji, chest:def.chest, earnedAt:Date.now()});
      anyDone.push(def);

function setArenaQuestProgress(a, matchFn, value){
  const q = ensureArenaQuests(a);

  q.list.forEach(inst=>{
    if(inst.done) return;
    const def = questDef(inst.id);
    if(!def || !matchFn(def)) return;
    inst.progress = Math.min(inst.goal, Math.max(inst.progress, value));
    if(inst.progress >= inst.goal){
      inst.done = true;
      a.questBadges.push({id:def.id, name:def.name, emoji:def.emoji, chest:def.chest, earnedAt:Date.now()});

function ensureArena(){
  if(!state.arena) state.arena = {};
  const a = state.arena;
  a.filters = a.filters || {status:"all", books: VOLUME_ORDER.slice()};
  if(!a.filters.books || !a.filters.books.length) a.filters.books = VOLUME_ORDER.slice();

function bookAreas(vol){

  return areas;

function grandAreas(){
  const sorted = shuffleArr(VERSES).sort((a,b)=>difficultyForVerse(a).index - difficultyForVerse(b).index);
  const areas = [];

  return areas;

function arenaFilteredPool(){
  const a = ensureArena();
  return VERSES.filter(v=>{
    if(!a.filters.books.includes(v.volume)) return false;
    const p = state.progress[v.id];
    if(a.filters.status==="memorized") return p.sealed;
    if(a.filters.status==="not_yet") return !p.sealed;
    return true;
  });
