/* =========================================================
   ScriptureProfiles — standalone username + profile store
   ---------------------------------------------------------
   Storage: localStorage["scriptureProfiles_v1"] =
     { profiles: { <username>: {
         id:"usr_xxxxxxxx", username, heroId, collection,
         pinHash, createdAt, lastLogin } } }

   Interfacing with the tower app:
   index.html already namespaces its save per player when
   given ?climber=<name>  (STORE_KEY = "lineUponLine_v1::<name>").
   So "playing as" a profile = open index.html?climber=<username>.
   ========================================================= */
const ScriptureProfiles = {
  KEY: "scriptureProfiles_v1",
  _load(){ try{ return JSON.parse(localStorage.getItem(this.KEY)) || {profiles:{}}; }catch(e){ return {profiles:{}}; } },
  _save(db){ localStorage.setItem(this.KEY, JSON.stringify(db)); },
  list(){ const db=this._load(); return Object.values(db.profiles).sort((a,b)=>(b.lastLogin||"").localeCompare(a.lastLogin||"")); },
  exists(u){ return !!this._load().profiles[u]; },
  async create(username, heroId, collection, pin){
    const db = this._load();
    if(db.profiles[username]) throw new Error("taken");
    db.profiles[username] = {
      id: "usr_" + Math.random().toString(16).slice(2,10),
      username, heroId, collection,
      pinHash: await hashPin(username, pin),
      createdAt: new Date().toISOString(), lastLogin: null
    };
    this._save(db);
    return db.profiles[username];
  },
  async verify(username, pin){
    const db = this._load(); const p = db.profiles[username];
    if(!p) return false;
    if(p.pinHash !== await hashPin(username, pin)) return false;
    p.lastLogin = new Date().toISOString(); this._save(db);
    return true;
  },
  remove(username){ const db=this._load(); delete db.profiles[username]; this._save(db); }
};
async function hashPin(username, pin){
  const msg = "sq::" + username + "::" + pin;
  if(crypto.subtle){
    const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(msg));
    return [...new Uint8Array(buf)].map(b=>b.toString(16).padStart(2,"0")).join("");
  }
  /* file:// fallback: simple deterministic hash */
  let h=0x811c9dc5; for(const c of msg){ h^=c.charCodeAt(0); h=Math.imul(h,0x01000193)>>>0; }
  return "f_" + h.toString(16);
}

/* Combined-username safety net (plan §21–24, §36): the allowlist is the real
   guard; this catches bad data edits. */
const BLOCKED_TERMS = ["jesus","christ","messiah","savior","redeemer","jehovah","lord","holyghost","heavenlyfather",
  "admin","moderator","support","official","staff","bishop","prophet","apostle","president","verified",
  "korihor","kingnoah","sherem","nehor","amalickiah","gadianton","judasiscariot","herod","jezebel","cain","goliath"];
function validateUsername(u){
  const n = u.toLowerCase();
  if(!u) return "Empty username.";
  if(u.length > 30) return "Too long.";
  if(!/^[A-Za-z]+$/.test(u)) return "Unsupported characters.";
  for(const t of BLOCKED_TERMS) if(n.includes(t)) return "Contains a reserved word.";
  return null;
}
const FEMALE_IDS = new Set(["bom_sariah","bom_abish","ot_ruth","ot_esther","ot_deborah","ot_hannah","nt_lydia","nt_tabitha","nt_mary_mag"]);
function heroesFor(collId){ return collId==="any" ? HEROES : HEROES.filter(h=>h.coll===collId); }
function randomPicks(pool, n){
  const shuffled = [...pool].sort(()=>Math.random()-.5).slice(0,n);
  return shuffled.map(h=>{
    const picks = quickPicks(h);
    return {hero:h, u:picks[Math.floor(Math.random()*picks.length)]};
  });
}
let homePicks = null;
function rollHomePicks(){
  homePicks = {
    m: randomPicks(HEROES.filter(h=>!FEMALE_IDS.has(h.id)), 3),
    f: randomPicks(HEROES.filter(h=>FEMALE_IDS.has(h.id)), 3)
  };
}
function quickPicks(h){
  const out = [];
  h.traits.slice(0,4).forEach(t=>out.push(t+h.token));
  h.likes.slice(0,3).forEach(l=>out.push(l+h.token));
  h.titles.slice(0,2).forEach(t=>out.push(h.token+t));
  h.symbols.slice(0,3).forEach(s=>out.push(h.token+s));
  return out.filter(u=>!validateUsername(u));
}

      <div class="stepSub">Tap a ready-made name, or make your own below.</div>
      <div class="sugCols">
        <div>${col(homePicks.m)}</div>
        <div>${col(homePicks.f)}</div>
      </div>
      <div class="back" style="margin:2px 0 10px" onclick="rollHomePicks();render()">🔄 Show me different names</div>
      <button class="bigbtn" onclick="surprise()"><div class="t">🎲 Surprise Me</div>
        <div class="d">Let the app choose a safe scripture username for you.</div></button>
      <button class="bigbtn" onclick="go({screen:'book',path:'quick'})"><div class="t">⚡ Quick Pick</div>
        <div class="d">Choose from usernames already made for scripture heroes.</div></button>
      <button class="bigbtn" onclick="go({screen:'book',path:'build'})"><div class="t">🛠️ Build Your Own</div>
        <div class="d">Combine approved words to make your own safe scripture username.</div></button>`;
  }
  else if(s==="book"){
    html += `<div class="stepTitle">Choose a book of scripture</div>`;
    COLLECTIONS.forEach(c=>{
      html += `<button class="bigbtn" onclick='go({screen:"hero",coll:"${c.id}"})'><div class="t">${c.label}</div><div class="d">${c.desc}</div></button>`;
    });
    html += `<div class="back" onclick="go({screen:'home'})">◂ Back</div>`;
  }
  else if(s==="hero"){
    html += `<div class="stepTitle">Choose a scripture hero</div><div class="grid">`;
    heroesFor(S.coll).forEach(h=>{
      html += `<div class="card" onclick='pickHero("${h.id}")'><div class="nm">${esc(h.name)}</div><div class="ds">${esc(h.desc)}</div></div>`;
    });
    html += `</div><div class="back" onclick="go({screen:'book'})">◂ Back</div>`;
  }
  else if(s==="quickpick"){
    const h = S.hero;
    html += `<div class="stepTitle">Choose a ${esc(h.name)} username</div>
      <div class="story"><b>${esc(h.name)}</b> — ${esc(h.story)}</div><div class="pillwrap">`;
    quickPicks(h).forEach(u=>{ html += `<span class="pill" onclick='choose("${u}")'>${u}</span>`; });
    html += `</div>
      <button class="cta ghost" onclick="go({screen:'hero'})">Choose another hero</button>
      <div class="back" onclick="go({screen:'book'})">◂ Back</div>`;
  }
  else if(s==="style"){
    const h = S.hero;
    html += `<div class="stepTitle">How should your ${esc(h.name)} username sound?</div>`;
    STYLES.forEach(st=>{
      html += `<button class="bigbtn" onclick='go({screen:"word",style:"${st.id}"})'><div class="t">${st.label}</div><div class="d">Like: ${st.hint}</div></button>`;
    });
    html += `<div class="back" onclick="go({screen:'hero'})">◂ Back</div>`;
  }
  else if(s==="word"){
    const h = S.hero, st = STYLES.find(x=>x.id===S.style);
    html += `<div class="stepTitle">Pick a word</div><div class="stepSub">${st.label} + ${esc(h.name)}</div><div class="pillwrap">`;
    st.how(h).forEach(v=>{
      const u = st.make(h,v);
      if(!validateUsername(u)) html += `<span class="pill" onclick='choose("${u}")'>${u}</span>`;
    });
    html += `</div><div class="back" onclick="go({screen:'style'})">◂ Back</div>`;
  }
  else if(s==="confirm"){
    const h = S.hero, taken = ScriptureProfiles.exists(S.candidate);
    html += `<div class="stepTitle">Your scripture username</div>
      <div class="preview">${S.candidate}</div>
      <div class="story"><b>Why ${esc(h.name)}?</b> ${esc(h.story)}</div>
      ${taken?`<div class="err">Someone on this device already uses that name — pick another!</div>`:""}
      <button class="cta" ${taken?"disabled":""} onclick="go({screen:'pin',pin:'',pin2:''})">Use this username ▸</button>
      <button class="cta ghost" onclick="go({screen:S.path==='quick'?'quickpick':'style'})">Try another</button>
      <div class="back" onclick="go({screen:'hero'})">◂ Choose another hero</div>`;
  }
  else if(s==="pin"){
    const stage2 = S.pin.length===4;
    const cur = stage2 ? S.pin2 : S.pin;
    html += `<div class="stepTitle">${stage2?"Type it once more":"Choose your secret number"}</div>
      <div class="stepSub">${stage2?"Just to make sure you remember it!":"Pick a 4-digit secret code — like your favorite number. You'll use it to sign in."}</div>
      <div class="preview" style="font-size:20px">${S.candidate}</div>
      ${pinPad(cur)}
      ${S.err?`<div class="err">${S.err}</div>`:""}
      <div class="back" onclick="go({screen:'confirm',pin:'',pin2:''})">◂ Back</div>`;
  }
  else if(s==="done"){
    html += `<div class="stepTitle">🎉 Welcome, climber!</div>
      <div class="preview">${S.candidate}</div>
      <div class="ok">${S.claimed ? "All your guest progress is now saved under this name!" : "Your profile is saved on this device. Remember your secret number!"}</div>
      <button class="cta" onclick="enterTower('${S.candidate}')">⛰️ Enter the Tower ▸</button>
      <button class="cta ghost" onclick="go({screen:'home'})">Make another profile</button>`;
  }
  else if(s==="login"){
    const profs = ScriptureProfiles.list();
    html += `<div class="stepTitle">Who's climbing today?</div>`;
    if(!profs.length) html += `<div class="stepSub">No profiles yet — create one first!</div>`;
    profs.forEach(p=>{
      const h = HEROES.find(x=>x.id===p.heroId);
      html += `<div class="profRow" onclick='go({screen:"loginPin",loginUser:"${p.username}",pin:""})'>
        <div class="av">🛡️</div><div><div class="un">${p.username}</div>
        <div class="hi">${h?esc(h.name):""} · ${COLLECTIONS.find(c=>c.id===p.collection)?.label||""}</div></div></div>`;
    });
  }
  else if(s==="loginPin"){
    html += `<div class="stepTitle">Hello, ${S.loginUser}!</div>
      <div class="stepSub">Type your secret number.</div>
      ${pinPad(S.pin)}
      ${S.err?`<div class="err">${S.err}</div>`:""}
      <div class="back" onclick="go({screen:'login'})">◂ Back</div>`;
  }
  app.innerHTML = html;
}
function pinPad(cur){
  let dots = `<div class="pinDots">`;
  for(let i=0;i<4;i++) dots += `<span class="${i<cur.length?"on":""}"></span>`;
  dots += `</div><div class="pad">`;
  [1,2,3,4,5,6,7,8,9].forEach(n=>dots+=`<button onclick="pinKey('${n}')">${n}</button>`);
  dots += `<button onclick="pinKey('back')">⌫</button><button onclick="pinKey('0')">0</button><button style="visibility:hidden"></button></div>`;
  return dots;
}
function pickHero(id){
  S.hero = HEROES.find(h=>h.id===id);
  go({screen: S.path==="quick" ? "quickpick" : "style"});
}
function choose(u){ go({screen:"confirm", candidate:u}); }
function chooseHome(heroId, u){
  S.hero = HEROES.find(h=>h.id===heroId);
  S.path = "quick"; S.coll = S.hero.coll;
  go({screen:"confirm", candidate:u});
}
function surprise(){
  const h = HEROES[Math.floor(Math.random()*HEROES.length)];
  const picks = quickPicks(h);
  S.hero = h; S.path = "quick"; S.coll = h.coll;
  go({screen:"confirm", candidate: picks[Math.floor(Math.random()*picks.length)]});
}
async function pinKey(k){
  const stage2 = S.screen==="pin" && S.pin.length===4;
  const field = S.screen==="loginPin" ? "pin" : (stage2 ? "pin2" : "pin");
  if(k==="back"){ S[field] = S[field].slice(0,-1); render(); return; }
  if(S[field].length>=4) return;
  S[field] += k; S.err="";
  if(S[field].length===4){
    if(S.screen==="loginPin"){
      if(await ScriptureProfiles.verify(S.loginUser, S.pin)){ enterTower(S.loginUser); }
      else { S.pin=""; S.err="That's not it — try again!"; }
    } else if(stage2){
      if(S.pin===S.pin2){
        const bad = validateUsername(S.candidate);
        if(bad){ S.err = bad; S.screen="confirm"; }
        else{
          await ScriptureProfiles.create(S.candidate, S.hero.id, S.hero.coll, S.pin);
          S.claimed = CLAIMING && adoptGuestSave(S.candidate);
          S.screen = "done";
        }
      } else { S.pin2=""; S.err="Those didn't match — try again."; }
    }
  }
  render();
}
const CLAIMING = new URLSearchParams(location.search).has("claim");
/* Guest → profile adoption: move the anonymous tower save under the
   new username's namespaced key (index.html STORE_KEY convention). */
function adoptGuestSave(username){
  try{
    const guest = localStorage.getItem("lineUponLine_v1");
    const targetKey = "lineUponLine_v1::" + username;
    if(guest && !localStorage.getItem(targetKey)){
      localStorage.setItem(targetKey, guest);
      localStorage.removeItem("lineUponLine_v1");
      return true;
    }
  }catch(e){}
  return false;
}
function enterTower(username){
  try{ localStorage.setItem("sq_activeClimber", username); }catch(e){}
  location.href = "index.html?climber=" + encodeURIComponent(username);
}
render();
</script>
</body>
</html>
